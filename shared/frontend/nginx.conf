map $http_x_request_id $correlation_request_id {
    "~^[A-Za-z0-9][A-Za-z0-9._:/-]{0,199}$" $http_x_request_id;
    default $request_id;
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $data_platform_upstream http://propertyscope-backend:5201;
    set $data_platform_frontend_upstream http://propertyscope-frontend:8080;
    set $ai_mode_upstream http://ai-mode:5005;
    proxy_hide_header X-Request-ID;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /features/data-platform {
        return 308 /features/data-platform/;
    }

    location /features/data-platform/ {
        rewrite ^/features/data-platform/(.*)$ /$1 break;
        proxy_pass $data_platform_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $correlation_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /features/data-platform;
        proxy_read_timeout 10s;
    }

    location ~ ^/features/(market-intelligence|suburb-analytics|due-diligence|buyer-workspaces)(/|$) {
        return 307 /#features;
    }

    location = /operations/ai-mode {
        return 308 /operations/ai-mode/;
    }

    location /operations/ai-mode/ {
        proxy_pass $ai_mode_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $correlation_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location = /api/shared-health/data-platform {
        proxy_pass $data_platform_upstream/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $correlation_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 6s;
    }

    location = /api/shared-health/ai-mode {
        proxy_pass $ai_mode_upstream/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $correlation_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 6s;
    }

    location /api/data-platform/ {
        proxy_pass $data_platform_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $correlation_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location /api/ai-mode/ {
        rewrite ^/api/ai-mode/(.*)$ /api/v1/$1 break;
        proxy_pass $ai_mode_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $correlation_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location /api/v1/ {
        proxy_pass $ai_mode_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $correlation_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location /api/ {
        default_type application/problem+json;
        add_header X-Request-ID $correlation_request_id always;
        add_header X-Content-Type-Options nosniff always;
        return 404 '{"type":"about:blank","title":"API route not found","status":404,"detail":"No public API is registered at this path.","code":"route_not_found","request_id":"$correlation_request_id"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Request-ID $correlation_request_id always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}
