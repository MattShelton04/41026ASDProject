[project]
name = "shared-testkit"
version = "0.1.0"
description = "Reusable test assertions and fakes for ASD project services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-core",
    "shared-contracts",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "python"

[tool.uv.sources]
agent-core = { workspace = true }
