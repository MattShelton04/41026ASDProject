# Reviewed security exceptions for the pre-commit security scans (R2-30, R2-31).
#
# Every entry needs a reason a reviewer can check and a follow-up that removes it.
# `uv run scripts/dev.py security report` renders this file into
# docs/release-2/evidence/security/pre-commit-report.md, and flags entries that no longer match a
# finding so they can be deleted.

# ---------------------------------------------------------------------------------------------
# pip-audit: known vulnerabilities that cannot be removed inside the current constraints.
# The pip-audit hook passes each `id` to `pip-audit --ignore-vuln`.
# ---------------------------------------------------------------------------------------------

[[pip_audit]]
package = "pillow"
ids = [
    "PYSEC-2026-165",
    "PYSEC-2026-2249",
    "PYSEC-2026-2250",
    "PYSEC-2026-2251",
    "PYSEC-2026-2252",
    "PYSEC-2026-2253",
    "PYSEC-2026-2254",
    "PYSEC-2026-2255",
    "PYSEC-2026-2256",
    "PYSEC-2026-2257",
    "PYSEC-2026-2874",
    "PYSEC-2026-3451",
    "PYSEC-2026-3453",
    "PYSEC-2026-3454",
    "PYSEC-2026-3493",
    "PYSEC-2026-3494",
    "PYSEC-2026-3495",
    "PYSEC-2026-3496",
]
reason = """\
Image-decoding flaws fixed in Pillow 12.x. The lock cannot move past 11.3.0 because \
rag-server pins fastembed==0.7.4, which requires pillow<12. PropertyScope never decodes \
untrusted images: RAG embeds text only, and the dev-only report/visual tools open screenshots \
the project captured itself. No feature service imports Pillow."""
follow_up = """\
Shared: move rag-server to fastembed>=0.9 (allows pillow 12.3) together with a RAG re-ingest \
and the retrieval evaluation, then delete this entry."""
reviewed = "2026-10-09"

[[pip_audit]]
package = "pytest"
ids = ["PYSEC-2026-1845"]
reason = """\
pytest <9.0.3 trusts predictable /tmp/pytest-of-<user> directories, so another local user on a \
shared UNIX host could interfere with test temp files. Dev/CI-only tool: it is not installed in \
any service image, CI runs on single-tenant ephemeral GitHub runners, and developer machines \
are single-user. The fix is only in pytest 9, outside the reviewed pytest>=8.4,<9 constraint."""
follow_up = """\
Shared: upgrade the root dev group to pytest>=9.0.3 in a dedicated change and run every \
feature suite, then delete this entry."""
reviewed = "2026-10-09"

