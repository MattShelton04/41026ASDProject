[project]
name = "asd-project-workspace"
version = "0.1.0"
description = "Development workspace for the 41026 ASD group project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.25,<5",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5,<2",
    "hypothesis>=6.138,<7",
    "mypy>=1.18,<2",
    "pillow>=11,<13",
    "pip-audit>=2.9,<3",
    "playwright>=1.55,<2",
    "pre-commit>=4.3,<5",
    "psutil>=7.2.2",
    "pypdf>=6,<7",
    "pytest>=8.4,<9",
    "pytest-cov>=7,<8",
    "reportlab>=4.4,<5",
    "ruff>=0.14,<1",
    "types-jsonschema>=4.25,<5",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0,<7",
    "types-waitress>=3.0.1.20260724",
    "waitress>=3.0.2",
]
visual = [
    "numpy>=2.2,<3",
    "pillow>=11,<13",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.uv.workspace]
members = [
    "shared/contracts",
    "shared/consumer-protocol",
    "shared/testkit",
    "shared/tool-runtime",
    "ai-services/mcp-server",
    "ai-services/rag-server",
    "student-1",
    "student-2",
    "student-3",
    "student-4",
    "student-5",
    "ai-services/agent-core",
    "ai-services/ai-mode",
]

[tool.uv.sources]
agent-core = { workspace = true }
shared-contracts = { workspace = true }
shared-consumer-protocol = { workspace = true }
shared-testkit = { workspace = true }
shared-tool-runtime = { workspace = true }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
testpaths = [
    "shared/contracts/tests",
    "shared/consumer-protocol/tests",
    "shared/testkit/tests",
    "ai-services/agent-core/tests",
    "ai-services/ai-mode/tests",
    "ai-services/mcp-server/tests",
    "ai-services/rag-server/tests",
    "shared/tool-runtime/tests",
    "student-1/tests",
    "student-2/tests",
    "student-3/tests",
    "student-4/tests",
    "student-5/tests",
    "scripts/tests",
]

[tool.coverage.run]
branch = true
source = ["agent_core", "ai_mode", "shared_consumer_protocol", "shared_contracts", "shared_testkit", "shared_tool_runtime", "mcp_server", "rag_server"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["Temp", "temp", "tmp"]
src = [
    "shared/contracts/python",
    "shared/consumer-protocol/python",
    "shared/testkit/python",
    "ai-services/agent-core/src",
    "ai-services/ai-mode/src",
    "student-1/backend/src",
    "student-1/database/src",
    "student-2/backend/src",
    "student-2/database/src",
    "student-3/backend/src",
    "student-3/database/src",
    "student-5/backend/src",
    "student-5/database/src",
    "student-4/backend/src",
    "student-4/database/src",
]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "RUF", "S", "SIM", "UP"]

# Security policy (R2-30). `S` is Ruff's flake8-bandit port. Outside the reviewed test-only
# exceptions below, a finding is fixed or carries `# noqa: Sxxx - reason` on that line.
# `scripts/security` reports every exception: uv run scripts/dev.py security report
[tool.ruff.lint.per-file-ignores]
# Tests: pytest asserts, fake fixture credentials, fixture temp paths and seeded randomness.
"**/tests/**" = ["S101", "S105", "S106", "S107", "S108", "S311"]
# Assertion helpers that exist only to be called from tests.
"shared/testkit/**" = ["S101"]
"scripts/ui_feature_smoke.py" = ["S101"]

# Release 2 F-6: owner to fix or justify; see docs/release-2/evidence/security/pre-commit-report.md
# Each entry lists only the rules found in that file when the scan was adopted. Remove an entry
# once the owner has fixed the findings or added a justified `# noqa`.
[tool.ruff.lint.extend-per-file-ignores]
"student-2/backend/src/propertyscope_market_intelligence/api.py" = ["S101"]
"student-2/database/src/propertyscope_market_store/api.py" = ["S101"]
"student-2/database/src/propertyscope_market_store/import_operations.py" = ["S101"]
"student-2/database/src/propertyscope_market_store/repository.py" = ["S101", "S608"]
"student-3/backend/src/propertyscope_suburb_analytics/app.py" = ["S104"]
"student-3/backend/src/propertyscope_suburb_analytics/clients.py" = ["S310"]
"student-3/database/src/propertyscope_suburb_store/app.py" = ["S104"]
"student-3/database/src/propertyscope_suburb_store/imports.py" = ["S608"]
"student-3/database/src/propertyscope_suburb_store/repository.py" = ["S608"]
"student-3/frontend/dev_server.py" = ["S310"]
"student-4/database/src/propertyscope_due_diligence_store/api.py" = ["S101"]
"student-4/database/src/propertyscope_due_diligence_store/repository.py" = ["S101", "S608"]
"student-5/backend/src/propertyscope_buyer_workspaces/clients.py" = ["S105", "S310"]
"student-5/database/src/propertyscope_buyer_store/api.py" = ["S105"]
"student-5/database/src/propertyscope_buyer_store/domain.py" = ["S101"]
"student-5/database/src/propertyscope_buyer_store/repository.py" = ["S101", "S608"]
"student-5/scripts/compose_smoke.py" = ["S101", "S310"]
"student-5/tests/test_migrations.py" = ["S608"]
"student-5/tests/test_repository.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = [
    "agent_core",
    "ai_mode",
    "propertyscope_data_platform",
    "propertyscope_data_store",
    "propertyscope_market_intelligence",
    "propertyscope_market_store",
    "propertyscope_suburb_analytics",
    "propertyscope_suburb_store",
    "propertyscope_buyer_workspaces",
    "propertyscope_buyer_store",
    "propertyscope_due_diligence",
    "propertyscope_due_diligence_store",
    "shared_consumer_protocol",
    "shared_contracts",
    "shared_testkit",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
