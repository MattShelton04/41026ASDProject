[project]
name = "asd-project-workspace"
version = "0.1.0"
description = "Development workspace for the 41026 ASD group project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.25,<5",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "hypothesis>=6.138,<7",
    "mypy>=1.18,<2",
    "pillow>=11,<13",
    "playwright>=1.55,<2",
    "pre-commit>=4.3,<5",
    "pypdf>=6,<7",
    "pytest>=8.4,<9",
    "pytest-cov>=7,<8",
    "reportlab>=4.4,<5",
    "ruff>=0.14,<1",
    "types-jsonschema>=4.25,<5",
    "types-pyyaml>=6.0,<7",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.uv.workspace]
members = [
    "shared/contracts",
    "shared/consumer-protocol",
    "shared/testkit",
    "student-1",
    "student-2",
    "student-3",
    "student-4",
    "student-5",
    "ai-services/agent-core",
    "ai-services/ai-mode",
]

[tool.uv.sources]
agent-core = { workspace = true }
shared-contracts = { workspace = true }
shared-consumer-protocol = { workspace = true }
shared-testkit = { workspace = true }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
testpaths = [
    "shared/contracts/tests",
    "shared/consumer-protocol/tests",
    "shared/testkit/tests",
    "ai-services/agent-core/tests",
    "ai-services/ai-mode/tests",
    "student-1/tests",
    "student-2/tests",
    "scripts/tests",
]

[tool.coverage.run]
branch = true
source = ["agent_core", "ai_mode", "shared_consumer_protocol", "shared_contracts", "shared_testkit"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "shared/contracts/python",
    "shared/consumer-protocol/python",
    "shared/testkit/python",
    "ai-services/agent-core/src",
    "ai-services/ai-mode/src",
    "student-1/backend/src",
    "student-1/database/src",
    "student-2/backend/src",
    "student-2/database/src",
    "student-4/backend/src",
    "student-4/database/src",
]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "agent_core",
    "ai_mode",
    "propertyscope_data_platform",
    "propertyscope_data_store",
    "propertyscope_market_intelligence",
    "propertyscope_market_store",
    "propertyscope_due_diligence",
    "propertyscope_due_diligence_store",
    "shared_consumer_protocol",
    "shared_contracts",
    "shared_testkit",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
