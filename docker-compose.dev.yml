name: ps-dev

services:
  shared-frontend:
    volumes:
      - ./shared/frontend:/usr/share/nginx/html:ro
      - ./shared/frontend/nginx.conf:/etc/nginx/templates/default.conf.template:ro

  f1-db-api:
    command:
      - gunicorn
      - --bind=0.0.0.0:5202
      - --workers=1
      - --threads=4
      - --reload
      - propertyscope_data_store.app:create_app()
    volumes:
      - ./student-1/database/src:/app/student-1/database/src:ro

  f1-db-loader:
    volumes:
      - ./student-1/database/src:/app/student-1/database/src:ro

  f1-backend:
    command:
      - gunicorn
      - --bind=0.0.0.0:5201
      - --workers=1
      - --threads=4
      - --reload
      - propertyscope_data_platform.app:create_app()
    volumes:
      - ./student-1/backend/src:/app/student-1/backend/src:ro
      - ./shared/contracts/python:/app/shared/contracts/python:ro

  f1-runner:
    volumes:
      - ./student-1/backend/src:/app/student-1/backend/src:ro
      - ./shared/contracts/python:/app/shared/contracts/python:ro

  f1-frontend:
    volumes:
      - ./student-1/frontend:/usr/share/nginx/html:ro
      - ./shared/frontend/design-system:/usr/share/nginx/html/design-system:ro
      - ./shared/frontend/browser:/usr/share/nginx/html/browser:ro
      - ./shared/frontend/ai-chat:/usr/share/nginx/html/ai-chat:ro
      - ./shared/frontend/mapping:/usr/share/nginx/html/mapping:ro
      - ./shared/frontend/vendor:/usr/share/nginx/html/vendor:ro
      - ./student-1/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  f2-db-api:
    command:
      - gunicorn
      - --bind=0.0.0.0:5302
      - --workers=1
      - --threads=4
      - --reload
      - propertyscope_market_store.app:create_app()
    volumes:
      - ./student-2/database/src:/app/student-2/database/src:ro
      - ./shared/contracts/python:/app/shared/contracts/python:ro

  f2-backend:
    command:
      - gunicorn
      - --bind=0.0.0.0:5301
      - --workers=1
      - --threads=4
      - --timeout=180
      - --graceful-timeout=30
      - --reload
      - propertyscope_market_intelligence.app:create_app()
    volumes:
      - ./student-2/backend/src:/app/student-2/backend/src:ro
      - ./shared/contracts/python:/app/shared/contracts/python:ro

  f2-frontend:
    volumes:
      - ./student-2/frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./student-2/frontend/app.js:/usr/share/nginx/html/app.js:ro
      - ./student-2/frontend/shell.js:/usr/share/nginx/html/shell.js:ro
      - ./student-2/frontend/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./student-2/frontend/integration:/usr/share/nginx/html/integration:ro
      - ./shared/frontend/browser:/usr/share/nginx/html/browser:ro
      - ./shared/frontend/design-system:/usr/share/nginx/html/design-system:ro
      - ./shared/frontend/ai-chat:/usr/share/nginx/html/ai-chat:ro
      - ./student-2/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  f3-database:
    command:
      - gunicorn
      - --bind=0.0.0.0:5302
      - --workers=1
      - --threads=4
      - --reload
      - propertyscope_suburb_store.app:create_app()
    volumes:
      - ./shared/contracts/python:/app/shared/contracts/python:ro
      - ./student-3/database/src:/app/student-3/database/src:ro

  f3-backend:
    command:
      - gunicorn
      - --bind=0.0.0.0:5301
      - --workers=1
      - --threads=4
      - --reload
      - propertyscope_suburb_analytics.app:create_app()
    volumes:
      - ./shared/contracts/python:/app/shared/contracts/python:ro
      - ./student-3/backend/src:/app/student-3/backend/src:ro

  f3-frontend:
    volumes:
      - ./student-3/frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./student-3/frontend/app.js:/usr/share/nginx/html/app.js:ro
      - ./student-3/frontend/shell.js:/usr/share/nginx/html/shell.js:ro
      - ./student-3/frontend/published.js:/usr/share/nginx/html/published.js:ro
      - ./student-3/frontend/trend.js:/usr/share/nginx/html/trend.js:ro
      - ./student-3/frontend/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./shared/frontend/design-system:/usr/share/nginx/html/design-system:ro
      - ./shared/frontend/browser:/usr/share/nginx/html/browser:ro
      - ./shared/frontend/ai-chat:/usr/share/nginx/html/ai-chat:ro
      - ./shared/frontend/mapping:/usr/share/nginx/html/mapping:ro
      - ./student-3/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  f4-db-api:
    command:
      - gunicorn
      - --bind=0.0.0.0:5402
      - --workers=1
      - --threads=4
      - --reload
      - propertyscope_due_diligence_store.app:create_app()
    volumes:
      - ./student-4/database/src:/app/student-4/database/src:ro
      - ./shared/contracts/python:/app/shared/contracts/python:ro

  f4-backend:
    command:
      - gunicorn
      - --bind=0.0.0.0:5401
      - --workers=1
      - --threads=4
      - --reload
      - propertyscope_due_diligence.app:create_app()
    volumes:
      - ./student-4/backend/src:/app/student-4/backend/src:ro
      - ./shared/contracts/python:/app/shared/contracts/python:ro

  f4-frontend:
    volumes:
      - ./shared/frontend/browser:/usr/share/nginx/html/browser:ro
      - ./student-4/frontend:/usr/share/nginx/html:ro
      - ./shared/frontend/design-system:/usr/share/nginx/html/design-system:ro
      - ./shared/frontend/mapping:/usr/share/nginx/html/mapping:ro
      - ./student-4/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  f5-db-api:
    command:
      - gunicorn
      - --bind=0.0.0.0:5502
      - --workers=1
      - --threads=4
      - --reload
      - propertyscope_buyer_store.app:create_app()
    volumes:
      - ./student-5/database/src:/app/student-5/database/src:ro
      - ./shared/contracts/python:/app/shared/contracts/python:ro

  f5-backend:
    command:
      - gunicorn
      - --bind=0.0.0.0:5501
      - --workers=1
      - --threads=4
      - --timeout=180
      - --graceful-timeout=30
      - --reload
      - propertyscope_buyer_workspaces.app:create_app()
    volumes:
      - ./student-5/backend/src:/app/student-5/backend/src:ro
      - ./shared/contracts/python:/app/shared/contracts/python:ro

  f5-frontend:
    volumes:
      - ./shared/frontend/ai-chat:/usr/share/nginx/html/ai-chat:ro
      - ./shared/frontend/browser:/usr/share/nginx/html/browser:ro
      - ./student-5/frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./student-5/frontend/app.js:/usr/share/nginx/html/app.js:ro
      - ./student-5/frontend/assistant.js:/usr/share/nginx/html/assistant.js:ro
      - ./student-5/frontend/shell.js:/usr/share/nginx/html/shell.js:ro
      - ./student-5/frontend/api.js:/usr/share/nginx/html/api.js:ro
      - ./student-5/frontend/models.js:/usr/share/nginx/html/models.js:ro
      - ./student-5/frontend/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./shared/frontend/design-system:/usr/share/nginx/html/design-system:ro
      - ./student-5/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
