name: ps-dev

services:
  shared-frontend:
    volumes:
      - ./shared/frontend:/usr/share/nginx/html:ro
      - ./shared/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  shared-ai-mode:
    command:
      - gunicorn
      - --bind=0.0.0.0:5005
      - --workers=1
      - --threads=4
      - --timeout=180
      - --graceful-timeout=30
      - --access-logfile=-
      - --error-logfile=-
      - --reload
      - --reload-extra-file=/etc/ai-mode/propertyscope-tools.yaml
      - ai_mode:create_app()
    volumes:
      - ./ai-services/agent-core/src:/app/ai-services/agent-core/src:ro
      - ./ai-services/ai-mode/src:/app/ai-services/ai-mode/src:ro
      - ./shared/contracts/python:/app/shared/contracts/python:ro
      - ./shared/frontend:/app/shared/frontend:ro

  f1-db-api:
    command:
      - gunicorn
      - --bind=0.0.0.0:5202
      - --workers=1
      - --threads=4
      - --reload
      - propertyscope_data_store.app:create_app()
    volumes:
      - ./student-1/database/src:/app/student-1/database/src:ro

  f1-db-loader:
    volumes:
      - ./student-1/database/src:/app/student-1/database/src:ro

  f1-backend:
    command:
      - gunicorn
      - --bind=0.0.0.0:5201
      - --workers=1
      - --threads=4
      - --reload
      - propertyscope_data_platform.app:create_app()
    volumes:
      - ./student-1/backend/src:/app/student-1/backend/src:ro
      - ./shared/contracts/python:/app/shared/contracts/python:ro

  f1-runner:
    volumes:
      - ./student-1/backend/src:/app/student-1/backend/src:ro
      - ./shared/contracts/python:/app/shared/contracts/python:ro

  f1-frontend:
    volumes:
      - ./student-1/frontend:/usr/share/nginx/html:ro
      - ./shared/frontend/design-system:/usr/share/nginx/html/design-system:ro
      - ./shared/frontend/browser:/usr/share/nginx/html/browser:ro
      - ./shared/frontend/mapping:/usr/share/nginx/html/mapping:ro
      - ./student-1/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
