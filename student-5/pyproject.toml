[project]
name = "student-5-feature"
version = "0.1.0"
description = "PropertyScope buyer journey and agent workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
    "shared-contracts",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["database/src"]

[tool.setuptools.package-data]
propertyscope_buyer_store = ["sql/*.sql"]
