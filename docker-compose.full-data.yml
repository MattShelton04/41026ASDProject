# Explicit opt-in overlay for retained, source-scale PropertyScope data.
# Invoke only through `uv run scripts/dev.py stack <action> --full-data`.
name: propertyscope-full-data

services:
  feature-1-database-api:
    profiles: [full-data]
    mem_limit: ${PROPERTYSCOPE_DATABASE_MEMORY_LIMIT:-4g}
    cpus: ${PROPERTYSCOPE_DATABASE_CPU_LIMIT:-4.0}

  feature-1-database-loader:
    profiles: [full-data]
    mem_limit: ${PROPERTYSCOPE_LOADER_MEMORY_LIMIT:-8g}
    cpus: ${PROPERTYSCOPE_LOADER_CPU_LIMIT:-6.0}

  feature-1-runner:
    profiles: [full-data]
    environment:
      PROPERTYSCOPE_FULL_DATA_ENABLED: "true"
      PROPERTYSCOPE_SOURCE_CREDENTIAL_FILE: ${PROPERTYSCOPE_SOURCE_CREDENTIAL_FILE:-}
      PROPERTYSCOPE_GNAF_ARCHIVE_PATH: /var/lib/propertyscope/source-cache/gnaf.zip
      PROPERTYSCOPE_GNAF_CRS: ${PROPERTYSCOPE_GNAF_CRS:-GDA94}
      PROPERTYSCOPE_PSI_ARCHIVE_ROOT: /var/lib/propertyscope/source-cache/psi
      PROPERTYSCOPE_RUNNER_LEASE_SECONDS: "300"
    volumes:
      - ./.propertyscope-source-cache:/var/lib/propertyscope/source-cache:ro
    mem_limit: ${PROPERTYSCOPE_RUNNER_MEMORY_LIMIT:-8g}
    cpus: ${PROPERTYSCOPE_RUNNER_CPU_LIMIT:-6.0}

  feature-1-backend:
    profiles: [full-data]
    environment:
      PROPERTYSCOPE_FULL_DATA_ENABLED: "true"
      PROPERTYSCOPE_PSI_TRANSPORT_ENABLED: ${PROPERTYSCOPE_PSI_TRANSPORT_ENABLED:-false}
      PROPERTYSCOPE_PSI_CACHED_YEARS: ${PROPERTYSCOPE_PSI_CACHED_YEARS:-}
      PROPERTYSCOPE_PSI_CACHED_WEEKS: ${PROPERTYSCOPE_PSI_CACHED_WEEKS:-}
