[project]
name = "mcp-server"
version = "0.1.0"
description = "Shared Release 1 tool runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared-tool-runtime",
    "mcp>=1.28,<2",
    "uvicorn>=0.35,<1",
    "shared-contracts",
    "jsonschema>=4.25,<5",
    "anyio>=4.5,<5",
    "starlette>=0.52.1,<2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
shared-contracts = { workspace = true }
