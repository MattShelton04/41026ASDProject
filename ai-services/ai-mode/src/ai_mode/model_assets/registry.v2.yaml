schema_version: 2
default_profile: remote-standard.v1
models:
  - key: gpt-5.6-luna
    provider: openai
    model_id: gpt-5.6-luna
    maximum_context_tokens: 1050000
    maximum_output_tokens: 128000
    source_url: https://developers.openai.com/api/docs/models/gpt-5.6-luna
    description: Cost-sensitive GPT-5.6 model selected for frequent implementation planning.
  - key: gpt-5.6-terra
    provider: openai
    model_id: gpt-5.6-terra
    maximum_context_tokens: 1050000
    maximum_output_tokens: 128000
    source_url: https://developers.openai.com/api/docs/models/gpt-5.6-terra
    description: Balanced GPT-5.6 model reserved for adaptation and reviewer turns.
  - key: gemini-3.5-flash-lite
    provider: gemini
    model_id: gemini-3.5-flash-lite
    maximum_context_tokens: 1048576
    maximum_output_tokens: 65536
    source_url: https://ai.google.dev/gemini-api/docs/models/gemini-3.5-flash-lite
    description: Cost-efficient stable Gemini model for frequent development planning turns.
  - key: gemini-3.6-flash
    provider: gemini
    model_id: gemini-3.6-flash
    maximum_context_tokens: 1048576
    maximum_output_tokens: 65536
    source_url: https://ai.google.dev/gemini-api/docs/models/gemini-3.6-flash
    description: Stable Gemini Flash model for development adaptation and review turns.
  - key: gemini-3.7-flash
    provider: gemini
    model_id: gemini-3.7-flash
    maximum_context_tokens: 1048576
    maximum_output_tokens: 65536
    source_url: https://ai.google.dev/gemini-api/docs/models/gemini-3.7-flash
    description: Latest generally available Gemini Flash model for opt-in quality evaluation.
profiles:
  - key: remote-standard.v1
    role_models:
      planner: gpt-5.6-luna
      adapter: gpt-5.6-terra
      reviewer: gpt-5.6-terra
    context_tokens: 131072
    maximum_output_tokens: 16384
    reasoning_effort: low
    description: Low-cost routing with Luna as implementer and Terra as adapter/reviewer.
  - key: gemini-development.v1
    role_models:
      planner: gemini-3.5-flash-lite
      adapter: gemini-3.6-flash
      reviewer: gemini-3.6-flash
    context_tokens: 131072
    maximum_output_tokens: 16384
    reasoning_effort: low
    description: Low-cost Gemini development routing with stronger adaptation and review.
  - key: gemini-quality.v1
    role_models:
      planner: gemini-3.7-flash
      adapter: gemini-3.7-flash
      reviewer: gemini-3.7-flash
    context_tokens: 131072
    maximum_output_tokens: 16384
    reasoning_effort: low
    description: Opt-in Gemini 3.7 quality profile for agentic workload evaluation.
