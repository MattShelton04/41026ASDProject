[project]
name = "ai-mode"
version = "0.1.0"
description = "HTTP orchestration service for the ASD agent harness"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-core",
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
    "shared-contracts",
]

[project.scripts]
ai-mode-provider-smoke = "ai_mode.provider_diagnostics:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
