      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 20

  f5-db-api:
    profiles: [feature-base]
    labels:
      propertyscope.feature-key: student-5-buyer-journey
    build:
