  f3-database:
    profiles: [feature-base]
    labels:
      propertyscope.feature-key: student-3-suburb-analytics
    build:
      context: .
      dockerfile: student-3/Dockerfile
      target: database
    image: propertyscope/f3-database:dev
    init: true
    restart: unless-stopped
    environment:
      SUBURB_DB_PATH: /var/lib/propertyscope-suburbs/suburbs.sqlite3
    volumes:
      - f3-suburb-data:/var/lib/propertyscope-suburbs
    networks: [shared-platform]
    stop_grace_period: 20s

  f3-backend:
    extra_hosts:
