name: ps

services:
  shared-frontend:
    profiles: [release-0]
    build:
      context: .
      dockerfile: shared/frontend/Dockerfile
    image: propertyscope/shared-frontend:dev
    init: true
    restart: unless-stopped
    ports:
      - 127.0.0.1:${PROPERTYSCOPE_SHARED_PORT:-5100}:8080
    networks: [shared-platform]
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 20

  shared-ai-mode:
    profiles: [release-0]
    build:
      context: .
      dockerfile: ai-services/ai-mode/Dockerfile
    image: propertyscope/shared-ai-mode:dev
    init: true
    restart: unless-stopped
    environment:
      AI_MODE_DATABASE_PATH: /var/lib/ai-mode/agent-state.sqlite3
      AI_MODE_MAX_REQUEST_BYTES: ${AI_MODE_MAX_REQUEST_BYTES:-65536}
      AI_MODE_MAX_MODEL_RESPONSE_BYTES: ${AI_MODE_MAX_MODEL_RESPONSE_BYTES:-1048576}
      AI_MODE_MAX_TOOL_REQUEST_BYTES: ${AI_MODE_MAX_TOOL_REQUEST_BYTES:-262144}
      AI_MODE_MAX_TOOL_RESPONSE_BYTES: ${AI_MODE_MAX_TOOL_RESPONSE_BYTES:-1048576}
      AI_MODE_QUEUE_CAPACITY: ${AI_MODE_QUEUE_CAPACITY:-100}
      AI_MODE_QUEUE_RECONCILE_INTERVAL_SECONDS: ${AI_MODE_QUEUE_RECONCILE_INTERVAL_SECONDS:-1}
      AI_MODE_ENVIRONMENT: compose
      AI_MODE_LOG_LEVEL: ${AI_MODE_LOG_LEVEL:-INFO}
      # Feature 1 consumes the durable, redacted run index for diagnosis history.
      AI_MODE_OPERATIONS_ENABLED: ${AI_MODE_OPERATIONS_ENABLED:-true}
      AI_MODE_TOOL_CATALOG_PATHS: /etc/ai-mode/propertyscope-tools.yaml
      AI_MODE_LLM_PROVIDER: ${AI_MODE_LLM_PROVIDER:-openai}
      AI_MODE_REQUIRE_PROVIDER_READY: ${AI_MODE_REQUIRE_PROVIDER_READY:-true}
      AI_MODE_DEFAULT_MODEL_PROFILE: ${AI_MODE_DEFAULT_MODEL_PROFILE:-remote-standard.v1}
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GEMINI_API_KEY_FILE: /run/secrets/openai_api_key
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      OPENAI_HEALTH_TIMEOUT_SECONDS: ${OPENAI_HEALTH_TIMEOUT_SECONDS:-2}
      OPENAI_HEALTH_CACHE_SECONDS: ${OPENAI_HEALTH_CACHE_SECONDS:-60}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-120}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      OPENAI_PROMPT_CACHE_ENABLED: ${OPENAI_PROMPT_CACHE_ENABLED:-true}
      OPENAI_ALLOW_INSECURE_HTTP: ${OPENAI_ALLOW_INSECURE_HTTP:-false}
    ports:
      - 127.0.0.1:${AI_MODE_PORT:-5005}:5005
    secrets:
      - openai_api_key
    volumes:
      - shared-ai-mode-state:/var/lib/ai-mode
      - ./student-1/tool-catalog.yaml:/etc/ai-mode/propertyscope-tools.yaml:ro
    networks:
      - shared-platform
    mem_limit: ${AI_MODE_MEMORY_LIMIT:-512m}
    cpus: ${AI_MODE_CPU_LIMIT:-1.0}
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s

  f1-postgres:
    profiles: [release-0]
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PROPERTYSCOPE_POSTGRES_DB:-propertyscope}
      POSTGRES_USER: ${PROPERTYSCOPE_POSTGRES_USER:-propertyscope}
      POSTGRES_PASSWORD: ${PROPERTYSCOPE_POSTGRES_PASSWORD:-propertyscope-local-only}
    volumes:
      - f1-postgres-data:/var/lib/postgresql/data
    networks: [shared-platform]
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 60s

  f1-db-api:
    profiles: [release-0]
    build:
      context: .
      dockerfile: student-1/Dockerfile
      target: database-api
    image: propertyscope/f1-db-api:dev
    init: true
    restart: unless-stopped
    environment: &propertyscope-database-environment
      PROPERTYSCOPE_DATABASE_URL: postgresql://${PROPERTYSCOPE_POSTGRES_USER:-propertyscope}:${PROPERTYSCOPE_POSTGRES_PASSWORD:-propertyscope-local-only}@f1-postgres:5432/${PROPERTYSCOPE_POSTGRES_DB:-propertyscope}
      PROPERTYSCOPE_ARTIFACT_ROOT: /var/lib/propertyscope/artifacts
      PROPERTYSCOPE_INTERNAL_TOKEN: ${PROPERTYSCOPE_INTERNAL_TOKEN:-propertyscope-local-development-only}
      PROPERTYSCOPE_AUTO_MIGRATE: "true"
    depends_on:
      f1-postgres:
        condition: service_healthy
    volumes:
      - f1-artifacts:/var/lib/propertyscope/artifacts:ro
    networks: [shared-platform]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5202/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 35s
    mem_limit: ${PROPERTYSCOPE_DATABASE_MEMORY_LIMIT:-2g}
    cpus: ${PROPERTYSCOPE_DATABASE_CPU_LIMIT:-2.0}

  f1-db-loader:
    profiles: [release-0]
    build:
      context: .
      dockerfile: student-1/Dockerfile
      target: database-loader
    image: propertyscope/f1-db-loader:dev
    init: true
    restart: unless-stopped
    environment:
      <<: *propertyscope-database-environment
      PROPERTYSCOPE_AUTO_MIGRATE: "false"
    depends_on:
      f1-db-api:
        condition: service_healthy
    volumes:
      - f1-artifacts:/var/lib/propertyscope/artifacts:ro
    networks: [shared-platform]
    stop_grace_period: 35s
    mem_limit: ${PROPERTYSCOPE_LOADER_MEMORY_LIMIT:-4g}
    cpus: ${PROPERTYSCOPE_LOADER_CPU_LIMIT:-2.0}

  f1-backend:
    profiles: [release-0]
    build:
      context: .
      dockerfile: student-1/Dockerfile
      target: backend
    image: propertyscope/f1-backend:dev
    init: true
    restart: unless-stopped
    environment:
      PROPERTYSCOPE_DATABASE_API_URL: http://f1-db-api:5202
      PROPERTYSCOPE_INTERNAL_TOKEN: ${PROPERTYSCOPE_INTERNAL_TOKEN:-propertyscope-local-development-only}
      PROPERTYSCOPE_RUNNER_TOKEN: ${PROPERTYSCOPE_RUNNER_TOKEN:-propertyscope-local-runner-only}
      AI_MODE_BASE_URL: http://shared-ai-mode:5005
      PROPERTYSCOPE_ARTIFACT_ROOT: /var/lib/propertyscope/artifacts
      PROPERTYSCOPE_PSI_CACHED_YEARS: ${PROPERTYSCOPE_PSI_CACHED_YEARS:-}
      PROPERTYSCOPE_PSI_CACHED_WEEKS: ${PROPERTYSCOPE_PSI_CACHED_WEEKS:-}
    depends_on:
      f1-db-api:
        condition: service_healthy
    volumes:
      - f1-artifacts:/var/lib/propertyscope/artifacts:ro
    networks: [shared-platform]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5201/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 35s

  f1-runner:
    profiles: [release-0]
    build:
      context: .
      dockerfile: student-1/Dockerfile
      target: runner
    image: propertyscope/f1-runner:dev
    init: true
    restart: unless-stopped
    environment:
      PROPERTYSCOPE_BACKEND_URL: http://f1-backend:5201
      PROPERTYSCOPE_RUNNER_TOKEN: ${PROPERTYSCOPE_RUNNER_TOKEN:-propertyscope-local-runner-only}
      PROPERTYSCOPE_ARTIFACT_ROOT: /var/lib/propertyscope/artifacts
      PROPERTYSCOPE_SOURCE_CREDENTIAL_FILE: ${PROPERTYSCOPE_SOURCE_CREDENTIAL_FILE:-}
      PROPERTYSCOPE_GNAF_ARCHIVE_PATH: /var/lib/propertyscope/source-cache/gnaf.zip
      PROPERTYSCOPE_GNAF_CRS: ${PROPERTYSCOPE_GNAF_CRS:-GDA94}
      PROPERTYSCOPE_PSI_ARCHIVE_ROOT: /var/lib/propertyscope/source-cache/psi
      PROPERTYSCOPE_RUNNER_LEASE_SECONDS: "300"
    depends_on:
      f1-backend:
        condition: service_healthy
      f1-db-api:
        condition: service_healthy
    volumes:
      - f1-artifacts:/var/lib/propertyscope/artifacts:rw
      - ./.propertyscope-source-cache:/var/lib/propertyscope/source-cache:ro
    networks: [shared-platform]
    stop_grace_period: 35s
    mem_limit: ${PROPERTYSCOPE_RUNNER_MEMORY_LIMIT:-4g}
    cpus: ${PROPERTYSCOPE_RUNNER_CPU_LIMIT:-2.0}

  f1-frontend:
    profiles: [release-0]
    build:
      context: .
      dockerfile: student-1/Dockerfile
      target: frontend
    image: propertyscope/f1-frontend:dev
    init: true
    restart: unless-stopped
    depends_on:
      f1-backend:
        condition: service_healthy
    ports:
      - 127.0.0.1:${PROPERTYSCOPE_PORT:-5200}:8080
    networks: [shared-platform]
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  shared-platform:

secrets:
  openai_api_key:
    # scripts/dev.py materialises the shell credential into this ignored runtime file.
    # A file-backed secret works with read-only containers across Compose implementations.
    file: ${OPENAI_API_KEY_FILE:-.propertyscope-runtime/openai_api_key}

volumes:
  shared-ai-mode-state:
  f1-artifacts:
  f1-postgres-data:
