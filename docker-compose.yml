    profiles: [feature-base]
    labels:
      propertyscope.feature-key: student-3-suburb-analytics
    build:
      context: .
      dockerfile: student-3/Dockerfile
      target: backend
    image: propertyscope/f3-backend:dev
    init: true
    restart: unless-stopped
    environment:
      SUBURB_STORE_URL: http://f3-database:5302
      SUBURB_IMPORT_WORKER: "1"
      AI_MODE_URL: http://host.docker.internal:${AI_MODE_PORT:-5005}
      AI_MODE_SERVICE_TOKEN: ${AI_MODE_SERVICE_TOKEN:-}
      # Shared local MCP/RAG endpoints this backend's AI path targets. Requests are
      # mediated by host AI-mode, so no MCP/RAG service token is issued to containers.
      MCP_SERVER_URL: http://host.docker.internal:${MCP_PORT:-5011}/mcp
      RAG_SERVER_URL: http://host.docker.internal:${RAG_PORT:-5012}
      PROPERTY_DATA_URL: http://f1-backend:5201
    depends_on:
      f3-database:
        condition: service_healthy
    networks: [shared-platform]
    stop_grace_period: 35s

  f3-frontend:
    profiles: [feature-base]
    labels:
