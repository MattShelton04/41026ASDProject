name: ps

services:
  shared-frontend:
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles: [release-0]
    build:
      context: .
      dockerfile: shared/frontend/Dockerfile
    image: propertyscope/shared-frontend:dev
    environment:
      AI_MODE_HOST: host.docker.internal
      AI_MODE_PORT: ${AI_MODE_PORT:-5005}
      AI_MODE_SERVICE_TOKEN: ${AI_MODE_SERVICE_TOKEN:-}
      NGINX_ENVSUBST_FILTER: AI_MODE_(HOST|PORT|SERVICE_TOKEN)
    init: true
    restart: unless-stopped
    ports:
      - 127.0.0.1:${PROPERTYSCOPE_SHARED_PORT:-5100}:8080
    networks: [shared-platform]
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 20

  f1-postgres:
    profiles: [feature-base]
    labels:
      propertyscope.feature-key: student-1-propertyscope-data-platform
    image: postgis/postgis:16-3.4
    command:
      - postgres
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PROPERTYSCOPE_POSTGRES_DB:-propertyscope}
      POSTGRES_USER: ${PROPERTYSCOPE_POSTGRES_USER:-propertyscope}
      POSTGRES_PASSWORD: ${PROPERTYSCOPE_POSTGRES_PASSWORD:-propertyscope-local-only}
    volumes:
      - f1-postgres-data:/var/lib/postgresql/data
    networks: [shared-platform]
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 60s

  f1-db-api:
    profiles: [feature-base]
    labels:
      propertyscope.feature-key: student-1-propertyscope-data-platform
    build:
      context: .
      dockerfile: student-1/Dockerfile
      target: database-api
    image: propertyscope/f1-db-api:dev
    init: true
    restart: unless-stopped
    environment: &propertyscope-database-environment
      PROPERTYSCOPE_DATABASE_URL: postgresql://${PROPERTYSCOPE_POSTGRES_USER:-propertyscope}:${PROPERTYSCOPE_POSTGRES_PASSWORD:-propertyscope-local-only}@f1-postgres:5432/${PROPERTYSCOPE_POSTGRES_DB:-propertyscope}
      PROPERTYSCOPE_ARTIFACT_ROOT: /var/lib/propertyscope/artifacts
      PROPERTYSCOPE_INTERNAL_TOKEN: ${PROPERTYSCOPE_INTERNAL_TOKEN:-propertyscope-local-development-only}
      PROPERTYSCOPE_AUTO_MIGRATE: "true"
    depends_on:
      f1-postgres:
        condition: service_healthy
    volumes:
      - f1-artifacts:/var/lib/propertyscope/artifacts:ro
    networks: [shared-platform]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5202/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 35s
    mem_limit: ${PROPERTYSCOPE_DATABASE_MEMORY_LIMIT:-2g}
    cpus: ${PROPERTYSCOPE_DATABASE_CPU_LIMIT:-2.0}

  f1-db-loader:
    profiles: [feature-base]
    labels:
      propertyscope.feature-key: student-1-propertyscope-data-platform
    build:
      context: .
      dockerfile: student-1/Dockerfile
      target: database-loader
    image: propertyscope/f1-db-loader:dev
    init: true
    restart: unless-stopped
    environment:
      <<: *propertyscope-database-environment
      PROPERTYSCOPE_AUTO_MIGRATE: "false"
      PROPERTYSCOPE_LOADER_TEMP_FILE_LIMIT_KIB: ${PROPERTYSCOPE_LOADER_TEMP_FILE_LIMIT_KIB:-16777216}
      PROPERTYSCOPE_LOADER_DISK_RESERVE_BYTES: ${PROPERTYSCOPE_LOADER_DISK_RESERVE_BYTES:-4294967296}
      PROPERTYSCOPE_LOADER_ARTIFACT_EXPANSION_FACTOR: ${PROPERTYSCOPE_LOADER_ARTIFACT_EXPANSION_FACTOR:-3}
      PROPERTYSCOPE_POSTGRES_CAPACITY_BYTES: ${PROPERTYSCOPE_POSTGRES_CAPACITY_BYTES:-206158430208}
    depends_on:
      f1-db-api:
        condition: service_healthy
    volumes:
      - f1-artifacts:/var/lib/propertyscope/artifacts:ro
    networks: [shared-platform]
    stop_grace_period: 35s
    mem_limit: ${PROPERTYSCOPE_LOADER_MEMORY_LIMIT:-4g}
    cpus: ${PROPERTYSCOPE_LOADER_CPU_LIMIT:-2.0}

  f1-backend:
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles: [feature-base]
    labels:
      propertyscope.feature-key: student-1-propertyscope-data-platform
    build:
      context: .
      dockerfile: student-1/Dockerfile
      target: backend
    image: propertyscope/f1-backend:dev
    init: true
    restart: unless-stopped
    environment:
      PROPERTYSCOPE_DATABASE_API_URL: http://f1-db-api:5202
      PROPERTYSCOPE_INTERNAL_TOKEN: ${PROPERTYSCOPE_INTERNAL_TOKEN:-propertyscope-local-development-only}
      PROPERTYSCOPE_RUNNER_TOKEN: ${PROPERTYSCOPE_RUNNER_TOKEN:-propertyscope-local-runner-only}
      AI_MODE_BASE_URL: http://host.docker.internal:${AI_MODE_PORT:-5005}
      AI_MODE_SERVICE_TOKEN: ${AI_MODE_SERVICE_TOKEN:-}
      # Shared local MCP/RAG endpoints this backend's AI path targets. Requests are
      # mediated by host AI-mode, so no MCP/RAG service token is issued to containers.
      MCP_SERVER_URL: http://host.docker.internal:${MCP_PORT:-5011}/mcp
      RAG_SERVER_URL: http://host.docker.internal:${RAG_PORT:-5012}
      PROPERTYSCOPE_ARTIFACT_ROOT: /var/lib/propertyscope/artifacts
      PROPERTYSCOPE_PSI_CACHED_YEARS: ${PROPERTYSCOPE_PSI_CACHED_YEARS:-}
      PROPERTYSCOPE_PSI_CACHED_WEEKS: ${PROPERTYSCOPE_PSI_CACHED_WEEKS:-}
      PROPERTYSCOPE_FEATURE_2_URL: http://f2-backend:5301
      PROPERTYSCOPE_FEATURE_3_URL: http://f3-backend:5301
    depends_on:
      f1-db-api:
        condition: service_healthy
    volumes:
      - f1-artifacts:/var/lib/propertyscope/artifacts:ro
    networks: [shared-platform]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5201/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 35s

  f1-runner:
    profiles: [feature-base]
    labels:
      propertyscope.feature-key: student-1-propertyscope-data-platform
    build:
      context: .
      dockerfile: student-1/Dockerfile
      target: runner
    image: propertyscope/f1-runner:dev
    init: true
    restart: unless-stopped
    environment:
      PROPERTYSCOPE_BACKEND_URL: http://f1-backend:5201
      PROPERTYSCOPE_RUNNER_TOKEN: ${PROPERTYSCOPE_RUNNER_TOKEN:-propertyscope-local-runner-only}
      PROPERTYSCOPE_ARTIFACT_ROOT: /var/lib/propertyscope/artifacts
      PROPERTYSCOPE_SOURCE_CREDENTIAL_FILE: ${PROPERTYSCOPE_SOURCE_CREDENTIAL_FILE:-}
      PROPERTYSCOPE_GNAF_ARCHIVE_PATH: /var/lib/propertyscope/source-cache/gnaf.zip
      PROPERTYSCOPE_GNAF_CRS: ${PROPERTYSCOPE_GNAF_CRS:-GDA94}
      PROPERTYSCOPE_PSI_ARCHIVE_ROOT: /var/lib/propertyscope/source-cache/psi
      PROPERTYSCOPE_RUNNER_LEASE_SECONDS: "300"
      PROPERTYSCOPE_ACQUISITION_WORKERS: ${PROPERTYSCOPE_ACQUISITION_WORKERS:-1}
      PROPERTYSCOPE_RELEASE_PROJECTION_WORKERS: ${PROPERTYSCOPE_RELEASE_PROJECTION_WORKERS:-2}
      PROPERTYSCOPE_RELEASE_COMPRESSION_LEVEL: ${PROPERTYSCOPE_RELEASE_COMPRESSION_LEVEL:-3}
    depends_on:
      f1-backend:
        condition: service_healthy
      f1-db-api:
        condition: service_healthy
    volumes:
      - f1-artifacts:/var/lib/propertyscope/artifacts:rw
      - ./.propertyscope-source-cache:/var/lib/propertyscope/source-cache:ro
    networks: [shared-platform]
    stop_grace_period: 35s
    mem_limit: ${PROPERTYSCOPE_RUNNER_MEMORY_LIMIT:-4g}
    cpus: ${PROPERTYSCOPE_RUNNER_CPU_LIMIT:-2.0}

  f1-frontend:
    profiles: [feature-base]
    labels:
      propertyscope.feature-key: student-1-propertyscope-data-platform
    build:
      context: .
      dockerfile: student-1/Dockerfile
      target: frontend
    image: propertyscope/f1-frontend:dev
    init: true
    restart: unless-stopped
    depends_on:
      f1-backend:
        condition: service_healthy
    networks: [shared-platform]
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 20

  f2-db-api:
    profiles: [feature-base]
    labels:
      propertyscope.feature-key: student-2-market-intelligence
    build:
      context: .
      dockerfile: student-2/Dockerfile
      target: database-api
    image: propertyscope/f2-db-api:dev
    init: true
    restart: unless-stopped
    environment:
      PROPERTYSCOPE_MARKET_DATABASE_PATH: /var/lib/propertyscope-market/market.sqlite3
      PROPERTYSCOPE_INTERNAL_TOKEN: ${PROPERTYSCOPE_INTERNAL_TOKEN:-propertyscope-local-development-only}
      PROPERTYSCOPE_AUTO_MIGRATE: "true"
    volumes:
      - f2-sqlite-data:/var/lib/propertyscope-market
    networks: [shared-platform]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5302/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 20s

  f2-backend:
    extra_hosts:
