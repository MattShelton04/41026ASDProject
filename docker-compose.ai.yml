# Optional local development placement. Base Compose remains the host assessment topology.
services:
  shared-ai-mode:
    profiles: [ai-container]
    build: &ai-build
      context: .
      dockerfile: ai-services/Dockerfile
    image: propertyscope/shared-ai-runtime:dev
    user: ${PROPERTYSCOPE_AI_UID:-10001}:${PROPERTYSCOPE_AI_GID:-10001}
    command: [python, -m, scripts.devtools.container_entry, ai-mode]
    env_file:
      - path: .propertyscope-runtime/docker-ai/ai-mode.env
        required: false
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    ports: ["127.0.0.1:${AI_MODE_PORT:-5005}:5005"]
    networks: [shared-platform]
    secrets: [model_provider_key]
    volumes:
      - ./.propertyscope-runtime/host/ai-mode:/var/lib/ai-mode
      - ./.propertyscope-runtime/docker-ai/catalogues:/etc/propertyscope/catalogues:ro
      - ./ai-services:/app/ai-services:ro
      - ./shared:/app/shared:ro
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: [CMD, python, -m, scripts.devtools.container_entry, health, ai-mode]
      interval: 5s
      timeout: 5s
      retries: 30

  mcp-server:
    profiles: [ai-container]
    build: *ai-build
    image: propertyscope/shared-ai-runtime:dev
    user: ${PROPERTYSCOPE_AI_UID:-10001}:${PROPERTYSCOPE_AI_GID:-10001}
    command: [python, -m, scripts.devtools.container_entry, mcp]
    env_file:
      - path: .propertyscope-runtime/docker-ai/mcp.env
        required: false
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    ports: ["127.0.0.1:${MCP_PORT:-5011}:5011"]
    networks: [shared-platform]
    volumes:
      - ./.propertyscope-runtime/docker-ai/catalogues:/etc/propertyscope/catalogues:ro
      - ./ai-services:/app/ai-services:ro
      - ./shared:/app/shared:ro
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: [CMD, python, -m, scripts.devtools.container_entry, health, mcp]
      interval: 5s
      timeout: 5s
      retries: 30

  rag-server:
    profiles: [ai-container]
    build: *ai-build
    image: propertyscope/shared-ai-runtime:dev
    user: ${PROPERTYSCOPE_AI_UID:-10001}:${PROPERTYSCOPE_AI_GID:-10001}
    command: [python, -m, scripts.devtools.container_entry, rag]
    env_file:
      - path: .propertyscope-runtime/docker-ai/rag.env
        required: false
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    ports: ["127.0.0.1:${RAG_PORT:-5012}:5012"]
    networks: [shared-platform]
    volumes:
      - ./.propertyscope-runtime/host/rag:/var/lib/rag
      - ./ai-services:/app/ai-services:ro
      - ./shared:/app/shared:ro
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: [CMD, python, -m, scripts.devtools.container_entry, health, rag]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  shared-frontend:
    environment:
      AI_MODE_HOST: shared-ai-mode
      AI_MODE_PORT: "5005"
  f1-backend:
    environment:
      AI_MODE_BASE_URL: http://shared-ai-mode:5005
  f2-backend:
    environment:
      AI_MODE_BASE_URL: http://shared-ai-mode:5005
  f3-backend:
    environment:
      AI_MODE_URL: http://shared-ai-mode:5005
  f4-backend:
    environment:
      AI_MODE_BASE_URL: http://shared-ai-mode:5005
  f5-backend:
    environment:
      AI_MODE_BASE_URL: http://shared-ai-mode:5005

secrets:
  model_provider_key:
    file: ${OPENAI_API_KEY_FILE:-.propertyscope-runtime/openai_api_key}
