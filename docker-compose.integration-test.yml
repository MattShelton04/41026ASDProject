services:
  ai-mode:
    environment:
      AI_MODE_TOOL_CATALOG_PATH: /etc/ai-mode/integration-test-tools.yaml
    volumes:
      - ./examples/integration-test-feature/tool-catalog.yaml:/etc/ai-mode/integration-test-tools.yaml:ro

  integration-test-feature-database:
    profiles: [integration-test]
    build:
      context: .
      dockerfile: examples/integration-test-feature/Dockerfile
      target: database
    image: 41026-asd/integration-test-feature-database:dev
    init: true
    environment:
      INTEGRATION_TEST_DATABASE_PATH: /var/lib/integration-test-feature/records.sqlite3
    volumes:
      - integration_test_feature_data:/var/lib/integration-test-feature
    networks: [shared_platform]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5102/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  integration-test-feature-backend:
    profiles: [integration-test]
    build:
      context: .
      dockerfile: examples/integration-test-feature/Dockerfile
      target: backend
    image: 41026-asd/integration-test-feature-backend:dev
    init: true
    environment:
      INTEGRATION_TEST_DATABASE_URL: http://integration-test-feature-database:5102
    depends_on:
      integration-test-feature-database:
        condition: service_healthy
    networks: [shared_platform]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5101/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  integration-test-feature-frontend:
    profiles: [integration-test]
    build:
      context: .
      dockerfile: examples/integration-test-feature/Dockerfile
      target: frontend
    image: 41026-asd/integration-test-feature-frontend:dev
    ports:
      - 127.0.0.1:${INTEGRATION_TEST_FEATURE_PORT:-5190}:80
    networks: [shared_platform]

volumes:
  integration_test_feature_data:
