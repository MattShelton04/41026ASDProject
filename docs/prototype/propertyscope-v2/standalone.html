<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10262e"><title>PropertyScope NSW — Standalone prototype</title><style>/* PropertyScope NSW prototype design system
   Self-contained, dependency-free, and intentionally non-government branded. */

:root {
  color-scheme: light;
  --font-sans: Inter, "Avenir Next", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-display: "Avenir Next", "Segoe UI", var(--font-sans);
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;

  --ink-950: #10262e;
  --ink-900: #17333d;
  --ink-800: #23444e;
  --ink-700: #385a63;
  --ink-600: #557078;
  --ink-500: #71868c;
  --ink-400: #96a7aa;
  --ink-300: #bac7c9;
  --ink-200: #d5dede;
  --ink-150: #e2e9e8;
  --ink-100: #edf2f1;
  --ink-50: #f6f8f7;

  --ocean-800: #075a5d;
  --ocean-700: #086d70;
  --ocean-600: #087f81;
  --ocean-500: #159495;
  --ocean-300: #72c4c1;
  --ocean-200: #a9dcda;
  --ocean-100: #d8efed;
  --ocean-50: #eef8f7;

  --eucalypt-700: #496c5f;
  --eucalypt-500: #66877b;
  --eucalypt-200: #c9d8d1;
  --eucalypt-100: #e5ece8;

  --sand-700: #7d6847;
  --sand-500: #a28b67;
  --sand-300: #d0bea1;
  --sand-200: #e3d7c3;
  --sand-100: #f0e8db;
  --sand-50: #f8f4ed;

  --coral-700: #a84f3d;
  --coral-600: #c05d46;
  --coral-500: #d67359;
  --coral-200: #f0c2b6;
  --coral-100: #f9e3dd;

  --amber-700: #8a5a0a;
  --amber-600: #a86f0a;
  --amber-500: #c2871c;
  --amber-200: #f0d29b;
  --amber-100: #fbefd7;

  --red-700: #9c3f45;
  --red-600: #b84b52;
  --red-100: #f8e2e4;

  --blue-700: #275f89;
  --blue-600: #3176a7;
  --blue-100: #e1eef7;

  --canvas: #f3f6f5;
  --paper: #ffffff;
  --paper-warm: #fffdf9;
  --surface-raised: rgba(255, 255, 255, 0.92);
  --line: rgba(23, 51, 61, 0.13);
  --line-strong: rgba(23, 51, 61, 0.22);
  --line-inverse: rgba(255, 255, 255, 0.15);

  --success: var(--ocean-700);
  --success-bg: var(--ocean-50);
  --warning: var(--amber-700);
  --warning-bg: var(--amber-100);
  --danger: var(--red-700);
  --danger-bg: var(--red-100);
  --info: var(--blue-700);
  --info-bg: var(--blue-100);
  --unknown: var(--ink-600);
  --unknown-bg: var(--ink-100);

  --shadow-xs: 0 1px 2px rgba(13, 38, 47, 0.05);
  --shadow-sm: 0 3px 10px rgba(13, 38, 47, 0.07);
  --shadow-md: 0 12px 32px rgba(13, 38, 47, 0.10);
  --shadow-lg: 0 24px 64px rgba(13, 38, 47, 0.16);
  --shadow-focus: 0 0 0 3px rgba(21, 148, 149, 0.24);

  --radius-xs: 5px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 26px;
  --radius-pill: 999px;

  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-7: 1.75rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;

  --topbar-height: 68px;
  --rail-width: 248px;
  --content-max: 1500px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --duration: 160ms;
}

* { box-sizing: border-box; }
html { min-width: 320px; min-height: 100%; scroll-behavior: smooth; }
body {
  min-height: 100vh;
  margin: 0;
  color: var(--ink-900);
  background:
    radial-gradient(circle at 80% -10%, rgba(114, 196, 193, 0.15), transparent 34rem),
    var(--canvas);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.48;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

button, input, select, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
img, svg { display: block; max-width: 100%; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, [tabindex]:focus-visible, summary:focus-visible {
  outline: 3px solid rgba(21, 148, 149, 0.38);
  outline-offset: 2px;
}

::selection { color: var(--ink-950); background: var(--ocean-200); }

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.skip-link {
  position: fixed;
  z-index: 1000;
  top: -5rem;
  left: 1rem;
  padding: .7rem 1rem;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  background: var(--paper);
  box-shadow: var(--shadow-md);
  color: var(--ocean-800);
  font-weight: 750;
  text-decoration: none;
}
.skip-link:focus { top: 0; }

/* App shell */
.app {
  min-height: 100vh;
}

.topbar {
  position: sticky;
  z-index: 50;
  top: 0;
  height: var(--topbar-height);
  display: grid;
  grid-template-columns: minmax(250px, var(--rail-width)) minmax(280px, 1fr) auto;
  align-items: center;
  gap: var(--space-5);
  padding: 0 var(--space-6);
  border-bottom: 1px solid var(--line-inverse);
  background: rgba(16, 38, 46, 0.97);
  color: white;
  backdrop-filter: blur(18px);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: .72rem;
  min-width: 0;
  text-decoration: none;
}
.brand-mark {
  position: relative;
  width: 39px;
  height: 39px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 11px;
  background: linear-gradient(145deg, rgba(114,196,193,.22), rgba(114,196,193,.04));
  box-shadow: inset 0 1px rgba(255,255,255,.08);
  color: #9ee0dc;
}
.brand-mark svg { width: 24px; height: 24px; }
.brand-copy { min-width: 0; }
.brand-copy strong {
  display: block;
  font-family: var(--font-display);
  font-size: 1.03rem;
  font-weight: 780;
  letter-spacing: -.025em;
  white-space: nowrap;
}
.brand-copy span {
  display: block;
  margin-top: -1px;
  color: rgba(255,255,255,.64);
  font-size: .72rem;
  letter-spacing: .02em;
  white-space: nowrap;
}

.global-search {
  position: relative;
  width: min(680px, 100%);
  justify-self: center;
}
.global-search svg {
  position: absolute;
  top: 50%;
  left: .85rem;
  width: 17px;
  height: 17px;
  transform: translateY(-50%);
  color: rgba(255,255,255,.54);
  pointer-events: none;
}
.global-search input {
  width: 100%;
  height: 40px;
  padding: 0 4.7rem 0 2.55rem;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: var(--radius-md);
  outline: none;
  background: rgba(255,255,255,.08);
  color: white;
  transition: border-color var(--duration), background var(--duration), box-shadow var(--duration);
}
.global-search input::placeholder { color: rgba(255,255,255,.52); }
.global-search input:focus {
  border-color: rgba(158,224,220,.65);
  background: rgba(255,255,255,.12);
  box-shadow: 0 0 0 3px rgba(114,196,193,.12);
}
.search-shortcut {
  position: absolute;
  top: 50%;
  right: .65rem;
  transform: translateY(-50%);
  padding: .15rem .42rem;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 5px;
  color: rgba(255,255,255,.54);
  font-family: var(--font-mono);
  font-size: .68rem;
}

.topbar-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: .55rem;
}
.release-switcher, .top-action, .avatar-button, .mobile-menu {
  height: 38px;
  border: 1px solid rgba(255,255,255,.13);
  background: rgba(255,255,255,.06);
  color: white;
}
.release-switcher {
  display: flex;
  align-items: center;
  gap: .45rem;
  padding: 0 .78rem;
  border-radius: var(--radius-pill);
  font-size: .77rem;
  font-weight: 700;
}
.release-switcher .dot { width: 7px; height: 7px; border-radius: 50%; background: #75d3c9; box-shadow: 0 0 0 4px rgba(117,211,201,.12); }
.top-action, .avatar-button, .mobile-menu {
  width: 38px;
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: 11px;
  cursor: pointer;
}
.top-action svg, .mobile-menu svg { width: 18px; height: 18px; }
.avatar-button {
  border-color: rgba(255,255,255,.18);
  background: linear-gradient(145deg, var(--ocean-500), var(--ocean-800));
  font-size: .75rem;
  font-weight: 800;
}
.mobile-menu { display: none; }

.release-strip {
  position: sticky;
  z-index: 39;
  top: var(--topbar-height);
  min-height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .65rem;
  padding: .42rem 1rem;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 253, 249, 0.92);
  color: var(--ink-700);
  font-size: .74rem;
  backdrop-filter: blur(12px);
}
.release-strip strong { color: var(--ink-900); }
.release-strip .separator { color: var(--ink-300); }
.release-strip .strip-status { display: inline-flex; align-items: center; gap: .32rem; }
.release-strip .strip-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ocean-500); }

.shell {
  display: grid;
  grid-template-columns: var(--rail-width) minmax(0, 1fr);
  min-height: calc(100vh - var(--topbar-height) - 34px);
}

.rail {
  position: sticky;
  top: calc(var(--topbar-height) + 34px);
  align-self: start;
  height: calc(100vh - var(--topbar-height) - 34px);
  padding: 1.05rem .8rem .9rem;
  border-right: 1px solid var(--line);
  background: rgba(248, 250, 249, 0.82);
  overflow-y: auto;
  scrollbar-width: thin;
  backdrop-filter: blur(10px);
}

.rail-context {
  display: flex;
  align-items: center;
  gap: .65rem;
  margin: 0 .25rem .9rem;
  padding: .72rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--paper-warm);
  box-shadow: var(--shadow-xs);
}
.rail-context-icon {
  width: 32px;
  height: 32px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--ocean-100);
  color: var(--ocean-800);
}
.rail-context-icon svg { width: 17px; height: 17px; }
.rail-context strong { display: block; font-size: .82rem; }
.rail-context span { display: block; color: var(--ink-600); font-size: .68rem; }

.rail-section { margin-top: .85rem; }
.rail-label {
  margin: 0 .65rem .28rem;
  color: var(--ink-500);
  font-size: .64rem;
  font-weight: 800;
  letter-spacing: .105em;
  text-transform: uppercase;
}
.rail-nav { display: grid; gap: .12rem; }
.rail-link {
  position: relative;
  display: flex;
  align-items: center;
  gap: .67rem;
  min-height: 38px;
  padding: .52rem .64rem;
  border-radius: 9px;
  color: var(--ink-700);
  font-size: .79rem;
  font-weight: 620;
  text-decoration: none;
  transition: color var(--duration), background var(--duration), transform var(--duration);
}
.rail-link svg { width: 17px; height: 17px; flex: 0 0 auto; color: var(--ink-500); }
.rail-link:hover { color: var(--ink-950); background: rgba(255,255,255,.72); }
.rail-link[aria-current="page"] {
  color: var(--ocean-800);
  background: var(--ocean-100);
  font-weight: 760;
}
.rail-link[aria-current="page"]::before {
  content: "";
  position: absolute;
  left: -4px;
  width: 3px;
  height: 20px;
  border-radius: 0 3px 3px 0;
  background: var(--ocean-600);
}
.rail-link[aria-current="page"] svg { color: var(--ocean-700); }
.rail-link .nav-badge {
  margin-left: auto;
  padding: .05rem .35rem;
  border-radius: var(--radius-pill);
  background: var(--ink-100);
  color: var(--ink-600);
  font-size: .61rem;
  font-weight: 760;
}
.rail-link .nav-badge.future { background: var(--sand-100); color: var(--sand-700); }

.rail-footer {
  margin: 1.2rem .25rem 0;
  padding: .8rem;
  border-top: 1px solid var(--line);
  color: var(--ink-600);
  font-size: .67rem;
}
.rail-footer strong { display: block; margin-bottom: .2rem; color: var(--ink-800); }

.main {
  min-width: 0;
  padding: 1.8rem clamp(1.2rem, 2.4vw, 2.5rem) 4rem;
}
.main-inner { width: min(100%, var(--content-max)); margin: 0 auto; }

/* Core typography and layout */
.eyebrow {
  margin: 0 0 .35rem;
  color: var(--ocean-700);
  font-size: .68rem;
  font-weight: 820;
  letter-spacing: .11em;
  text-transform: uppercase;
}
.display-title, h1, h2, h3 { margin-top: 0; color: var(--ink-950); }
.display-title {
  margin-bottom: .65rem;
  font-family: var(--font-display);
  font-size: clamp(2.15rem, 4.5vw, 4rem);
  line-height: 1.02;
  letter-spacing: -.052em;
}
h1 {
  margin-bottom: .5rem;
  font-family: var(--font-display);
  font-size: clamp(1.75rem, 2.6vw, 2.55rem);
  line-height: 1.08;
  letter-spacing: -.037em;
}
h2 { margin-bottom: .45rem; font-size: 1.08rem; line-height: 1.25; letter-spacing: -.016em; }
h3 { margin-bottom: .35rem; font-size: .9rem; line-height: 1.3; }
p { margin: 0 0 .75rem; }
.lede { max-width: 760px; color: var(--ink-600); font-size: 1rem; line-height: 1.58; }
.muted { color: var(--ink-600); }
.subtle { color: var(--ink-500); }
.mono { font-family: var(--font-mono); font-size: .78em; }
.text-link { color: var(--ocean-700); font-weight: 680; text-decoration: none; }
.text-link:hover { text-decoration: underline; text-underline-offset: 3px; }

.screen-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1.5rem;
  margin-bottom: 1.35rem;
}
.screen-copy { min-width: 0; }
.screen-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .55rem; }
.screen-meta { display: flex; align-items: center; flex-wrap: wrap; gap: .45rem; margin-top: .75rem; }

.hero {
  position: relative;
  min-height: 284px;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(420px, .92fr);
  gap: 2.4rem;
  align-items: center;
  margin: -.35rem 0 1.35rem;
  padding: clamp(1.6rem, 3.4vw, 3.2rem);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: var(--radius-xl);
  overflow: hidden;
  background:
    radial-gradient(circle at 82% 10%, rgba(114,196,193,.27), transparent 22rem),
    linear-gradient(135deg, #0e2b34 0%, #173f48 60%, #1c5358 100%);
  box-shadow: var(--shadow-md);
  color: white;
}
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(120deg, transparent 52%, rgba(255,255,255,.035));
}
.hero .eyebrow { color: #93d9d5; }
.hero .display-title, .hero h1, .hero h2 { color: white; }
.hero .lede { color: rgba(255,255,255,.72); }
.hero-copy { position: relative; z-index: 1; }
.hero-actions { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: 1.25rem; }
.hero-card {
  position: relative;
  z-index: 1;
  padding: 1rem;
  border: 1px solid rgba(255,255,255,.17);
  border-radius: 18px;
  background: rgba(255,255,255,.08);
  box-shadow: inset 0 1px rgba(255,255,255,.07);
  backdrop-filter: blur(14px);
}

.grid { display: grid; gap: 1rem; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.grid-main-aside { grid-template-columns: minmax(0, 1fr) minmax(300px, 0.34fr); }
.grid-map-list { grid-template-columns: minmax(360px, .82fr) minmax(0, 1.18fr); }
.grid-wide-aside { grid-template-columns: minmax(0, 1.5fr) minmax(320px, .6fr); }
.stack { display: grid; gap: 1rem; }
.cluster { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem; }
.cluster-between { display: flex; align-items: center; justify-content: space-between; gap: .8rem; }
.section-gap { margin-top: 1.25rem; }

.card, .panel {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface-raised);
  box-shadow: var(--shadow-xs);
}
.card { padding: 1.05rem; }
.card.interactive {
  transition: transform var(--duration) var(--ease), border-color var(--duration), box-shadow var(--duration);
}
.card.interactive:hover { transform: translateY(-2px); border-color: rgba(8,127,129,.35); box-shadow: var(--shadow-sm); }
.card.soft { background: var(--paper-warm); }
.card.tint-ocean { background: linear-gradient(145deg, var(--paper), var(--ocean-50)); }
.card.tint-sand { background: linear-gradient(145deg, var(--paper), var(--sand-50)); }
.card.tint-coral { background: linear-gradient(145deg, var(--paper), #fff7f4); }
.card.dark {
  border-color: rgba(255,255,255,.11);
  background: linear-gradient(145deg, var(--ink-950), #214852);
  color: white;
}
.card.dark h2, .card.dark h3 { color: white; }
.card.dark .muted { color: rgba(255,255,255,.65); }

.panel { overflow: hidden; }
.panel-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  padding: 1rem 1.1rem .85rem;
  border-bottom: 1px solid var(--line);
}
.panel-header h2 { margin-bottom: .2rem; }
.panel-header p { margin: 0; color: var(--ink-600); font-size: .76rem; }
.panel-body { padding: 1rem 1.1rem; }
.panel-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: .8rem 1.1rem;
  border-top: 1px solid var(--line);
  background: var(--ink-50);
}

.metric-card {
  min-height: 112px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: .95rem 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--paper);
  box-shadow: var(--shadow-xs);
}
.metric-top { display: flex; align-items: center; justify-content: space-between; gap: .7rem; }
.metric-label { color: var(--ink-600); font-size: .72rem; font-weight: 680; }
.metric-icon {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--ink-50);
  color: var(--ink-600);
}
.metric-icon svg { width: 16px; height: 16px; }
.metric-value { margin-top: .55rem; font-size: 1.65rem; font-weight: 780; letter-spacing: -.035em; }
.metric-foot { display: flex; align-items: center; gap: .35rem; color: var(--ink-500); font-size: .65rem; }
.metric-foot.positive { color: var(--ocean-700); }
.metric-foot.warning { color: var(--amber-700); }
.metric-foot.negative { color: var(--red-700); }

/* Buttons and controls */
.button {
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .45rem;
  padding: .52rem .82rem;
  border: 1px solid transparent;
  border-radius: 10px;
  cursor: pointer;
  font-size: .77rem;
  font-weight: 740;
  line-height: 1;
  text-decoration: none;
  transition: transform var(--duration) var(--ease), box-shadow var(--duration), background var(--duration), border-color var(--duration);
}
.button svg { width: 16px; height: 16px; }
.button:hover { transform: translateY(-1px); }
.button:active { transform: translateY(0); }
.button.primary { background: var(--ocean-700); color: white; box-shadow: 0 4px 12px rgba(8,109,112,.18); }
.button.primary:hover { background: var(--ocean-800); box-shadow: 0 7px 18px rgba(8,109,112,.22); }
.button.secondary { border-color: var(--line-strong); background: var(--paper); color: var(--ink-800); }
.button.secondary:hover { border-color: rgba(8,127,129,.42); color: var(--ocean-800); }
.button.ghost { border-color: transparent; background: transparent; color: var(--ink-700); }
.button.ghost:hover { background: var(--ink-100); color: var(--ink-950); }
.button.danger { background: var(--red-600); color: white; }
.button.warning { background: var(--amber-600); color: white; }
.button.inverse { border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.1); color: white; }
.button.inverse:hover { background: rgba(255,255,255,.16); }
.button.inverse-strong { background: white; color: var(--ink-950); }
.button.small { min-height: 30px; padding: .38rem .62rem; border-radius: 8px; font-size: .69rem; }
.button.icon-only { width: 38px; padding: 0; }
.button:disabled { cursor: not-allowed; opacity: .48; transform: none; }

.segmented {
  display: inline-flex;
  align-items: center;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--ink-50);
}
.segmented button, .segmented a {
  min-height: 30px;
  padding: .35rem .65rem;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--ink-600);
  cursor: pointer;
  font-size: .7rem;
  font-weight: 700;
  text-decoration: none;
}
.segmented [aria-pressed="true"], .segmented .active {
  background: var(--paper);
  color: var(--ink-900);
  box-shadow: var(--shadow-xs);
}

.field { display: grid; gap: .32rem; }
.field > span, .field > label { color: var(--ink-700); font-size: .7rem; font-weight: 700; }
.field small { color: var(--ink-500); font-size: .64rem; }
.input, input[type="text"], input[type="search"], input[type="number"], input[type="date"], select, textarea {
  width: 100%;
  min-height: 39px;
  padding: .55rem .7rem;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  outline: none;
  background: var(--paper);
  color: var(--ink-900);
  transition: border-color var(--duration), box-shadow var(--duration), background var(--duration);
}
textarea { min-height: 92px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--ocean-500); box-shadow: var(--shadow-focus); }
input::placeholder, textarea::placeholder { color: var(--ink-400); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem; }
.form-grid .wide { grid-column: 1 / -1; }
.form-section {
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--ink-50);
}
.form-section-title { margin-bottom: .7rem; font-size: .8rem; font-weight: 760; }
.checkbox-row { display: flex; align-items: flex-start; gap: .55rem; }
.checkbox-row input { width: auto; min-height: auto; margin-top: .2rem; }
.switch {
  position: relative;
  width: 40px;
  height: 23px;
  flex: 0 0 auto;
  border-radius: var(--radius-pill);
  background: var(--ink-300);
}
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: white; box-shadow: var(--shadow-xs); }
.switch.on { background: var(--ocean-600); }
.switch.on::after { left: 20px; }

.toolbar {
  display: flex;
  align-items: end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: .75rem;
  margin-bottom: .9rem;
  padding: .75rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: rgba(255,255,255,.72);
}
.toolbar-fields { display: flex; align-items: end; flex-wrap: wrap; gap: .55rem; }
.toolbar .field { min-width: 150px; }
.toolbar .field.search { min-width: min(320px, 100%); }

/* Status and evidence language */
.badge, .status-pill, .release-chip, .tag {
  display: inline-flex;
  align-items: center;
  gap: .32rem;
  white-space: nowrap;
  border-radius: var(--radius-pill);
  font-weight: 720;
}
.badge {
  min-height: 24px;
  padding: .22rem .52rem;
  border: 1px solid transparent;
  font-size: .65rem;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.confirmed, .badge.accepted, .badge.success, .badge.live { color: var(--success); background: var(--success-bg); border-color: rgba(8,109,112,.12); }
.badge.partial, .badge.warning, .badge.review { color: var(--warning); background: var(--warning-bg); border-color: rgba(138,90,10,.12); }
.badge.conflicting, .badge.failed, .badge.danger { color: var(--danger); background: var(--danger-bg); border-color: rgba(156,63,69,.12); }
.badge.info, .badge.running, .badge.planned { color: var(--info); background: var(--info-bg); border-color: rgba(39,95,137,.12); }
.badge.unknown, .badge.draft, .badge.disabled, .badge.unavailable { color: var(--unknown); background: var(--unknown-bg); border-color: var(--line); }
.badge.stale { color: var(--sand-700); background: var(--sand-100); border-color: rgba(125,104,71,.13); }
.badge.no-dot::before { display: none; }

.release-chip { padding: .2rem .48rem; background: var(--ink-100); color: var(--ink-700); font-size: .61rem; }
.release-chip.r0 { background: var(--ocean-100); color: var(--ocean-800); }
.release-chip.r1 { background: var(--blue-100); color: var(--blue-700); }
.release-chip.r2 { background: var(--sand-100); color: var(--sand-700); }
.tag { padding: .22rem .5rem; background: var(--ink-100); color: var(--ink-700); font-size: .64rem; }

.evidence-state {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: .7rem;
  min-height: 54px;
  padding: .65rem .75rem;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--paper);
}
.evidence-state .state-icon {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
}
.evidence-state .state-icon svg { width: 16px; height: 16px; }
.evidence-state.confirmed .state-icon { background: var(--success-bg); color: var(--success); }
.evidence-state.partial .state-icon { background: var(--warning-bg); color: var(--warning); }
.evidence-state.conflicting .state-icon { background: var(--danger-bg); color: var(--danger); }
.evidence-state.unknown .state-icon { background: var(--unknown-bg); color: var(--unknown); }
.evidence-state strong { display: block; font-size: .76rem; }
.evidence-state small { display: block; color: var(--ink-500); font-size: .64rem; }

.notice {
  display: flex;
  align-items: flex-start;
  gap: .65rem;
  padding: .75rem .85rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--ink-50);
  color: var(--ink-700);
  font-size: .75rem;
}
.notice svg { width: 17px; height: 17px; flex: 0 0 auto; margin-top: .05rem; }
.notice.info { border-color: rgba(39,95,137,.16); background: var(--info-bg); color: var(--blue-700); }
.notice.warning { border-color: rgba(138,90,10,.17); background: var(--warning-bg); color: var(--amber-700); }
.notice.danger { border-color: rgba(156,63,69,.17); background: var(--danger-bg); color: var(--red-700); }
.notice.success { border-color: rgba(8,109,112,.16); background: var(--success-bg); color: var(--ocean-800); }

/* Tables */
.table-wrap { width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .73rem; }
th, td { padding: .7rem .75rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th {
  color: var(--ink-500);
  background: var(--ink-50);
  font-size: .62rem;
  font-weight: 800;
  letter-spacing: .055em;
  text-transform: uppercase;
}
tbody tr { transition: background var(--duration); }
tbody tr:hover { background: rgba(238,248,247,.72); }
tbody tr:last-child td { border-bottom: 0; }
td.numeric, th.numeric { text-align: right; font-variant-numeric: tabular-nums; }
td.actions { text-align: right; }
.table-primary { display: block; color: var(--ink-900); font-weight: 720; }
.table-secondary { display: block; margin-top: .14rem; color: var(--ink-500); font-size: .64rem; }
.table-icon {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--ink-50);
  color: var(--ink-600);
}
.table-icon svg { width: 15px; height: 15px; }
.row-link { color: var(--ocean-800); font-weight: 720; text-decoration: none; }
.row-link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* Feature cards and shared home */
.feature-card {
  position: relative;
  min-height: 205px;
  display: flex;
  flex-direction: column;
  padding: 1.05rem;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--paper);
  box-shadow: var(--shadow-xs);
  text-decoration: none;
  transition: transform var(--duration) var(--ease), box-shadow var(--duration), border-color var(--duration);
}
.feature-card::after {
  content: "";
  position: absolute;
  width: 130px;
  height: 130px;
  right: -48px;
  bottom: -48px;
  border-radius: 50%;
  background: var(--feature-tint, var(--ocean-100));
  opacity: .55;
}
.feature-card:hover { transform: translateY(-3px); border-color: rgba(8,127,129,.32); box-shadow: var(--shadow-md); }
.feature-card-head { position: relative; z-index: 1; display: flex; align-items: flex-start; justify-content: space-between; gap: .75rem; }
.feature-number {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--feature-tint, var(--ocean-100));
  color: var(--feature-color, var(--ocean-800));
  font-size: .76rem;
  font-weight: 850;
}
.feature-number svg { width: 20px; height: 20px; }
.feature-card h2 { position: relative; z-index: 1; margin: .85rem 0 .38rem; font-size: .95rem; }
.feature-card p { position: relative; z-index: 1; max-width: 92%; color: var(--ink-600); font-size: .72rem; }
.feature-card-foot { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-top: auto; padding-top: .65rem; }
.feature-card-foot span { color: var(--ink-500); font-size: .64rem; }
.feature-card-foot svg { width: 16px; height: 16px; color: var(--ink-500); }

.quick-action {
  display: flex;
  align-items: center;
  gap: .7rem;
  min-height: 68px;
  padding: .75rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--paper);
  color: inherit;
  text-decoration: none;
  transition: border-color var(--duration), transform var(--duration);
}
.quick-action:hover { transform: translateY(-1px); border-color: rgba(8,127,129,.35); }
.quick-action-icon { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 10px; background: var(--ocean-100); color: var(--ocean-800); }
.quick-action-icon svg { width: 18px; height: 18px; }
.quick-action strong { display: block; font-size: .76rem; }
.quick-action span { display: block; color: var(--ink-500); font-size: .64rem; }

/* Map */
.map-frame {
  position: relative;
  min-height: 420px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: #e9efed;
  box-shadow: var(--shadow-xs);
}
.map-frame.compact { min-height: 300px; }
.map-surface {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(circle at 70% 20%, rgba(255,255,255,.55), transparent 18rem),
    linear-gradient(145deg, #e8eeec, #dfe8e5);
}
.map-surface::before {
  content: "";
  position: absolute;
  inset: -20%;
  opacity: .34;
  background-image:
    linear-gradient(rgba(23,51,61,.12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(23,51,61,.12) 1px, transparent 1px);
  background-size: 62px 62px;
  transform: rotate(-10deg) scale(1.2);
}
.map-water {
  position: absolute;
  width: 180%;
  height: 74px;
  left: -35%;
  top: 58%;
  transform: rotate(-11deg);
  border: 2px solid rgba(49,118,167,.2);
  background: rgba(111,173,206,.26);
  box-shadow: 0 0 0 12px rgba(111,173,206,.05);
}
.map-park { position: absolute; border-radius: 44% 56% 60% 40%; background: rgba(102,135,123,.18); border: 1px solid rgba(102,135,123,.22); }
.map-park.one { width: 180px; height: 120px; top: 8%; left: 9%; transform: rotate(-12deg); }
.map-park.two { width: 150px; height: 90px; right: 10%; bottom: 9%; transform: rotate(18deg); }
.map-roads { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-roads path.major { fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: round; filter: drop-shadow(0 1px 0 rgba(23,51,61,.1)); }
.map-roads path.minor { fill: none; stroke: rgba(255,255,255,.8); stroke-width: 4.5; stroke-linecap: round; }
.map-roads path.rail { fill: none; stroke: rgba(23,51,61,.36); stroke-width: 2; stroke-dasharray: 5 5; }
.map-label { position: absolute; color: rgba(23,51,61,.58); font-size: .63rem; font-weight: 700; text-shadow: 0 1px white; }
.map-label.city { color: rgba(23,51,61,.78); font-size: .72rem; }
.map-marker {
  position: absolute;
  z-index: 3;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  transform: translate(-50%, -50%);
  border: 3px solid white;
  border-radius: 50% 50% 50% 8px;
  background: var(--ocean-700);
  color: white;
  box-shadow: 0 5px 14px rgba(16,38,46,.28);
}
.map-marker svg { width: 13px; height: 13px; transform: rotate(45deg); }
.map-marker.selected { width: 34px; height: 34px; background: var(--coral-600); }
.map-marker.secondary { background: var(--blue-600); }
.map-marker.school { border-radius: 50%; background: var(--eucalypt-700); }
.map-marker .marker-inner { transform: rotate(45deg); }
.map-popup {
  position: absolute;
  z-index: 5;
  min-width: 205px;
  padding: .75rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255,255,255,.95);
  box-shadow: var(--shadow-md);
}
.map-popup strong { display: block; font-size: .76rem; }
.map-popup span { display: block; margin-top: .18rem; color: var(--ink-500); font-size: .63rem; }
.map-controls { position: absolute; z-index: 6; top: .8rem; left: .8rem; display: grid; gap: .4rem; }
.map-control {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(255,255,255,.95);
  box-shadow: var(--shadow-sm);
  color: var(--ink-700);
}
.map-control svg { width: 16px; height: 16px; }
.map-legend {
  position: absolute;
  z-index: 6;
  right: .8rem;
  bottom: .8rem;
  min-width: 190px;
  padding: .65rem .7rem;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: rgba(255,255,255,.93);
  box-shadow: var(--shadow-sm);
  font-size: .62rem;
}
.map-legend strong { display: block; margin-bottom: .35rem; font-size: .67rem; }
.legend-row { display: flex; align-items: center; gap: .42rem; margin-top: .25rem; }
.legend-swatch { width: 14px; height: 9px; border-radius: 3px; }
.legend-swatch.flood { background: repeating-linear-gradient(45deg, rgba(49,118,167,.7), rgba(49,118,167,.7) 2px, rgba(49,118,167,.2) 2px, rgba(49,118,167,.2) 4px); }
.legend-swatch.bushfire { background: repeating-linear-gradient(135deg, rgba(214,115,89,.8), rgba(214,115,89,.8) 2px, rgba(214,115,89,.2) 2px, rgba(214,115,89,.2) 4px); }
.legend-swatch.heritage { background: var(--sand-500); }
.map-overlay {
  position: absolute;
  z-index: 2;
  border: 2px solid rgba(49,118,167,.5);
  background: repeating-linear-gradient(45deg, rgba(49,118,167,.19), rgba(49,118,167,.19) 4px, rgba(49,118,167,.05) 4px, rgba(49,118,167,.05) 9px);
  clip-path: polygon(9% 22%, 70% 4%, 94% 44%, 77% 91%, 21% 77%);
}
.map-overlay.flood { width: 280px; height: 170px; left: 33%; top: 39%; transform: rotate(-8deg); }
.map-overlay.bushfire { width: 220px; height: 135px; right: 4%; top: 15%; border-color: rgba(214,115,89,.55); background: repeating-linear-gradient(135deg, rgba(214,115,89,.18), rgba(214,115,89,.18) 4px, rgba(214,115,89,.04) 4px, rgba(214,115,89,.04) 9px); }

.property-result-list { display: grid; gap: .55rem; }
.property-result {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: .7rem;
  align-items: center;
  padding: .72rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper);
  color: inherit;
  text-decoration: none;
  transition: border-color var(--duration), transform var(--duration), box-shadow var(--duration);
}
.property-result:hover, .property-result.selected { border-color: rgba(8,127,129,.42); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.property-result.selected { background: var(--ocean-50); }
.property-result-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--ocean-100); color: var(--ocean-800); }
.property-result-icon svg { width: 17px; height: 17px; }
.property-result strong { display: block; font-size: .75rem; }
.property-result span { display: block; color: var(--ink-500); font-size: .63rem; }
.property-result-meta { text-align: right; }

/* Charts */
.chart {
  position: relative;
  min-height: 230px;
  padding: .75rem .65rem .45rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: linear-gradient(180deg, var(--paper), var(--ink-50));
  overflow: hidden;
}
.chart svg { width: 100%; height: 210px; overflow: visible; }
.chart .grid-line { stroke: rgba(23,51,61,.1); stroke-width: 1; }
.chart .axis-label { fill: var(--ink-500); font-size: 9px; font-family: var(--font-sans); }
.chart .line-primary { fill: none; stroke: var(--ocean-600); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chart .line-secondary { fill: none; stroke: var(--coral-500); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart .line-tertiary { fill: none; stroke: var(--blue-600); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart .area-primary { fill: url(#areaFill); opacity: .6; }
.chart .point { fill: white; stroke: var(--ocean-600); stroke-width: 2; }
.chart .bar { fill: var(--ocean-500); rx: 3; }
.chart .bar.secondary { fill: var(--coral-500); }
.chart-legend { display: flex; flex-wrap: wrap; gap: .8rem; margin-bottom: .55rem; color: var(--ink-600); font-size: .64rem; }
.chart-legend-item { display: flex; align-items: center; gap: .35rem; }
.chart-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ocean-600); }
.chart-dot.secondary { background: var(--coral-500); }
.chart-dot.tertiary { background: var(--blue-600); }
.sparkline { width: 90px; height: 28px; }
.sparkline path { fill: none; stroke: var(--ocean-600); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sparkline.negative path { stroke: var(--red-600); }

/* Timelines, agent traces and lineage */
.timeline { position: relative; display: grid; gap: .2rem; margin: 0; padding: 0; list-style: none; }
.timeline::before { content: ""; position: absolute; top: 16px; bottom: 18px; left: 14px; width: 1px; background: var(--line-strong); }
.timeline-item { position: relative; display: grid; grid-template-columns: 29px minmax(0, 1fr) auto; gap: .65rem; align-items: start; padding: .45rem 0; }
.timeline-marker { position: relative; z-index: 1; width: 29px; height: 29px; display: grid; place-items: center; border: 3px solid var(--paper); border-radius: 50%; background: var(--ink-100); color: var(--ink-600); box-shadow: 0 0 0 1px var(--line); }
.timeline-marker svg { width: 13px; height: 13px; }
.timeline-marker.success { background: var(--success-bg); color: var(--success); }
.timeline-marker.running { background: var(--info-bg); color: var(--info); }
.timeline-marker.warning { background: var(--warning-bg); color: var(--warning); }
.timeline-marker.failed { background: var(--danger-bg); color: var(--danger); }
.timeline-copy h3 { margin: .08rem 0 .1rem; font-size: .76rem; }
.timeline-copy p { margin: 0; color: var(--ink-500); font-size: .65rem; }
.timeline-time { color: var(--ink-500); font-family: var(--font-mono); font-size: .61rem; }

.agent-loop {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: .45rem;
}
.agent-phase {
  position: relative;
  min-height: 108px;
  padding: .75rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper);
}
.agent-phase::after { content: "→"; position: absolute; top: 50%; right: -.46rem; z-index: 2; color: var(--ink-300); font-weight: 800; transform: translateY(-50%); }
.agent-phase:last-child::after { display: none; }
.agent-phase.active { border-color: rgba(49,118,167,.35); background: var(--info-bg); }
.agent-phase.complete { border-color: rgba(8,109,112,.26); background: var(--success-bg); }
.agent-phase h3 { margin: .4rem 0 .25rem; }
.agent-phase p { margin: 0; color: var(--ink-600); font-size: .64rem; }
.agent-phase-icon { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 9px; background: var(--ink-100); color: var(--ink-600); }
.agent-phase.active .agent-phase-icon { background: rgba(49,118,167,.13); color: var(--blue-700); }
.agent-phase.complete .agent-phase-icon { background: rgba(8,109,112,.12); color: var(--ocean-700); }
.agent-phase-icon svg { width: 15px; height: 15px; }

.tool-call {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: .65rem;
  align-items: center;
  padding: .68rem .72rem;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--paper);
}
.tool-call + .tool-call { margin-top: .45rem; }

function icon(name, className = "") {
  const paths = ICONS[name] || ICONS.help;
  return `<svg class="${escapeAttr(className)}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
}

function escapeHtml(value = "") {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value = "") {
  return escapeHtml(value).replaceAll("`", "&#096;");
}

function route(path, label, options = {}) {
  const { className = "", iconName = "", attrs = "" } = options;
  return `<a class="${escapeAttr(className)}" href="#/${escapeAttr(path)}" data-route="${escapeAttr(path)}" ${attrs}>${iconName ? icon(iconName) : ""}${escapeHtml(label)}</a>`;
}

function button(label, options = {}) {
  const {
    kind = "secondary",
    iconName = "",
    route: routeName = "",
    size = "",
    className = "",
    attrs = "",
    type = "button",
  } = options;
  const classes = ["button", kind, size, className].filter(Boolean).join(" ");
  const iconMarkup = iconName ? icon(iconName) : "";
  if (routeName) {
    return `<a class="${escapeAttr(classes)}" href="#/${escapeAttr(routeName)}" data-route="${escapeAttr(routeName)}" ${attrs}>${iconMarkup}${escapeHtml(label)}</a>`;
  }
  return `<button class="${escapeAttr(classes)}" type="${escapeAttr(type)}" ${attrs}>${iconMarkup}${escapeHtml(label)}</button>`;
}

function iconButton(label, iconName, options = {}) {
  const { kind = "secondary", route: routeName = "", attrs = "" } = options;
  const common = `class="button ${escapeAttr(kind)} icon-only" aria-label="${escapeAttr(label)}" title="${escapeAttr(label)}" ${attrs}`;
  if (routeName) return `<a ${common} href="#/${escapeAttr(routeName)}" data-route="${escapeAttr(routeName)}">${icon(iconName)}</a>`;
  return `<button ${common} type="button">${icon(iconName)}</button>`;
}

function badge(label, state = "unknown", extra = "") {
  return `<span class="badge ${escapeAttr(state)} ${escapeAttr(extra)}">${escapeHtml(label)}</span>`;
}

function tag(label) {
  return `<span class="tag">${escapeHtml(label)}</span>`;
}

function releaseChip(release = "R0", label = "") {

function field({ label, value = "", type = "text", placeholder = "", options = [], className = "", help = "", attrs = "" }) {
  let control = "";
  if (type === "select") {
    control = `<select class="input" ${attrs}>${options.map((opt) => {
      const item = typeof opt === "string" ? { value: opt, label: opt } : opt;
      return `<option value="${escapeAttr(item.value)}" ${item.value === value ? "selected" : ""}>${escapeHtml(item.label)}</option>`;
    }).join("")}</select>`;
  } else if (type === "textarea") {
    control = `<textarea class="input" placeholder="${escapeAttr(placeholder)}" ${attrs}>${escapeHtml(value)}</textarea>`;
  } else {
    control = `<input class="input" type="${escapeAttr(type)}" value="${escapeAttr(value)}" placeholder="${escapeAttr(placeholder)}" ${attrs}>`;
  }
  return `<label class="field ${escapeAttr(className)}"><span>${escapeHtml(label)}</span>${control}${help ? `<small>${escapeHtml(help)}</small>` : ""}</label>`;
}

function table({ columns, rows, rowClass = "", empty = "No records found", attrs = "" }) {
  if (!rows.length) return `<div class="empty-state"><div><span class="empty-state-icon">${icon("search")}</span><h2>${escapeHtml(empty)}</h2></div></div>`;
  const heads = columns.map((col) => `<th scope="col" ${col.width ? `style="width:${escapeAttr(col.width)}"` : ""}>${escapeHtml(col.label)}</th>`).join("");
  const body = rows.map((row, index) => {
    const cells = columns.map((col) => `<td>${col.render ? col.render(row, index) : escapeHtml(row[col.key] ?? "")}</td>`).join("");
    return `<tr class="${escapeAttr(typeof rowClass === "function" ? rowClass(row, index) : rowClass)}">${cells}</tr>`;
  }).join("");
  return `<div class="table-wrap"><table ${attrs}><thead><tr>${heads}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function barChart(items, { max = null, labelKey = "label", valueKey = "value", secondaryKey = "", suffix = "" } = {}) {
  const peak = max || Math.max(...items.map((item) => Number(item[valueKey]) || 0), 1);
  return `<div class="chart" role="img" aria-label="Bar chart"><div class="bar-chart">${items.map((item) => {
    const val = Number(item[valueKey]) || 0;
    const pct = Math.max(3, Math.round((val / peak) * 100));
    const secondary = secondaryKey ? `<span class="bar-secondary" style="width:${Math.max(2, Math.round(((Number(item[secondaryKey]) || 0) / peak) * 100))}%"></span>` : "";
    return `<div class="bar-row"><span class="bar-label">${escapeHtml(item[labelKey])}</span><span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span>${secondary}</span><strong>${escapeHtml(`${val}${suffix}`)}</strong></div>`;
  }).join("")}</div></div>`;
}

function lineChart(series, { width = 640, height = 190, labels = [], ariaLabel = "Line chart" } = {}) {
  const allValues = series.flatMap((s) => s.values);
  const min = Math.min(...allValues);
  const max = Math.max(...allValues);
  const range = Math.max(max - min, 1);
  const padding = 18;
  const usableW = width - padding * 2;
  const usableH = height - padding * 2;
  const polylines = series.map((s, seriesIndex) => {
    const points = s.values.map((v, i) => {
      const x = padding + (i / Math.max(s.values.length - 1, 1)) * usableW;
      const y = padding + usableH - ((v - min) / range) * usableH;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
    return `<polyline class="chart-series series-${seriesIndex + 1}" points="${points}"/>`;
  }).join("");
  const dots = series.map((s, seriesIndex) => s.values.map((v, i) => {
    const x = padding + (i / Math.max(s.values.length - 1, 1)) * usableW;
    const y = padding + usableH - ((v - min) / range) * usableH;
    return `<circle class="chart-dot series-${seriesIndex + 1}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"/>`;
  }).join("")).join("");
  const gridLines = [0, .25, .5, .75, 1].map((ratio) => `<line x1="${padding}" y1="${padding + usableH * ratio}" x2="${width - padding}" y2="${padding + usableH * ratio}"/>`).join("");
  const axisLabels = labels.map((label, i) => `<span style="left:${(i / Math.max(labels.length - 1, 1)) * 100}%">${escapeHtml(label)}</span>`).join("");
  return `<div class="chart" role="img" aria-label="${escapeAttr(ariaLabel)}"><svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"><g class="chart-grid">${gridLines}</g>${polylines}${dots}</svg>${labels.length ? `<div class="chart-axis-labels">${axisLabels}</div>` : ""}</div>`;
}

function sparkline(values, width = 94, height = 24) {
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = Math.max(max - min, 1);
  const points = values.map((v, i) => `${(i / Math.max(values.length - 1, 1) * width).toFixed(1)},${(height - ((v - min) / range) * height).toFixed(1)}`).join(" ");
  return `<svg class="sparkline" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${points}"/></svg>`;
}

function currentRoute() {
  const raw = window.location.hash.replace(/^#\/?/, "").split(/[?&]/)[0];
  return screenDefinitions[raw] ? raw : "home";
}

  return `<a class="brand" href="#/home" data-route="home" aria-label="PropertyScope NSW home">

}

function topbar() {
  return `<header class="topbar">
    ${brand()}
    <form class="global-search" id="global-search-form" role="search">
      ${icon("search")}
      <input id="global-search-input" type="search" aria-label="Search properties" placeholder="Search address, suburb or PropertyScope reference">

function rail(routeName) {
  const def = screenDefinitions[routeName];
  const contextIcon = def.feature === "Feature 1" ? "database" : def.feature === "Feature 2" ? "trend" : def.feature === "Feature 3" ? "map" : def.feature === "Feature 4" ? "layers" : def.feature === "Feature 5" ? "briefcase" : def.feature === "Release 1" ? "book" : def.feature === "Release 2" ? "users" : "home";
  const contextDetail = def.feature === "Shared" ? "Integrated application" : def.feature === "Feature 1" ? "Implemented priority feature" : def.feature.startsWith("Feature") ? "Full-scale product scope" : `${def.feature} capability`;
  const groups = navGroups.map((group) => `<section class="rail-section"><p class="rail-label">${escapeHtml(group.label)}</p><nav class="rail-nav" aria-label="${escapeHtml(group.label)}">${group.links.map(([path, label, iconName, navBadge]) => `<a class="rail-link" href="#/${path}" data-route="${path}" ${path === routeName ? 'aria-current="page"' : ""}>${icon(iconName)}<span>${escapeHtml(label)}</span>${navBadge ? `<span class="nav-badge ${navBadge === "Planned" ? "future" : ""}">${escapeHtml(navBadge)}</span>` : ""}</a>`).join("")}</nav></section>`).join("");
  return `<aside class="rail" id="primary-navigation">
    <div class="rail-context"><span class="rail-context-icon">${icon(contextIcon)}</span><span><strong>${escapeHtml(def.feature)}</strong><span>${escapeHtml(contextDetail)}</span></span></div>
    ${groups}
    <div class="rail-footer"><strong>Non-government research tool</strong>Source coverage and uncertainty are shown throughout. Verify material decisions with the relevant authority or qualified adviser.</div>
  </aside>`;
}

function shell(routeName) {
  const definition = screenDefinitions[routeName];
  return `${topbar()}${releaseStrip()}<div class="shell">${rail(routeName)}<main class="main" id="main-content" tabindex="-1"><div class="main-inner">${definition.render()}</div></main></div><div class="prototype-note">Interactive product prototype · static showcase data</div><div id="toast-region" class="toast-region" aria-live="polite"></div>`;
}

function render() {
  const routeName = currentRoute();
  const definition = screenDefinitions[routeName];
  app.innerHTML = shell(routeName);
  document.title = `${definition.title} — PropertyScope NSW`;
  document.body.dataset.screen = routeName;
  document.body.classList.remove("nav-open");
  window.scrollTo({ top: 0, behavior: "instant" });
  bindPageEvents();
}

function toast(message) {
  const region = document.querySelector("#toast-region");
  if (!region) return;
  const item = document.createElement("div");
  item.className = "toast";
  item.innerHTML = `${icon("check")}<span>${escapeHtml(message)}</span>`;
  region.append(item);
  requestAnimationFrame(() => item.classList.add("visible"));
  window.setTimeout(() => {
    item.classList.remove("visible");
    window.setTimeout(() => item.remove(), 220);
  }, 2400);
}

function bindPageEvents() {
  const mobileMenu = document.querySelector("#mobile-menu");
  mobileMenu?.addEventListener("click", () => {
    const open = document.body.classList.toggle("nav-open");
    mobileMenu.setAttribute("aria-expanded", String(open));
  });

  document.querySelectorAll("[data-route]").forEach((link) => {
    link.addEventListener("click", () => document.body.classList.remove("nav-open"));
  });

  const searchForm = document.querySelector("#global-search-form");
  searchForm?.addEventListener("submit", (event) => {
    event.preventDefault();
    window.location.hash = "#/explore";
  });

  document.querySelectorAll("button:not([disabled]):not(#mobile-menu)").forEach((control) => {
    if (control.closest("#global-search-form")) return;
    control.addEventListener("click", () => {
      if (control.dataset.prototypeAction === "release-switcher") {
        toast("Release capabilities are shown on the roadmap screen.");
      } else if (control.dataset.prototypeAction === "notifications") {
        toast("No unread prototype notifications.");
      } else if (control.dataset.prototypeAction === "profile") {
        toast("Profile and authentication are outside the semester scope.");
      } else if (!control.closest("a") && !control.hasAttribute("data-route")) {
        const label = control.textContent.trim() || control.getAttribute("aria-label") || "Action";
        toast(`${label} is represented as a prototype interaction.`);
      }
    });
  });
}

window.addEventListener("hashchange", render);
window.addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    document.querySelector("#global-search-input")?.focus();
  }
  if (event.key === "Escape") document.body.classList.remove("nav-open");
});

if (!window.location.hash) window.location.hash = "#/home";
else render();
