schema_version: 1
services:
  - service: propertyscope-data-platform-backend
    base_url: http://f1-backend:5201
tools:
  - definition:
      name: platform.capabilities.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Explain the current PropertyScope website, implemented research areas, assistant behavior, routes, limitations, and safe suggested questions from a bounded versioned guide.
      input_schema:
        type: object
        properties: {}
        additionalProperties: false
      output_schema:
        type: object
        properties:
          revision: {type: string}
          application: {type: object}
          assistant: {type: object}
          features: {type: array, maxItems: 5, items: {type: object}}
          suggested_questions: {type: array, maxItems: 10, items: {type: string}}
        required: [revision, application, assistant, features, suggested_questions]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/platform.capabilities.v1
  - definition:
      name: data.sources.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: List a bounded set of registered source definitions. Registration, active status, or a connected transport does not prove that a dataset is loaded; use data.releases.v1 for release and record-count evidence.
      input_schema:
        type: object
        properties:
          status: {enum: [draft, active, disabled, retired]}
          limit: {type: integer, minimum: 1, maximum: 50, default: 25}
        additionalProperties: false
      output_schema:
        type: object
        properties:
          items: {type: array, maxItems: 50, items: {type: object}}
          count: {type: integer, minimum: 0, maximum: 50}
        required: [items, count]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/sources.list.v1
  - definition:
      name: data.releases.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: List bounded dataset release summaries and their exact status, record count, dataset ID, ingestion run, and release ID. Use this to discover loaded, candidate, accepted, rejected, or superseded releases when no exact release ID is known.
      input_schema:
        type: object
        properties:
          status: {enum: [draft, candidate, awaiting_review, accepted, rejected, superseded, abandoned]}
          dataset_id: {type: string, minLength: 1, maxLength: 150}
          target_feature: {type: string, minLength: 1, maxLength: 100}
          limit: {type: integer, minimum: 1, maximum: 50, default: 25}
        additionalProperties: false
      output_schema:
        type: object
        properties:
          items:
            type: array
            maxItems: 50
            items:
              type: object
              properties:
                id: {type: string, format: uuid, x-identifier-kind: release_id}
          count: {type: integer, minimum: 0, maximum: 50}
        required: [items, count]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/releases.list.v1
  - definition:
      name: data.runs.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: List bounded ingestion run summaries, defaulting to the latest 10 succeeded runs. A fully loaded claim requires a succeeded run whose requested scope explicitly says full-data or all-records plus its row counts. Pass another status only when the question asks about that state. Use data.run_inspect.v1 for a supplied run ID.
      input_schema:
        type: object
        properties:
          status: {type: string, pattern: "^[a-z_]+$"}
          limit: {type: integer, minimum: 1, maximum: 25, default: 10}
        additionalProperties: false
      output_schema:
        type: object
        properties:
          items:
            type: array
            maxItems: 25
            items:
              type: object
              properties:
                id: {type: string, format: uuid, x-identifier-kind: run_id}
          count: {type: integer, minimum: 0, maximum: 25}
        required: [items, count]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/runs.list.v1
  - definition:
      name: data.release_inspect.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Inspect one dataset release, its quality evidence, publication receipts and activations, and accepted predecessor by exact release ID.
      input_schema:
        type: object
        properties:
          release_id: {type: string, format: uuid, x-identifier-kind: release_id}
        required: [release_id]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          release:
            type: object
            properties:
              id: {type: string, format: uuid, x-identifier-kind: release_id}
          quality_results: {type: array, maxItems: 100, items: {type: object}}
          quality_summary:
            type: object
            properties:
              total: {type: integer, minimum: 0}
              passed: {type: integer, minimum: 0}
              failed: {type: integer, minimum: 0}
              blocking_failures: {type: integer, minimum: 0}
            required: [total, passed, failed, blocking_failures]
            additionalProperties: false
          receipts: {type: array, maxItems: 100, items: {type: object}}
          activations: {type: array, maxItems: 100, items: {type: object}}
          accepted_predecessor:
            type: [object, "null"]
            properties:
              id: {type: string, format: uuid, x-identifier-kind: release_id}
          release_contract: {type: [object, "null"]}
        required:
          - release
          - quality_results
          - quality_summary
          - receipts
          - activations
          - accepted_predecessor
          - release_contract
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/releases.inspect.v1
  - definition:
      name: data.run_inspect.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Inspect one exact ingestion run and bounded task, artifact, error, and quality evidence. Prefer this tool whenever the objective supplies a run ID.
      input_schema:
        type: object
        properties:
          run_id: {type: string, format: uuid, x-identifier-kind: run_id}
        required: [run_id]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          run:
            type: object
            properties:
              id: {type: string, format: uuid, x-identifier-kind: run_id}
          tasks: {type: array, maxItems: 100, items: {type: object}}
          quality_results: {type: array, maxItems: 100, items: {type: object}}
        required: [run, tasks, quality_results]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/runs.inspect.v1
  - definition:
      name: data.run_explain.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Explain one exact ingestion run using bounded current-task, saved-progress, timestamp, error, and quality evidence. Prefer this tool whenever the objective supplies a run ID. Progress is a durable checkpoint, not an ETA.
      input_schema:
        type: object
        properties:
          run_id: {type: string, format: uuid, x-identifier-kind: run_id}
        required: [run_id]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          run: {$ref: '#/$defs/run'}
          tasks: {type: array, maxItems: 100, items: {$ref: '#/$defs/task'}}
          quality_results: {type: array, maxItems: 100, items: {$ref: '#/$defs/quality'}}
          insight: {$ref: '#/$defs/insight'}
        required: [run, tasks, quality_results, insight]
        additionalProperties: false
        $defs:
          nullable_uuid: {type: [string, 'null'], format: uuid}
          nullable_timestamp: {type: [string, 'null'], format: date-time}
          error:
            type: [object, 'null']
            properties:
              code: {type: [string, 'null'], maxLength: 120}
              category: {type: [string, 'null'], maxLength: 120}
              message: {type: string, minLength: 1, maxLength: 500}
              retryable: {type: [boolean, 'null']}
            required: [code, category, message, retryable]
            additionalProperties: false
          progress:
            type: object
            properties:
              phase: {type: [string, 'null'], maxLength: 160}
              processed_rows: {type: integer, minimum: 0}
              total_rows: {type: [integer, 'null'], minimum: 0}
              processed_bytes: {type: integer, minimum: 0}
              total_bytes: {type: [integer, 'null'], minimum: 0}
              updated_at: {$ref: '#/$defs/nullable_timestamp'}
            required: [phase, processed_rows, total_rows, processed_bytes, total_bytes, updated_at]
            additionalProperties: false
          task:
            type: object
            properties:
              id: {$ref: '#/$defs/nullable_uuid'}
              logical_key: {type: string, minLength: 1, maxLength: 160}
              stage: {type: string, minLength: 1, maxLength: 100}
              status: {type: string, minLength: 1, maxLength: 80}
              attempt_number: {type: integer, minimum: 1}
              rows_in: {type: integer, minimum: 0}
              rows_out: {type: integer, minimum: 0}
              progress: {$ref: '#/$defs/progress'}
              timestamps:
                type: object
                properties:
                  started_at: {$ref: '#/$defs/nullable_timestamp'}
                  last_activity_at: {$ref: '#/$defs/nullable_timestamp'}
                  finished_at: {$ref: '#/$defs/nullable_timestamp'}
                required: [started_at, last_activity_at, finished_at]
                additionalProperties: false
              error: {$ref: '#/$defs/error'}
            required: [id, logical_key, stage, status, attempt_number, rows_in, rows_out, progress, timestamps, error]
            additionalProperties: false
          quality:
            type: object
            properties:
              rule_key: {type: string, minLength: 1, maxLength: 160}
              dimension: {type: string, minLength: 1, maxLength: 80}
              severity: {type: string, minLength: 1, maxLength: 80}
              status: {type: string, minLength: 1, maxLength: 80}
              message: {type: string, minLength: 1, maxLength: 500}
            required: [rule_key, dimension, severity, status, message]
            additionalProperties: false
          run:
            type: object
            properties:
              id: {$ref: '#/$defs/nullable_uuid', x-identifier-kind: run_id}
              job_definition_id: {$ref: '#/$defs/nullable_uuid'}
              job_name: {type: [string, 'null'], maxLength: 200}
              source_definition_id: {$ref: '#/$defs/nullable_uuid'}
              source_name: {type: [string, 'null'], maxLength: 200}
              status: {type: string, minLength: 1, maxLength: 80}
              run_mode: {type: string, minLength: 1, maxLength: 80}
              profile_key: {type: [string, 'null'], maxLength: 120}
              scope:
                type: object
                properties:
                  profile: {type: [string, 'null'], maxLength: 100}
                  all_records: {type: [boolean, 'null']}
                  explicit_complete_source: {type: boolean}
                required: [profile, all_records, explicit_complete_source]
                additionalProperties: false
              attempt_number: {type: integer, minimum: 1}
              parent_run_id: {$ref: '#/$defs/nullable_uuid', x-identifier-kind: run_id}
              counts:
                type: object
                properties:
                  rows_discovered: {type: integer, minimum: 0}
                  rows_staged: {type: integer, minimum: 0}
                  rows_accepted: {type: integer, minimum: 0}
                  rows_rejected: {type: integer, minimum: 0}
                required: [rows_discovered, rows_staged, rows_accepted, rows_rejected]
                additionalProperties: false
              timestamps:
                type: object
                properties:
                  requested_at: {$ref: '#/$defs/nullable_timestamp'}
                  started_at: {$ref: '#/$defs/nullable_timestamp'}
                  last_activity_at: {$ref: '#/$defs/nullable_timestamp'}
                  finished_at: {$ref: '#/$defs/nullable_timestamp'}
                required: [requested_at, started_at, last_activity_at, finished_at]
                additionalProperties: false
              error: {$ref: '#/$defs/error'}
            required: [id, job_definition_id, job_name, source_definition_id, source_name, status, run_mode, profile_key, scope, attempt_number, parent_run_id, counts, timestamps, error]
            additionalProperties: false
          insight_progress:
            type: object
            properties:
              basis: {type: [string, 'null'], enum: [rows, bytes, null]}
              processed: {type: integer, minimum: 0}
              total: {type: [integer, 'null'], minimum: 0}
              percent_complete: {type: [number, 'null'], minimum: 0, maximum: 100}
              updated_at: {$ref: '#/$defs/nullable_timestamp'}
            required: [basis, processed, total, percent_complete, updated_at]
            additionalProperties: false
          insight:
            type: object
            properties:
              headline: {type: string, minLength: 1, maxLength: 200}
              current_task_id: {$ref: '#/$defs/nullable_uuid'}
              current_stage: {type: [string, 'null'], maxLength: 100}
              current_task_status: {type: [string, 'null'], maxLength: 80}
              completed_tasks: {type: integer, minimum: 0, maximum: 100}
              failed_tasks: {type: integer, minimum: 0, maximum: 100}
              total_tasks: {type: integer, minimum: 0, maximum: 100}
              progress: {$ref: '#/$defs/insight_progress'}
              observations: {type: array, maxItems: 8, items: {type: string, minLength: 1, maxLength: 500}}
              limitations: {type: array, maxItems: 4, items: {type: string, minLength: 1, maxLength: 500}}
            required: [headline, current_task_id, current_stage, current_task_status, completed_tasks, failed_tasks, total_tasks, progress, observations, limitations]
            additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/runs.explain.v1
  - definition:
      name: data.release_compare.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Compare two exact release IDs using bounded schema, coverage, count, hash, and quality evidence.
      input_schema:
        type: object
        properties:
          candidate_release_id:
            {type: string, format: uuid, x-identifier-kind: release_id}
          predecessor_release_id:
            {type: string, format: uuid, x-identifier-kind: release_id}
        required: [candidate_release_id, predecessor_release_id]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          candidate:
            type: object
            properties:
              id: {type: string, format: uuid, x-identifier-kind: release_id}
          predecessor:
            type: object
            properties:
              id: {type: string, format: uuid, x-identifier-kind: release_id}
          differences: {type: array, maxItems: 100, items: {type: object}}
        required: [candidate, predecessor, differences]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/releases.compare.v1
  - definition:
      name: data.coverage.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Inspect accepted, partial, stale, unavailable, or unsupported dataset coverage for a locality.
      input_schema:
        type: object
        properties:
          locality: {type: string, minLength: 1, maxLength: 100}
          postcode: {type: string, pattern: "^\\d{4}$"}
        required: [locality]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          items: {type: array, maxItems: 50, items: {type: object}}
        required: [items]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/coverage.inspect.v1
  - definition:
      name: property.search.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Search bounded accepted NSW property address evidence using plain address text.
      input_schema:
        type: object
        properties:
          query: {type: string, minLength: 2, maxLength: 200}
          limit: {type: integer, minimum: 1, maximum: 25, default: 10}
        required: [query]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          items: {type: array, maxItems: 25, items: {type: object}}
          count: {type: integer, minimum: 0, maximum: 25}
        required: [items, count]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/properties.search.v1
  - definition:
      name: property.inspect.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Inspect one exact property reference with match, source release, map point, and domain coverage evidence.
      input_schema:
        type: object
        properties:
          property_ref: {type: string, format: uuid, x-identifier-kind: property_ref}
        required: [property_ref]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          property: {type: object}
          identifiers: {type: array, maxItems: 25, items: {type: object}}
          aliases: {type: array, maxItems: 25, items: {type: object}}
          coverage: {type: array, maxItems: 25, items: {type: object}}
          sales_history:
            type: object
            properties:
              availability:
                type: object
                properties:
                  status: {enum: [available, dataset_unavailable, unsupported_contract]}
                  reason: {type: string, minLength: 1, maxLength: 300}
                  accepted_release_id:
                    {type: [string, "null"], format: uuid, x-identifier-kind: release_id}
                required: [status, reason, accepted_release_id]
                additionalProperties: false
              items: {type: array, maxItems: 25, items: {type: object}}
              count: {type: integer, minimum: 0, maximum: 25}
              limit: {type: integer, minimum: 1, maximum: 100}
              has_more: {type: boolean}
              supported: {type: boolean}
              release: {type: [object, "null"]}
            required: [availability, items, count, limit, has_more, supported, release]
            additionalProperties: false
        required: [property, identifiers, aliases, coverage, sales_history]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/properties.inspect.v1
  - definition:
      name: property.locality_summary.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Count accepted NSW address records for an exact locality, postcode, or both. These are registered address records, not houses, legal lots, dwellings or ownership records. Street aggregation is opt-in.
      input_schema:
        type: object
        properties:
          locality: {type: string, minLength: 1, maxLength: 100}
          postcode: {type: string, pattern: "^\\d{4}$"}
          include_streets: {type: boolean, default: false}
        anyOf:
          - required: [locality]
          - required: [postcode]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          availability:
            type: object
            properties:
              status: {enum: [available, dataset_unavailable]}
              reason: {type: string, minLength: 1, maxLength: 300}
              accepted_release_id:
                {type: [string, "null"], format: uuid, x-identifier-kind: release_id}
            required: [status, reason, accepted_release_id]
            additionalProperties: false
          scope:
            type: object
            properties:
              locality: {type: [string, "null"]}
              postcode: {type: [string, "null"], pattern: "^\\d{4}$"}
              state: {const: NSW}
            required: [locality, postcode, state]
            additionalProperties: false
          total_registered_addresses: {type: integer, minimum: 0}
          unit_number_summary:
            type: object
            properties:
              with_unit_number: {type: integer, minimum: 0}
              without_unit_number: {type: integer, minimum: 0}
            required: [with_unit_number, without_unit_number]
            additionalProperties: false
          bounding_box:
            type: [object, "null"]
            properties:
              min_latitude: {type: number}
              max_latitude: {type: number}
              min_longitude: {type: number}
              max_longitude: {type: number}
            required: [min_latitude, max_latitude, min_longitude, max_longitude]
            additionalProperties: false
          top_streets:
            type: array
            maxItems: 20
            items:
              type: object
              properties:
                street_name: {type: string, minLength: 1}
                address_count: {type: integer, minimum: 1}
              required: [street_name, address_count]
              additionalProperties: false
          release: {type: [object, "null"]}
        required:
          - availability
          - scope
          - total_registered_addresses
          - unit_number_summary
          - bounding_box
          - top_streets
          - release
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 5000
      requires_approval: false
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/properties.locality-summary.v1
  - definition:
      name: data.run_retry.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Create one bounded child retry for a failed or interrupted ingestion run after human approval.
      input_schema:
        type: object
        properties:
          run_id: {type: string, format: uuid, x-identifier-kind: run_id}
          idempotency_key: {type: string, minLength: 8, maxLength: 200}
        required: [run_id, idempotency_key]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          child_run_id: {type: string, format: uuid, x-identifier-kind: run_id}
          replayed: {type: boolean}
        required: [child_run_id, replayed]
        additionalProperties: false
      side_effect: reversible_write
      timeout_ms: 5000
      requires_approval: true
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/runs.retry.v1
  - definition:
      name: data.release_publish.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Publish one reviewed candidate release through its registered consumer contract with idempotent reconciliation.
      input_schema:
        type: object
        properties:
          release_id:
            {type: string, format: uuid, x-identifier-kind: release_id}
          idempotency_key: {type: string, minLength: 8, maxLength: 200}
        required: [release_id, idempotency_key]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          status: {enum: [accepted, failed, pending]}
          receipt_id: {type: [string, "null"]}
          replayed: {type: boolean}
        required: [status, receipt_id, replayed]
        additionalProperties: false
      side_effect: destructive_write
      timeout_ms: 5000
      requires_approval: true
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/releases.publish.v1
shared_tools: []
