schema_version: 1
services:
  - service: propertyscope-data-platform-backend
    base_url: http://propertyscope-backend:5201
tools:
  - definition:
      name: data.release_inspect.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Inspect one dataset release, its quality evidence, and accepted predecessor by exact release ID.
      input_schema:
        type: object
        properties:
          release_id: {type: string, minLength: 1, maxLength: 150}
        required: [release_id]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          release: {type: object}
          quality_results: {type: array, maxItems: 100, items: {type: object}}
          accepted_predecessor: {type: [object, "null"]}
        required: [release, quality_results, accepted_predecessor]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/releases.inspect.v1
  - definition:
      name: data.run_inspect.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Inspect one ingestion run and bounded task, artifact, error, and quality evidence.
      input_schema:
        type: object
        properties:
          run_id: {type: string, format: uuid}
        required: [run_id]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          run: {type: object}
          tasks: {type: array, maxItems: 100, items: {type: object}}
          quality_results: {type: array, maxItems: 100, items: {type: object}}
        required: [run, tasks, quality_results]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/runs.inspect.v1
  - definition:
      name: property.search.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Search bounded accepted NSW property address evidence using plain address text.
      input_schema:
        type: object
        properties:
          query: {type: string, minLength: 2, maxLength: 200}
          limit: {type: integer, minimum: 1, maximum: 25, default: 10}
        required: [query]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          items: {type: array, maxItems: 25, items: {type: object}}
          count: {type: integer, minimum: 0, maximum: 25}
        required: [items, count]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/properties.search.v1
  - definition:
      name: data.run_retry.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Create one bounded child retry for a failed or interrupted ingestion run after human approval.
      input_schema:
        type: object
        properties:
          run_id: {type: string, format: uuid}
          profile_key: {type: string, pattern: "^[a-z0-9][a-z0-9._-]*$"}
          idempotency_key: {type: string, minLength: 8, maxLength: 200}
        required: [run_id, profile_key, idempotency_key]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          child_run_id: {type: string, format: uuid}
          replayed: {type: boolean}
        required: [child_run_id, replayed]
        additionalProperties: false
      side_effect: reversible_write
      timeout_ms: 5000
      requires_approval: true
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/runs.retry.v1
  - definition:
      name: data.release_publish.v1
      version: v1
      feature_key: student-1-propertyscope-data-platform
      description: Publish one reviewed candidate release through its registered consumer contract with idempotent reconciliation.
      input_schema:
        type: object
        properties:
          release_id: {type: string, minLength: 1, maxLength: 150}
          idempotency_key: {type: string, minLength: 8, maxLength: 200}
        required: [release_id, idempotency_key]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          status: {enum: [accepted, rejected, pending]}
          receipt_id: {type: [string, "null"]}
          replayed: {type: boolean}
        required: [status, receipt_id, replayed]
        additionalProperties: false
      side_effect: destructive_write
      timeout_ms: 5000
      requires_approval: true
    service: propertyscope-data-platform-backend
    method: POST
    path: /api/data-platform/v1/tools/releases.publish.v1
shared_tools: []
