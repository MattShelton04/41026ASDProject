[project]
name = "student-1-feature"
version = "0.1.0"
description = "Student 1 owned feature slice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
    "httpx>=0.28,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pyarrow>=21,<24",
    "pydantic>=2.12,<3",
    "pyyaml>=6,<7",
    "shared-contracts",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src", "database/src"]

[tool.uv.sources]
shared-consumer-protocol = { workspace = true }

[dependency-groups]
dev = [
    "shared-consumer-protocol",
]
