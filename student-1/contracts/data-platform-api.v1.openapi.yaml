openapi: 3.1.0
info:
  title: PropertyScope Data Platform API
  version: 1.0.0
  description: Bounded control-plane, release evidence, and property discovery contracts.
servers:
  - url: /api/data-platform/v1
paths:
  /health/live:
    servers: [{url: /}]
    get:
      operationId: getFeatureHealthLive
      responses:
        '200':
          description: Feature process is live
          content: {application/json: {schema: {$ref: '#/components/schemas/TypedHealthProjection'}}}
  /health/ready:
    servers: [{url: /}]
    get:
      operationId: getFeatureHealthReady
      responses:
        '200':
          description: Required Feature 1 dependencies are ready
          content: {application/json: {schema: {$ref: '#/components/schemas/TypedHealthProjection'}}}
        '503':
          description: A required Feature 1 dependency is unavailable
          content: {application/json: {schema: {$ref: '#/components/schemas/TypedHealthProjection'}}}
  /overview:
    get: {operationId: getOverview, responses: {'200': {description: Platform overview}}}
  /notifications:
    get:
      operationId: listOperatorNotificationStates
      description: Latest 100 run, publication and downstream-delivery state projections ordered by activity. Contains names, identifiers, statuses and timestamps only; browser read state is local.
      responses:
        '200': {description: Bounded notification state list}
        '503': {$ref: '#/components/responses/Problem'}
  /ingestion-runs/{run_id}/activity:
    get:
      operationId: listRunActivity
      description: Recent durable task changes, newest first. Retains 1000 events per run. Poll overlapping windows and deduplicate event IDs; sequence allocation is not transaction commit order. Includes phase, counters and bounded error codes, without credentials or raw errors.
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200': {description: Paginated recent activity list}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /artifact-retention:
    get:
      operationId: getArtifactRetention
      description: Reports referenced physical size and durable retention reasons.
      responses: {'200': {description: Artifact retention inventory}}
    post:
      operationId: cleanupUnreferencedArtifacts
      description: Dry-runs by default and removes only grace-expired physical objects with no durable artifact reference.
      responses: {'200': {description: Reference-aware cleanup result}, '422': {$ref: '#/components/responses/Problem'}}
  /runtime-capabilities:
    get:
      operationId: getRuntimeCapabilities
      description: Reports connected official acquisition profiles and locally cached source partitions.
      responses: {'200': {description: Runtime acquisition capabilities}}
  /product-contracts/v1:
    get:
      operationId: discoverProductContractPackage
      description: Discovers the current immutable, versioned producer contract package without exposing arbitrary producer files.
      responses:
        '200':
          description: Content-addressed product contract package metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductContractPackage'}
        '422': {$ref: '#/components/responses/Problem'}
  /product-contracts/v1/sha256/{digest}.zip:
    get:
      operationId: downloadProductContractPackage
      description: Downloads the fixed ZIP package whose bytes match the path-bound SHA-256 digest.
      parameters:
        - name: digest
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '200':
          description: Immutable versioned product schemas and protocol contracts
          headers:
            Digest: {schema: {type: string}}
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
          content:
            application/zip:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /assistant/capabilities:
    get:
      operationId: getAssistantCapabilities
      description: Returns the bounded versioned application, feature and assistant guide.
      responses: {'200': {description: Assistant capability guide}, '422': {$ref: '#/components/responses/Problem'}}
  /assistant/turns:
    post:
      operationId: createAssistantTurn
      description: Creates one durable AI-mode AgentRun with up to four explicit completed browser-visible exchanges as untrusted convenience context.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssistantTurnRequest'}
      responses: {'202': {description: Assistant turn accepted}, '422': {$ref: '#/components/responses/Problem'}, '503': {$ref: '#/components/responses/Problem'}}
  /assistant/turns/{run_id}:
    get:
      operationId: getAssistantTurn
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses: {'200': {description: Durable assistant turn detail}, '404': {$ref: '#/components/responses/Problem'}, '503': {$ref: '#/components/responses/Problem'}}
  /assistant/turns/{run_id}/events:
    get:
      operationId: listAssistantTurnEvents
      parameters: [{$ref: '#/components/parameters/RunId'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/Page'}, '404': {$ref: '#/components/responses/Problem'}, '503': {$ref: '#/components/responses/Problem'}}
  /assistant/turns/{run_id}/cancel:
    post:
      operationId: cancelAssistantTurn
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses: {'200': {description: Cancellation requested}, '404': {$ref: '#/components/responses/Problem'}, '503': {$ref: '#/components/responses/Problem'}}
  /data-products:
    get:
      operationId: listDataProducts
      description: Lists the complete registered provider catalogue and capability state.
      responses:
        '200':
          description: Data product catalogue
          content: {application/json: {schema: {$ref: '#/components/schemas/DataProductCatalogue'}}}
  /data-products/{dataset_id}:
    get:
      operationId: getDataProduct
      parameters: [{name: dataset_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Registered data product, content: {application/json: {schema: {$ref: './data-product-catalogue-entry.v1.schema.json'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /data-products/{dataset_id}/accepted:
    get:
      operationId: getAcceptedDataProductRelease
      parameters:
        - {name: dataset_id, in: path, required: true, schema: {type: string}}
        - {name: target_feature, in: query, schema: {type: string}}
      responses:
        '200': {description: Current accepted release, content: {application/json: {schema: {$ref: '#/components/schemas/AcceptedRelease'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /data-products/{dataset_id}/source-records:
    get:
      operationId: listAcceptedSourceRecords
      description: Pages complete PSI source facts from one immutable accepted or superseded generation, partitioned by source year.
      parameters:
        - {name: dataset_id, in: path, required: true, schema: {type: string}}
        - {name: year, in: query, required: true, schema: {type: integer, minimum: 1990, maximum: 9999}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 5000, default: 1000}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
        - {name: release_id, in: query, description: Pins subsequent pages to the immutable generation returned by the first page., schema: {type: string, format: uuid}}
      responses:
        '200': {description: Complete accepted-generation source facts for one year, content: {application/json: {schema: {$ref: '#/components/schemas/SalesSourceRecordPage'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /sources:
    get:
      operationId: listSources
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {$ref: '#/components/responses/Page'}}
    post:
      operationId: createSource
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SourceDefinition'}}}}
      responses: {'201': {description: Source created}, '422': {$ref: '#/components/responses/Problem'}}
  /sources/{source_id}:
    parameters: [{$ref: '#/components/parameters/SourceId'}]
    get: {operationId: getSource, responses: {'200': {description: Source detail}, '404': {$ref: '#/components/responses/Problem'}}}
    put:
      operationId: updateSource
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SourceDefinitionUpdate'}}}}
      responses: {'200': {description: Source updated}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
    delete: {operationId: deleteSource, responses: {'204': {description: Deleted}, '409': {$ref: '#/components/responses/Problem'}}}
  /jobs:
    get: {operationId: listJobs, responses: {'200': {$ref: '#/components/responses/Page'}}}
    post: {operationId: createJob, responses: {'201': {description: Job created}, '400': {$ref: '#/components/responses/Problem'}}}
  /jobs/{job_id}:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get: {operationId: getJob, responses: {'200': {description: Job detail}, '404': {$ref: '#/components/responses/Problem'}}}
    put: {operationId: updateJob, responses: {'200': {description: Job updated}, '409': {$ref: '#/components/responses/Problem'}}}
    delete: {operationId: deleteJob, responses: {'204': {description: Deleted}, '409': {$ref: '#/components/responses/Problem'}}}
  /jobs/{job_id}/capabilities:
    get:
      operationId: getJobCapabilities
      parameters: [{$ref: '#/components/parameters/JobId'}]
      responses: {'200': {description: Registered executable capabilities}, '404': {$ref: '#/components/responses/Problem'}}
  /jobs/{job_id}/plans:
    post:
      operationId: planRun
      parameters: [{$ref: '#/components/parameters/JobId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunRequest'}}}}
      responses: {'200': {description: Deterministic plan}, '422': {$ref: '#/components/responses/Problem'}}
  /jobs/{job_id}/runs:
    post:
      operationId: createRun
      parameters: [{$ref: '#/components/parameters/JobId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunRequest'}}}}
      responses: {'201': {description: Run queued}, '200': {description: Existing idempotent run}, '409': {$ref: '#/components/responses/Problem'}}
  /ingestion-runs/{run_id}:
    get: {operationId: getRun, parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'200': {description: Run evidence}, '404': {$ref: '#/components/responses/Problem'}}}
  /ingestion-runs:
    get:
      operationId: listRuns
      description: Filters complete history before offset pagination; orders by requested_at and id descending. Status running includes planning, acquisition, staging, normalisation, validation and release building.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/SearchQuery'}
        - {name: status, in: query, schema: {type: string}}
        - {name: job_definition_id, in: query, schema: {type: string, format: uuid}}
      responses: {'200': {$ref: '#/components/responses/Page'}, '422': {$ref: '#/components/responses/Problem'}}
  /ingestion-runs/{run_id}/tasks:
    get: {operationId: listRunTasks, parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'200': {$ref: '#/components/responses/Page'}}}
  /ingestion-runs/{run_id}/artifacts:
    get: {operationId: listRunArtifacts, parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'200': {$ref: '#/components/responses/Page'}}}
  /ingestion-runs/{run_id}/quality-results:
    get: {operationId: listRunQualityResults, parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'200': {$ref: '#/components/responses/Page'}}}
  /ingestion-runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: Durable cancellation requested or reconciled}
        '409': {$ref: '#/components/responses/Problem'}
        '503':
          description: Cancellation persistence could not be confirmed; retrying is safe.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: The cancellation outcome could not be confirmed; retry this cancellation request
                code: cancellation_unconfirmed
                request_id: 70000000-0000-0000-0000-000000000001
  /ingestion-runs/{run_id}/resume:
    post: {operationId: resumeRun, parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'200': {description: Run resumed}, '409': {$ref: '#/components/responses/Problem'}}}
  /ingestion-runs/{run_id}/retry:
    post: {operationId: retryRun, parameters: [{$ref: '#/components/parameters/RunId'}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'201': {description: Retry queued}, '409': {$ref: '#/components/responses/Problem'}}}
  /ingestion-runs/{run_id}/reprocess-cached:
    post: {operationId: reprocessCachedRun, parameters: [{$ref: '#/components/parameters/RunId'}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'201': {description: Cached reprocessing queued}, '409': {$ref: '#/components/responses/Problem'}}}
  /agent-runs:
    get:
      operationId: listFeatureAgentRuns
      description: Proxies only durable AI-mode runs scoped to the PropertyScope feature key.
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: model_profile, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses: {'200': {$ref: '#/components/responses/Page'}, '503': {$ref: '#/components/responses/Problem'}}
  /agent-runs/{run_id}:
    get:
      operationId: getFeatureAgentRun
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses: {'200': {description: Durable AI-mode run detail}, '404': {$ref: '#/components/responses/Problem'}, '503': {$ref: '#/components/responses/Problem'}}
  /agent-runs/{run_id}/events:
    get:
      operationId: listFeatureAgentRunEvents
      parameters: [{$ref: '#/components/parameters/RunId'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/Page'}, '404': {$ref: '#/components/responses/Problem'}, '503': {$ref: '#/components/responses/Problem'}}
  /dataset-releases:
    get:
      operationId: listDatasetReleases
      description: Filters complete catalogue before offset pagination; orders by created_at and id descending. Lifecycle and status filters intersect.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/SearchQuery'}
        - {name: status, in: query, schema: {type: string}}
        - {name: lifecycle, in: query, schema: {type: string, enum: [all, review, published, rejected]}}
        - {name: dataset_id, in: query, schema: {type: string}}
        - {name: target_feature, in: query, schema: {type: string}}
        - {name: schema_version, in: query, schema: {type: string}}
        - {name: ingestion_run_id, in: query, schema: {type: string, format: uuid}}
      responses: {'200': {$ref: '#/components/responses/Page'}, '422': {$ref: '#/components/responses/Problem'}}
    post: {operationId: createDatasetRelease, responses: {'201': {description: Draft release created}, '409': {$ref: '#/components/responses/Problem'}}}
  /dataset-releases/{release_id}:
    parameters: [{$ref: '#/components/parameters/ReleaseId'}]
    get:
      operationId: getDatasetRelease
      responses:
        '200': {description: Release inspection evidence, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseInspection'}}}}
        '404': {$ref: '#/components/responses/Problem'}
    put: {operationId: updateDatasetRelease, responses: {'200': {description: Release updated}, '409': {$ref: '#/components/responses/Problem'}}}
    delete: {operationId: deleteDatasetRelease, responses: {'204': {description: Deleted}, '409': {$ref: '#/components/responses/Problem'}}}
  /dataset-releases/{release_id}/manifest:
    get:
      operationId: getReleaseManifest
      parameters: [{$ref: '#/components/parameters/ReleaseId'}]
      responses:
        '200':
          description: Immutable release manifest; current releases use v2 and retained releases may use v1
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: './release-manifest.v2.schema.json'}
                  - {$ref: './release-manifest.v1.schema.json'}
        '404': {$ref: '#/components/responses/Problem'}
  /dataset-releases/{release_id}/artifact:
    get:
      operationId: downloadReleaseArtifact
      parameters: [{$ref: '#/components/parameters/ReleaseId'}]
      description: Streams a checksum-verified bounded release export only when its source redistribution policy permits it.
      responses:
        '200': {description: Verified bounded artifact}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
  /dataset-releases/{release_id}/records:
    get:
      operationId: previewDatasetReleaseRecords
      description: Returns a bounded allowlisted warehouse projection from exactly one release generation.
      parameters:
        - {$ref: '#/components/parameters/ReleaseId'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
      responses:
        '200':
          description: Release-scoped preview page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseRecordPreview'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /dataset-releases/{release_id}/submit-review:
    post:
      operationId: submitDatasetReleaseForReview
      parameters: [{$ref: '#/components/parameters/ReleaseId'}]
      responses: {'200': {description: Release awaiting review}, '409': {$ref: '#/components/responses/Problem'}}
  /dataset-releases/{release_id}/publish:
    post:
      operationId: publishRelease
      parameters:
        - {$ref: '#/components/parameters/ReleaseId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      description: Calls the fixed consumer import contract, persists its immutable receipt, and durably queues accepted-pointer activation.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OperatorPublishRequest'}}}
      responses:
        '200': {description: Previously completed publication replayed from matching immutable evidence, content: {application/json: {schema: {$ref: '#/components/schemas/PublicationResult'}}}}
        '202': {description: Durable consumer import or accepted-version activation queued, content: {application/json: {schema: {$ref: '#/components/schemas/PublicationResult'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '424':
          description: Producer verification or local activation failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationResult'}
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /dataset-releases/{release_id}/consumer-imports/{operation_id}:
    get:
      operationId: getReleaseConsumerImport
      description: Returns durable consumer delivery and accepted-version activation progress without holding the publication request open.
      parameters:
        - {$ref: '#/components/parameters/ReleaseId'}
        - {name: operation_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Consumer import and activation status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsumerImportStatus'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /dataset-releases/{release_id}/retry-delivery:
    post:
      operationId: retryPublishedReleaseDelivery
      description: Retries downstream import independently of the already published producer generation.
      parameters:
        - {$ref: '#/components/parameters/ReleaseId'}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version: {type: integer, minimum: 1}
      responses:
        '202': {description: Durable downstream delivery queued or replayed}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /dataset-releases/{release_id}/reject:
    post:
      operationId: rejectDatasetRelease
      parameters: [{$ref: '#/components/parameters/ReleaseId'}]
      responses: {'200': {description: Release rejected}, '409': {$ref: '#/components/responses/Problem'}}
  /dataset-releases/{release_id}/agent-runs:
    post:
      operationId: createReleaseAgentRun
      parameters: [{$ref: '#/components/parameters/ReleaseId'}]
      responses: {'201': {description: AI-mode run created}, '503': {$ref: '#/components/responses/Problem'}}
  /properties/search:
    get:
      operationId: searchProperties
      parameters:
        - {name: q, in: query, required: true, description: Must include a street number, postcode, locality, or distinctive address term rather than only common address vocabulary., schema: {type: string, minLength: 2, maxLength: 200}}
        - {name: state, in: query, schema: {const: NSW, default: NSW}}
        - {$ref: '#/components/parameters/Limit'}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
      responses:
        '200': {description: Ranked current property matches, content: {application/json: {schema: {$ref: '#/components/schemas/PropertySearchPage'}}}}
        '422': {$ref: '#/components/responses/Problem'}
  /properties/locality-summary:
    get:
      operationId: getPropertyLocalitySummary
      description: Aggregates one compatible accepted NSW address generation without fuzzy-search sampling.
      parameters:
        - {name: locality, in: query, schema: {type: string, minLength: 1, maxLength: 100}}
        - {name: postcode, in: query, schema: {type: string, pattern: '^[0-9]{4}$'}}
        - {name: include_streets, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Accepted address summary}
        '422': {$ref: '#/components/responses/Problem'}
  /properties/{property_ref}:
    get: {operationId: getProperty, parameters: [{$ref: '#/components/parameters/PropertyRef'}], responses: {'200': {description: Property evidence}, '404': {$ref: '#/components/responses/Problem'}}}
  /properties/{property_ref}/map-context:
    get: {operationId: getPropertyMapContext, parameters: [{$ref: '#/components/parameters/PropertyRef'}], responses: {'200': {description: Property map context}, '404': {$ref: '#/components/responses/Problem'}}}
  /properties/{property_ref}/coverage:
    get: {operationId: getPropertyCoverage, parameters: [{$ref: '#/components/parameters/PropertyRef'}], responses: {'200': {description: Accepted product coverage}, '404': {$ref: '#/components/responses/Problem'}}}
  /properties/{property_ref}/sale-history:
    get:
      operationId: getPropertySaleHistory
      description: Returns a bounded latest-revision sale timeline from the immutable accepted PSI generation when supported rows resolve to this property.
      parameters:
        - {$ref: '#/components/parameters/PropertyRef'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Accepted sale history, content: {application/json: {schema: {$ref: '#/components/schemas/PropertySaleHistory'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /properties/{property_ref}/seifa:
    get:
      operationId: getPropertySeifa
      description: Returns accepted ABS SEIFA 2021 locality-area evidence matched by exact normalised NSW locality name. Candidate and superseded generations are never exposed.
      parameters: [{$ref: '#/components/parameters/PropertyRef'}]
      responses:
        '200': {description: Accepted SEIFA area evidence or typed availability, content: {application/json: {schema: {$ref: '#/components/schemas/PropertySeifa'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /properties/{property_ref}/report-section:
    get:
      operationId: getPropertyReportSection
      parameters: [{$ref: '#/components/parameters/PropertyRef'}]
      responses:
        '200':
          description: Bounded canonical identity and accepted-release evidence for Feature 5
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportSection'}
        '404': {$ref: '#/components/responses/Problem'}
  /tools/sources.list.v1:
    post: {operationId: toolSourcesList, responses: {'200': {description: Tool result}}}
  /tools/releases.list.v1:
    post: {operationId: toolReleasesList, responses: {'200': {description: Bounded release summaries}}}
  /tools/platform.capabilities.v1:
    post: {operationId: toolPlatformCapabilities, responses: {'200': {description: Bounded capability guide}}}
  /tools/runs.list.v1:
    post: {operationId: toolRunsList, responses: {'200': {description: Tool result}}}
  /tools/runs.inspect.v1:
    post: {operationId: toolRunsInspect, responses: {'200': {description: Tool result}}}
  /tools/runs.explain.v1:
    post: {operationId: toolRunsExplain, responses: {'200': {description: Bounded current run explanation evidence}}}
  /tools/releases.inspect.v1:
    post: {operationId: toolReleasesInspect, responses: {'200': {description: Tool result}}}
  /tools/releases.compare.v1:
    post: {operationId: toolReleasesCompare, responses: {'200': {description: Tool result}}}
  /tools/coverage.inspect.v1:
    post: {operationId: toolCoverageInspect, responses: {'200': {description: Tool result}}}
  /tools/properties.search.v1:
    post: {operationId: toolPropertiesSearch, responses: {'200': {description: Tool result}}}
  /tools/properties.inspect.v1:
    post: {operationId: toolPropertiesInspect, responses: {'200': {description: Tool result}}}
  /tools/properties.locality-summary.v1:
    post: {operationId: toolPropertiesLocalitySummary, responses: {'200': {description: Accepted address aggregate}}}
  /tools/runs.retry.v1:
    post: {operationId: toolRunsRetry, responses: {'200': {description: Tool result}}}
  /tools/releases.publish.v1:
    post: {operationId: toolReleasesPublish, responses: {'202': {description: Protected publication queued}}}
components:
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
    SearchQuery: {name: q, in: query, schema: {type: string, maxLength: 200}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 500}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
    SourceId: {name: source_id, in: path, required: true, schema: {type: string, format: uuid}}
    JobId: {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    RunId: {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
    ReleaseId: {name: release_id, in: path, required: true, schema: {type: string, maxLength: 150}}
    AgentRunId: {name: agent_run_id, in: path, required: true, schema: {type: string, format: uuid}}
    PropertyRef: {name: property_ref, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    ReadinessCheckProjection:
      type: object
      additionalProperties: false
      required: [required, status]
      properties:
        required: {type: boolean}
        status: {enum: [healthy, degraded, unhealthy]}
        detail: {type: [string, 'null'], maxLength: 500}
    TypedHealthProjection:
      type: object
      additionalProperties: false
      required: [schema_version, service, version, status, http_status, media_type, checks]
      properties:
        schema_version: {const: 1}
        service: {type: string, minLength: 1, maxLength: 100}
        version: {type: string, minLength: 1, maxLength: 50}
        status: {enum: [healthy, degraded, unhealthy]}
        http_status: {enum: [200, 503]}
        media_type: {const: application/json}
        checks:
          type: object
          additionalProperties: {$ref: '#/components/schemas/ReadinessCheckProjection'}
    AssistantHistoryMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: {enum: [user, assistant]}
        content: {type: string, minLength: 1, maxLength: 2000}
    AssistantContext:
      description: Canonical route paired with exactly its one typed entity identifier, or an empty general context.
      oneOf:
        - {type: object, additionalProperties: false, maxProperties: 0}
        - type: object
          additionalProperties: false
          required: [route, release_id]
          properties:
            route: {const: releases/detail}
            release_id: {type: string, format: uuid}
        - type: object
          additionalProperties: false
          required: [route, ingestion_run_id]
          properties:
            route: {const: runs/detail}
            ingestion_run_id: {type: string, format: uuid}
        - type: object
          additionalProperties: false
          required: [route, property_ref]
          properties:
            route: {const: properties/detail}
            property_ref: {type: string, format: uuid}
    AssistantTurnRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: {type: string, minLength: 2, maxLength: 2000}
        scope: {enum: [application, feature], default: feature}
        context: {$ref: '#/components/schemas/AssistantContext'}
        history:
          type: array
          maxItems: 8
          description: Zero to four complete user/assistant pairs, alternating user then assistant, with at most 8000 aggregate content characters.
          items: {$ref: '#/components/schemas/AssistantHistoryMessage'}
    PropertySearchPage:
      type: object
      additionalProperties: false
      required: [items, count, total, total_is_lower_bound, limit, offset, next_offset, query, supported]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [property_ref, address_display, locality, postcode, state, resolution_status, longitude, latitude, score, matched_address, match_kind, match_method]
            properties:
              property_ref: {type: string, format: uuid}
              address_display: {type: string, minLength: 1, maxLength: 500}
              locality: {type: string, minLength: 1, maxLength: 200}
              postcode: {type: string, pattern: '^[0-9]{4}$'}
              state: {const: NSW}
              resolution_status: {enum: [verified, provisional, unresolved, retired]}
              longitude: {type: number, minimum: 140, maximum: 160}
              latitude: {type: number, minimum: -38, maximum: -27}
              score: {type: number, minimum: 0, maximum: 1}
              matched_address: {type: string, minLength: 1, maxLength: 500}
              match_kind: {enum: [canonical, alias]}
              match_method: {enum: [exact, prefix, contains, all_terms, fuzzy]}
        count: {type: integer, minimum: 0, maximum: 100}
        total: {type: integer, minimum: 0}
        total_is_lower_bound: {type: boolean, description: True when the bounded search candidate window was filled and additional accepted matches may exist.}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 1000000}
        next_offset: {type: [integer, 'null'], minimum: 0, maximum: 1000000}
        query: {type: string, minLength: 2, maxLength: 200}
        supported: {type: boolean}
        reason: {type: string, minLength: 1, maxLength: 200}
    PropertySaleHistory:
      type: object
      additionalProperties: false
      required: [items, count, limit, has_more, supported, availability, release]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [source_business_key, source_revision, contract_date, settlement_date, price_aud, area_original, area_unit, area_square_metres, property_id, dealing_id, match_tier, match_confidence, geographic_precision, nature_code, primary_purpose, sale_code, dataset_release_id, release_version, schema_version, accepted_at]
            properties:
              source_business_key: {type: string, minLength: 1}
              source_revision: {type: integer, minimum: 1}
              contract_date: {type: [string, 'null'], format: date}
              settlement_date: {type: [string, 'null'], format: date}
              price_aud: {type: [integer, 'null'], minimum: 0}
              area_original: {type: [number, string, 'null']}
              area_unit: {type: [string, 'null']}
              area_square_metres: {type: [number, string, 'null'], minimum: 0}
              property_id: {type: [string, 'null']}
              dealing_id: {type: [string, 'null']}
              match_tier: {enum: [A, B, C, D, MISS]}
              match_confidence: {type: [number, string], minimum: 0, maximum: 1}
              geographic_precision: {type: string, minLength: 1}
              nature_code: {type: [string, 'null']}
              primary_purpose: {type: [string, 'null']}
              sale_code: {type: [string, 'null']}
              dataset_release_id: {type: string, format: uuid}
              release_version: {type: string, minLength: 1}
              schema_version: {type: string, minLength: 1}
              accepted_at: {type: string, format: date-time}
    PropertySeifa:
      type: object
      required: [supported, availability, property_ref, locality]
      properties:
        supported: {type: boolean}
        availability: {enum: [available, no_accepted_release, locality_not_matched, ambiguous_locality_match]}
        property_ref: {type: string, format: uuid}
        locality: {type: string}
        message: {type: string}
        match_method: {const: exact-normalised-locality-and-state}
        attribution: {const: Based on Australian Bureau of Statistics data}
        limitations: {type: array, items: {type: string}}
        area:
          type: object
          properties:
            sal_code: {type: string, pattern: '^1[0-9]{4}$'}
            sal_name: {type: string}
            locality_name: {type: string}
            state: {const: NSW}
            reference_year: {const: 2021}
            irsd_score: {type: [string, 'null']}
            irsd_australia_decile: {type: [integer, 'null'], minimum: 1, maximum: 10}
            irsad_score: {type: [string, 'null']}
            irsad_australia_decile: {type: [integer, 'null'], minimum: 1, maximum: 10}
            ier_score: {type: [string, 'null']}
            ier_australia_decile: {type: [integer, 'null'], minimum: 1, maximum: 10}
            ieo_score: {type: [string, 'null']}
            ieo_australia_decile: {type: [integer, 'null'], minimum: 1, maximum: 10}
            usual_resident_population: {type: integer, minimum: 0}
        release: {type: object}
        count: {type: integer, minimum: 0, maximum: 100}
        limit: {type: integer, minimum: 1, maximum: 100}
        has_more: {type: boolean}
        supported: {type: boolean}
        availability:
          type: object
          additionalProperties: false
          required: [status, reason, accepted_release_id]
          properties:
            status: {enum: [available, dataset_unavailable, unsupported_contract]}
            reason: {type: string, minLength: 1, maxLength: 300}
            accepted_release_id: {type: [string, 'null'], format: uuid}
        release:
          type: [object, 'null']
          additionalProperties: false
          required: [dataset_release_id, release_version, schema_version, accepted_at]
          properties:
            dataset_release_id: {type: string, format: uuid}
            release_version: {type: string, minLength: 1}
            schema_version: {type: string, minLength: 1}
            accepted_at: {type: string, format: date-time}
    DataProductCatalogue:
      type: object
      additionalProperties: false
      required: [items, count, next_cursor]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: './data-product-catalogue-entry.v1.schema.json'}}
        count: {type: integer, minimum: 0, maximum: 100}
        next_cursor: {type: 'null'}
    AcceptedRelease:
      type: object
      additionalProperties: false
      required: [release]
      properties:
        release: {$ref: './release-detail.v1.schema.json'}
    SalesSourceRecordPage:
      type: object
      additionalProperties: false
      required: [schema_version, release, source_partition_year, items, count, total, limit, offset, next_offset]
      properties:
        schema_version: {const: propertyscope.psi-source-records.v1}
        release:
          type: object
          additionalProperties: false
          required: [id, dataset_id, release_version, status, schema_version]
          properties:
            id: {type: string, format: uuid}
            dataset_id: {const: nsw-psi-sales}
            release_version: {type: string, minLength: 1}
            status: {enum: [accepted, superseded]}
            schema_version: {const: propertyscope.property-sales.v3}
        source_partition_year: {type: integer, minimum: 1990, maximum: 9999}
        items: {type: array, maxItems: 5000, items: {type: object}}
        count: {type: integer, minimum: 0, maximum: 5000}
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 5000}
        offset: {type: integer, minimum: 0, maximum: 1000000}
        next_offset: {type: [integer, 'null'], minimum: 0, maximum: 1000000}
    ReleaseInspection:
      type: object
      required: [release, quality_results, quality_summary, receipts, activations, consumer_imports, accepted_predecessor, release_contract]
      properties:
        release: {type: object}
        release_contract:
          anyOf:
            - {$ref: './release-detail.v1.schema.json'}
            - {type: 'null'}
        quality_results: {type: array, maxItems: 100, items: {type: object}}
        quality_summary: {type: object}
        receipts: {type: array, maxItems: 100, items: {$ref: './consumer-publication-receipt.v1.schema.json'}}
        activations: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ReleaseActivation'}}
        consumer_imports: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ConsumerImportOperation'}}
        publication_policy: {const: producer-owned}
        accepted_predecessor: {type: [object, 'null']}
    OperatorPublishRequest:
      type: object
      additionalProperties: false
      required: [version, comment, approved]
      properties:
        version: {type: integer, minimum: 1}
        comment: {type: string, minLength: 1, maxLength: 2000}
        approved: {const: true}
    ProductContractPackage:
      type: object
      additionalProperties: false
      required: [contract_set_version, media_type, content_sha256, byte_count, artifact_path]
      properties:
        contract_set_version: {const: propertyscope.product-contract-set.v1}
        media_type: {const: application/zip}
        content_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        byte_count: {type: integer, minimum: 1}
        artifact_path: {type: string, pattern: '^/api/data-platform/v1/product-contracts/v1/sha256/[0-9a-f]{64}\.zip$'}
    PublicationResult:
      type: object
      additionalProperties: false
      required: [release, publication_status, replayed]
      anyOf:
        - required: [receipt]
        - required: [consumer_import, status_path]
      properties:
        release: {type: object}
        receipt: {$ref: './consumer-publication-receipt.v1.schema.json'}
        activation: {$ref: '#/components/schemas/ReleaseActivation'}
        consumer_import: {$ref: '#/components/schemas/ConsumerImportOperation'}
        status_path: {type: string, pattern: '^/api/data-platform/v1/dataset-releases/[0-9a-f-]+/consumer-imports/[0-9a-f-]+$'}
        publication_status: {enum: [pending, completed, failed]}
        replayed: {type: boolean}
    ReleaseActivation:
      type: object
      additionalProperties: false
      required: [id, status, attempt_number, requested_at, version]
      properties:
        id: {type: string, format: uuid}
        status: {enum: [queued, claimed, running, succeeded, failed, interrupted]}
        attempt_number: {type: integer, minimum: 1, maximum: 3}
        requested_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        materialized_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        error_json: {type: [object, 'null']}
        version: {type: integer, minimum: 1}
    ConsumerImportOperation:
      type: object
      additionalProperties: false
      required: [id, dataset_release_id, dataset_id, target_feature, schema_version, content_sha256, record_count, status, phase_key, remote_status, consumer_operation_id, publication_receipt_id, release_activation_id, attempt_number, requested_at, started_at, finished_at, error_json, version, budgets]
      properties:
        id: {type: string, format: uuid}
        dataset_release_id: {type: string, format: uuid}
        dataset_id: {type: string, minLength: 1, maxLength: 150}
        target_feature: {type: string, minLength: 1, maxLength: 100}
        schema_version: {type: string, minLength: 1, maxLength: 200}
        content_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        record_count: {type: integer, minimum: 0}
        status: {enum: [queued, claimed, polling, receipt_pending, activation_pending, activation_queued, published, delivered, rejected, failed, interrupted]}
        phase_key: {enum: [connect, poll, record_receipt, queue_activation, wait_activation, complete]}
        delivery_only: {type: [boolean, 'null']}
        remote_status: {type: [string, 'null']}
        consumer_operation_id: {type: [string, 'null']}
        publication_receipt_id: {type: [string, 'null'], format: uuid}
        release_activation_id: {type: [string, 'null'], format: uuid}
        attempt_number: {type: integer, minimum: 1, maximum: 5}
        requested_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        error_json: {type: [object, 'null']}
        version: {type: integer, minimum: 1}
        budgets:
          type: object
          additionalProperties: false
          required: [connect_timeout_seconds, status_timeout_seconds, maximum_response_bytes]
          properties:
            connect_timeout_seconds: {type: number, exclusiveMinimum: 0}
            status_timeout_seconds: {type: number, exclusiveMinimum: 0}
            maximum_response_bytes: {type: integer, minimum: 1}
    ConsumerImportStatus:
      type: object
      additionalProperties: false
      required: [consumer_import, activation, publication_status]
      properties:
        consumer_import: {$ref: '#/components/schemas/ConsumerImportOperation'}
        activation:
          anyOf:
            - {$ref: '#/components/schemas/ReleaseActivation'}
            - {type: 'null'}
        publication_status: {enum: [pending, completed, failed, null]}
        delivery_status: {type: string}
    SourceDefinitionFields:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 500}
        publisher: {type: string, minLength: 1, maxLength: 500}
        source_url: {type: string, format: uri}
        adapter_key: {type: string, pattern: '^[a-z0-9][a-z0-9._-]*$'}
        cadence: {type: string}
        licence_id: {type: string}
        licence_url: {type: string, format: uri}
        redistribution_policy: {type: string}
        target_features: {type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: {type: string}}
        status: {enum: [draft, active, disabled, retired], default: draft}
        notes: {type: string, maxLength: 2000}
    SourceDefinition:
      allOf:
        - {$ref: '#/components/schemas/SourceDefinitionFields'}
        - {type: object, required: [name, publisher, source_url, adapter_key, cadence, licence_id, licence_url, redistribution_policy, target_features]}
      unevaluatedProperties: false
    SourceDefinitionUpdate:
      allOf:
        - {$ref: '#/components/schemas/SourceDefinitionFields'}
        - type: object
          required: [name, publisher, source_url, adapter_key, cadence, licence_id, licence_url, redistribution_policy, target_features, version]
          properties:
            version: {type: integer, minimum: 1}
      unevaluatedProperties: false
    RunRequest:
      type: object
      additionalProperties: false
      required: [run_mode, scope]
      properties:
        run_mode: {enum: [full_refresh, reprocess_cached]}
        scope: {type: object, maxProperties: 20}
    Problem:
      type: object
      required: [type, title, status, detail, request_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        request_id: {type: string}
    ReportSection:
      type: object
      additionalProperties: false
      required: [schema_version, property_ref, address_display, identity, release_evidence, evidence_count]
      properties:
        schema_version: {const: propertyscope.report-section.v1}
        property_ref: {type: string, format: uuid}
        address_display: {type: string}
        identity: {type: object}
        release_evidence: {type: array, maxItems: 25, items: {type: object}}
        evidence_count: {type: integer, minimum: 0, maximum: 25}
    ReleaseRecordPreview:
      type: object
      additionalProperties: false
      required: [release, profile, columns, items, count, total, limit, offset, next_offset]
      properties:
        release: {type: object}
        profile: {enum: [property-fixture, gnaf-nsw, psi-sales, bocsar-sparse, schools-master]}
        columns: {type: array, minItems: 1, maxItems: 20, items: {type: string}}
        items: {type: array, maxItems: 100, items: {type: object}}
        count: {type: integer, minimum: 0, maximum: 100}
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 1000000}
        next_offset: {type: [integer, 'null'], minimum: 0, maximum: 1000000}
  responses:
    Page: {description: Bounded page, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, maxItems: 100}, next_cursor: {type: [string, 'null']}}}}}}
    Problem: {description: RFC 9457 Problem Details, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
