openapi: 3.1.0
info:
  title: PropertyScope Data Platform API
  version: 1.0.0
  description: Bounded control-plane, release evidence, and property discovery contracts.
servers:
  - url: /api/data-platform/v1
paths:
  /overview:
    get: {operationId: getOverview, responses: {'200': {description: Platform overview}}}
  /runtime-capabilities:
    get:
      operationId: getRuntimeCapabilities
      description: Reports whether this stack can execute registered live acquisition profiles.
      responses: {'200': {description: Runtime acquisition capabilities}}
  /data-products:
    get:
      operationId: listDataProducts
      description: Lists the complete registered provider catalogue and capability state.
      responses: {'200': {description: Data product catalogue}}
  /data-products/{dataset_id}:
    get:
      operationId: getDataProduct
      parameters: [{name: dataset_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Registered data product}, '404': {$ref: '#/components/responses/Problem'}}
  /data-products/{dataset_id}/accepted:
    get:
      operationId: getAcceptedDataProductRelease
      parameters:
        - {name: dataset_id, in: path, required: true, schema: {type: string}}
        - {name: target_feature, in: query, schema: {type: string}}
      responses: {'200': {description: Current accepted release}, '404': {$ref: '#/components/responses/Problem'}}
  /sources:
    get:
      operationId: listSources
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {$ref: '#/components/responses/Page'}}
    post:
      operationId: createSource
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SourceDefinition'}}}}
      responses: {'201': {description: Source created}, '400': {$ref: '#/components/responses/Problem'}}
  /sources/{source_id}:
    parameters: [{$ref: '#/components/parameters/SourceId'}]
    get: {operationId: getSource, responses: {'200': {description: Source detail}, '404': {$ref: '#/components/responses/Problem'}}}
    put: {operationId: updateSource, responses: {'200': {description: Source updated}, '409': {$ref: '#/components/responses/Problem'}}}
    delete: {operationId: deleteSource, responses: {'204': {description: Deleted}, '409': {$ref: '#/components/responses/Problem'}}}
  /jobs:
    get: {operationId: listJobs, responses: {'200': {$ref: '#/components/responses/Page'}}}
    post: {operationId: createJob, responses: {'201': {description: Job created}, '400': {$ref: '#/components/responses/Problem'}}}
  /jobs/{job_id}:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get: {operationId: getJob, responses: {'200': {description: Job detail}, '404': {$ref: '#/components/responses/Problem'}}}
    put: {operationId: updateJob, responses: {'200': {description: Job updated}, '409': {$ref: '#/components/responses/Problem'}}}
    delete: {operationId: deleteJob, responses: {'204': {description: Deleted}, '409': {$ref: '#/components/responses/Problem'}}}
  /jobs/{job_id}/capabilities:
    get:
      operationId: getJobCapabilities
      parameters: [{$ref: '#/components/parameters/JobId'}]
      responses: {'200': {description: Registered executable capabilities}, '404': {$ref: '#/components/responses/Problem'}}
  /jobs/{job_id}/plans:
    post:
      operationId: planRun
      parameters: [{$ref: '#/components/parameters/JobId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunRequest'}}}}
      responses: {'200': {description: Deterministic plan}, '422': {$ref: '#/components/responses/Problem'}}
  /jobs/{job_id}/runs:
    post:
      operationId: createRun
      parameters: [{$ref: '#/components/parameters/JobId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunRequest'}}}}
      responses: {'201': {description: Run queued}, '200': {description: Existing idempotent run}, '409': {$ref: '#/components/responses/Problem'}}
  /ingestion-runs/{run_id}:
    get: {operationId: getRun, parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'200': {description: Run evidence}, '404': {$ref: '#/components/responses/Problem'}}}
  /ingestion-runs:
    get: {operationId: listRuns, responses: {'200': {$ref: '#/components/responses/Page'}}}
  /ingestion-runs/{run_id}/tasks:
    get: {operationId: listRunTasks, parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'200': {$ref: '#/components/responses/Page'}}}
  /ingestion-runs/{run_id}/artifacts:
    get: {operationId: listRunArtifacts, parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'200': {$ref: '#/components/responses/Page'}}}
  /ingestion-runs/{run_id}/quality-results:
    get: {operationId: listRunQualityResults, parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'200': {$ref: '#/components/responses/Page'}}}
  /ingestion-runs/{run_id}/cancel:
    post: {operationId: cancelRun, parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'200': {description: Run cancelled}, '409': {$ref: '#/components/responses/Problem'}}}
  /ingestion-runs/{run_id}/resume:
    post: {operationId: resumeRun, parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'200': {description: Run resumed}, '409': {$ref: '#/components/responses/Problem'}}}
  /ingestion-runs/{run_id}/retry:
    post: {operationId: retryRun, parameters: [{$ref: '#/components/parameters/RunId'}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'201': {description: Retry queued}, '409': {$ref: '#/components/responses/Problem'}}}
  /ingestion-runs/{run_id}/reprocess-cached:
    post: {operationId: reprocessCachedRun, parameters: [{$ref: '#/components/parameters/RunId'}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'201': {description: Cached reprocessing queued}, '409': {$ref: '#/components/responses/Problem'}}}
  /agent-runs:
    get:
      operationId: listFeatureAgentRuns
      description: Proxies only durable AI-mode runs scoped to the PropertyScope feature key.
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: model_profile, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses: {'200': {$ref: '#/components/responses/Page'}, '503': {$ref: '#/components/responses/Problem'}}
  /agent-runs/{run_id}:
    get:
      operationId: getFeatureAgentRun
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses: {'200': {description: Durable AI-mode run detail}, '404': {$ref: '#/components/responses/Problem'}, '503': {$ref: '#/components/responses/Problem'}}
  /agent-runs/{run_id}/events:
    get:
      operationId: listFeatureAgentRunEvents
      parameters: [{$ref: '#/components/parameters/RunId'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/Page'}, '404': {$ref: '#/components/responses/Problem'}, '503': {$ref: '#/components/responses/Problem'}}
  /dataset-releases:
    get: {operationId: listDatasetReleases, responses: {'200': {$ref: '#/components/responses/Page'}}}
    post: {operationId: createDatasetRelease, responses: {'201': {description: Draft release created}, '409': {$ref: '#/components/responses/Problem'}}}
  /dataset-releases/{release_id}:
    parameters: [{$ref: '#/components/parameters/ReleaseId'}]
    get: {operationId: getDatasetRelease, responses: {'200': {description: Release detail}, '404': {$ref: '#/components/responses/Problem'}}}
    put: {operationId: updateDatasetRelease, responses: {'200': {description: Release updated}, '409': {$ref: '#/components/responses/Problem'}}}
    delete: {operationId: deleteDatasetRelease, responses: {'204': {description: Deleted}, '409': {$ref: '#/components/responses/Problem'}}}
  /dataset-releases/{release_id}/manifest:
    get: {operationId: getReleaseManifest, parameters: [{$ref: '#/components/parameters/ReleaseId'}], responses: {'200': {description: Release manifest, content: {application/json: {schema: {$ref: './release-manifest.v1.schema.json'}}}}, '404': {$ref: '#/components/responses/Problem'}}}
  /dataset-releases/{release_id}/artifact:
    get:
      operationId: downloadReleaseArtifact
      parameters: [{$ref: '#/components/parameters/ReleaseId'}]
      description: Streams a checksum-verified bounded release export only when its source redistribution policy permits it.
      responses:
        '200': {description: Verified bounded artifact}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
  /dataset-releases/{release_id}/records:
    get:
      operationId: previewDatasetReleaseRecords
      description: Returns a bounded allowlisted warehouse projection from exactly one release generation.
      parameters:
        - {$ref: '#/components/parameters/ReleaseId'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
      responses:
        '200':
          description: Release-scoped preview page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseRecordPreview'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /dataset-releases/{release_id}/submit-review:
    post:
      operationId: submitDatasetReleaseForReview
      parameters: [{$ref: '#/components/parameters/ReleaseId'}]
      responses: {'200': {description: Release awaiting review}, '409': {$ref: '#/components/responses/Problem'}}
  /dataset-releases/{release_id}/publish:
    post:
      operationId: publishRelease
      parameters:
        - {$ref: '#/components/parameters/ReleaseId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      description: Calls the fixed consumer import contract, persists its immutable receipt, and advances the accepted pointer only after acceptance.
      responses:
        '200': {description: Consumer accepted and release activated}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '424': {$ref: '#/components/responses/Problem'}
  /dataset-releases/{release_id}/reject:
    post:
      operationId: rejectDatasetRelease
      parameters: [{$ref: '#/components/parameters/ReleaseId'}]
      responses: {'200': {description: Release rejected}, '409': {$ref: '#/components/responses/Problem'}}
  /dataset-releases/{release_id}/agent-runs:
    post:
      operationId: createReleaseAgentRun
      parameters: [{$ref: '#/components/parameters/ReleaseId'}]
      responses: {'201': {description: AI-mode run created}, '503': {$ref: '#/components/responses/Problem'}}
  /properties/search:
    get:
      operationId: searchProperties
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 200}}
        - {name: state, in: query, schema: {const: NSW, default: NSW}}
        - {$ref: '#/components/parameters/Limit'}
      responses: {'200': {$ref: '#/components/responses/Page'}, '400': {$ref: '#/components/responses/Problem'}}
  /properties/{property_ref}:
    get: {operationId: getProperty, parameters: [{$ref: '#/components/parameters/PropertyRef'}], responses: {'200': {description: Property evidence}, '404': {$ref: '#/components/responses/Problem'}}}
  /properties/{property_ref}/map-context:
    get: {operationId: getPropertyMapContext, parameters: [{$ref: '#/components/parameters/PropertyRef'}], responses: {'200': {description: Property map context}, '404': {$ref: '#/components/responses/Problem'}}}
  /properties/{property_ref}/coverage:
    get: {operationId: getPropertyCoverage, parameters: [{$ref: '#/components/parameters/PropertyRef'}], responses: {'200': {description: Accepted product coverage}, '404': {$ref: '#/components/responses/Problem'}}}
  /properties/{property_ref}/report-section:
    get:
      operationId: getPropertyReportSection
      parameters: [{$ref: '#/components/parameters/PropertyRef'}]
      responses:
        '200':
          description: Bounded canonical identity and accepted-release evidence for Feature 5
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportSection'}
        '404': {$ref: '#/components/responses/Problem'}
  /tools/sources.list.v1:
    post: {operationId: toolSourcesList, responses: {'200': {description: Tool result}}}
  /tools/runs.list.v1:
    post: {operationId: toolRunsList, responses: {'200': {description: Tool result}}}
  /tools/runs.inspect.v1:
    post: {operationId: toolRunsInspect, responses: {'200': {description: Tool result}}}
  /tools/releases.inspect.v1:
    post: {operationId: toolReleasesInspect, responses: {'200': {description: Tool result}}}
  /tools/releases.compare.v1:
    post: {operationId: toolReleasesCompare, responses: {'200': {description: Tool result}}}
  /tools/coverage.inspect.v1:
    post: {operationId: toolCoverageInspect, responses: {'200': {description: Tool result}}}
  /tools/properties.search.v1:
    post: {operationId: toolPropertiesSearch, responses: {'200': {description: Tool result}}}
  /tools/properties.inspect.v1:
    post: {operationId: toolPropertiesInspect, responses: {'200': {description: Tool result}}}
  /tools/runs.retry.v1:
    post: {operationId: toolRunsRetry, responses: {'200': {description: Tool result}}}
  /tools/releases.publish.v1:
    post: {operationId: toolReleasesPublish, responses: {'200': {description: Tool result}}}
components:
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 500}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
    SourceId: {name: source_id, in: path, required: true, schema: {type: string, format: uuid}}
    JobId: {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    RunId: {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
    ReleaseId: {name: release_id, in: path, required: true, schema: {type: string, maxLength: 150}}
    AgentRunId: {name: agent_run_id, in: path, required: true, schema: {type: string, format: uuid}}
    PropertyRef: {name: property_ref, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    SourceDefinition:
      type: object
      additionalProperties: false
      required: [name, publisher, source_url, adapter_key, cadence, licence_id, licence_url, redistribution_policy, target_features]
      properties:
        name: {type: string, minLength: 1, maxLength: 500}
        publisher: {type: string, minLength: 1, maxLength: 500}
        source_url: {type: string, format: uri}
        adapter_key: {type: string, pattern: '^[a-z0-9][a-z0-9._-]*$'}
        cadence: {type: string}
        licence_id: {type: string}
        licence_url: {type: string, format: uri}
        redistribution_policy: {type: string}
        target_features: {type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: {type: string}}
        notes: {type: string, maxLength: 2000}
    RunRequest:
      type: object
      additionalProperties: false
      required: [run_mode, scope]
      properties:
        run_mode: {enum: [full_refresh, reprocess_cached]}
        scope: {type: object, maxProperties: 20}
    Problem:
      type: object
      required: [type, title, status, detail, request_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        request_id: {type: string}
    ReportSection:
      type: object
      additionalProperties: false
      required: [schema_version, property_ref, address_display, identity, release_evidence, evidence_count]
      properties:
        schema_version: {const: propertyscope.report-section.v1}
        property_ref: {type: string, format: uuid}
        address_display: {type: string}
        identity: {type: object}
        release_evidence: {type: array, maxItems: 25, items: {type: object}}
        evidence_count: {type: integer, minimum: 0, maximum: 25}
    ReleaseRecordPreview:
      type: object
      additionalProperties: false
      required: [release, profile, columns, items, count, total, limit, offset, next_offset]
      properties:
        release: {type: object}
        profile: {enum: [property-fixture, gnaf-nsw, psi-sales, bocsar-sparse, schools-master]}
        columns: {type: array, minItems: 1, maxItems: 20, items: {type: string}}
        items: {type: array, maxItems: 100, items: {type: object}}
        count: {type: integer, minimum: 0, maximum: 100}
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 1000000}
        next_offset: {type: [integer, 'null'], minimum: 0, maximum: 1000000}
  responses:
    Page: {description: Bounded page, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, maxItems: 100}, next_cursor: {type: [string, 'null']}}}}}}
    Problem: {description: RFC 9457 Problem Details, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
