schema_version: 1
feature_key: student-1-propertyscope-data-platform
display_name: PropertyScope Data Platform and Property Discovery
owner: student-1
frontend_base_path: /features/data-platform/
backend_base_path: /api/data-platform/v1
health_path: /health/ready
ai_capabilities:
  - platform.capabilities.v1
  - data.sources.v1
  - data.releases.v1
  - data.runs.v1
  - data.run_inspect.v1
  - data.run_explain.v1
  - data.release_inspect.v1
  - data.release_compare.v1
  - data.coverage.v1
  - property.search.v1
  - property.inspect.v1
  - property.locality_summary.v1
  - data.run_retry.v1
  - data.release_publish.v1
onboarding:
  frontend:
    asset_root: student-1/frontend
    service: f1-frontend
    internal_port: 8080
    host_port_variable: PROPERTYSCOPE_PORT
    host_port_default: 5200
    route_fragment: student-1/frontend/integration/research-area.html
  backend:
    service: f1-backend
    internal_port: 5201
    additional_paths:
      - /fragments/data-platform/
  ai:
    tool_catalog: student-1/tool-catalog.yaml
    runtime_path: /etc/ai-mode/propertyscope-tools.yaml
    rag_corpus: student-1/config/rag/corpus.json
    rag_corpus_id: operator-guidance
  quality:
    python_test_paths:
      - student-1/tests
    node_test_files:
      - student-1/tests/frontend/core.test.mjs
      - student-1/tests/frontend/assistant.test.mjs
      - student-1/tests/frontend/release-review.test.mjs
    coverage_packages:
      - propertyscope_data_platform
      - propertyscope_data_store
    coverage_fail_under: 60
  databases:
    - database_service: f1-postgres
      volumes:
        - f1-postgres-data
  evidence_adapter:
    path: student-1/frontend/integration/shell.js
