[project]
name = "student-4-feature"
version = "0.1.0"
description = "Student 4 owned feature slice: Site, Planning, and Building Due Diligence"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
    "httpx>=0.28,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.12,<3",
    "shared-contracts",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src", "database/src"]

[tool.uv.sources]
shared-testkit = { workspace = true }

[dependency-groups]
dev = [
    "shared-testkit",
]
