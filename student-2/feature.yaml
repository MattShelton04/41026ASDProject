schema_version: 1
feature_key: student-2-market-intelligence
display_name: PropertyScope Property Sales Explorer and Market Cases
owner: student-2
frontend_base_path: /features/market-intelligence/
backend_base_path: /api/market-intelligence/v1
health_path: /health/ready
ai_capabilities:
  - market.cases.inspect.v1
  - market.sales.summary.v1
onboarding:
  frontend:
    asset_root: student-2/frontend
    service: f2-frontend
    internal_port: 8080
    host_port_variable: PROPERTYSCOPE_MARKET_INTELLIGENCE_PORT
    host_port_default: 5300
    route_fragment: student-2/frontend/integration/research-area.html
  backend:
    service: f2-backend
    internal_port: 5301
  ai:
    tool_catalog: student-2/tool-catalog.yaml
    runtime_path: /etc/ai-mode/market-intelligence-tools.yaml
  quality:
    python_test_paths:
      - student-2/tests
    node_test_files:
      - student-2/tests/frontend/core.test.mjs
    coverage_packages:
      - propertyscope_market_intelligence
      - propertyscope_market_store
    coverage_fail_under: 70
  databases:
    - database_service: f2-db-api
      volumes:
        - f2-sqlite-data
