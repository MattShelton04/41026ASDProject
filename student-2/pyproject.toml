[project]
name = "student-2-feature"
version = "0.1.0"
description = "Property sales explorer and market cases"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "shared-contracts",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src", "database/src"]

[tool.setuptools.package-data]
propertyscope_market_store = ["sql/*.sql"]

[tool.uv.sources]
shared-testkit = { workspace = true }

[dependency-groups]
dev = [
    "shared-testkit",
]
