server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;
  set $suburb_backend http://f3-backend:5301;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://tiles.openfreemap.org; img-src 'self' data: blob:; worker-src blob:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
  location / { try_files $uri $uri/ /index.html; }
  location /api/suburb-analytics/ {
    proxy_pass $suburb_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 15s;
  }
  location /health/ {
    proxy_pass $suburb_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
