schema_version: 1
services:
  - service: suburb-analytics-backend
    base_url: http://f3-backend:5301
tools:
  - definition:
      name: suburb.published-context.v1
      version: v1
      feature_key: student-3-suburb-analytics
      description: Inspect accepted Feature 1 evidence for one exact NSW locality, including bounded population, school, crime-coverage and source metadata without comparing or ranking suburbs.
      input_schema:
        type: object
        properties:
          locality: {type: string, minLength: 2, maxLength: 80}
        required: [locality]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          locality: {type: string}
          status: {enum: [available, ambiguous, unavailable]}
          population: {type: [object, "null"]}
          schools: {type: array, maxItems: 20, items: {type: object}}
          crime_coverage: {type: array, maxItems: 20, items: {type: object}}
          sources: {type: array, maxItems: 10, items: {type: object}}
          limitations: {type: array, maxItems: 10, items: {type: string}}
        required: [locality, status, population, schools, crime_coverage, sources, limitations]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 4000
      requires_approval: false
    service: suburb-analytics-backend
    method: POST
    path: /api/suburb-analytics/v1/tools/suburb.published-context.v1
  - definition:
      name: suburb.snapshot.v1
      version: v1
      feature_key: student-3-suburb-analytics
      description: Inspect one supported suburb and its bounded nearby-place fixture evidence without making desirability or catchment claims.
      input_schema:
        type: object
        properties:
          locality: {type: string, minLength: 2, maxLength: 80}
        required: [locality]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          suburb: {type: object}
          places: {type: array, maxItems: 20, items: {type: object}}
          limitations: {type: array, maxItems: 10, items: {type: string}}
        required: [suburb, places, limitations]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: suburb-analytics-backend
    method: POST
    path: /api/suburb-analytics/v1/tools/suburb.snapshot.v1
  - definition:
      name: crime.compare.v1
      version: v1
      feature_key: student-3-suburb-analytics
      description: Compare bounded recorded fixture series over one common period and measure; never infer causes, predictions or safety rankings.
      input_schema:
        type: object
        properties:
          localities: {type: array, minItems: 2, maxItems: 5, items: {type: string, minLength: 2, maxLength: 80}}
          from_month: {type: string, pattern: "^[0-9]{4}-[0-9]{2}$"}
          to_month: {type: string, pattern: "^[0-9]{4}-[0-9]{2}$"}
          measure: {enum: [count, rate]}
          offence: {enum: [all_recorded, property, person], default: all_recorded}
        required: [localities, from_month, to_month, measure]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          series: {type: array, minItems: 2, maxItems: 5, items: {type: object}}
          measure: {enum: [count, rate]}
          offence: {enum: [all_recorded, property, person]}
          source_release: {type: string}
          limitations: {type: array, maxItems: 10, items: {type: string}}
        required: [series, measure, offence, source_release, limitations]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 4000
      requires_approval: false
    service: suburb-analytics-backend
    method: POST
    path: /api/suburb-analytics/v1/tools/crime.compare.v1
  - definition:
      name: crime.methodology.v1
      version: v1
      feature_key: student-3-suburb-analytics
      description: Return measure, rate, zero-versus-missing, source release and responsible-use methodology.
      input_schema: {type: object, properties: {}, additionalProperties: false}
      output_schema:
        type: object
        properties:
          geography: {type: string}
          measures: {type: array, maxItems: 5, items: {type: string}}
          offence_categories: {type: array, maxItems: 10, items: {type: string}}
          zero_missing_rule: {type: string}
          rate_method: {type: string}
          responsible_use: {type: string}
          source_release: {type: string}
        required: [geography, measures, offence_categories, zero_missing_rule, rate_method, responsible_use, source_release]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 2000
      requires_approval: false
    service: suburb-analytics-backend
    method: POST
    path: /api/suburb-analytics/v1/tools/crime.methodology.v1
  - definition:
      name: suburb.comparison.inspect.v1
      version: v1
      feature_key: student-3-suburb-analytics
      description: Inspect one saved suburb comparison and its bounded research scope without changing the comparison or its optimistic version.
      input_schema:
        type: object
        properties:
          suburb_comparison_id: {type: string, minLength: 1, maxLength: 100, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"}
        required: [suburb_comparison_id]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          comparison:
            type: object
            properties:
              id: {type: string}
              version: {type: integer, minimum: 1}
              name: {type: string}
              status: {type: string}
              localities: {type: array, minItems: 2, maxItems: 5, items: {type: string}}
              from_month: {type: string, pattern: "^[0-9]{4}-[0-9]{2}$"}
              to_month: {type: string, pattern: "^[0-9]{4}-[0-9]{2}$"}
              measure: {enum: [count, rate]}
              selected_indicators: {type: array, items: {type: string}}
              priorities: {type: array, items: {type: string}}
              notes: {type: string}
            required: [id, version, name, status, localities, from_month, to_month, measure, selected_indicators, priorities, notes]
            additionalProperties: false
          comparison_origin: {enum: [seeded_demonstration, user_saved]}
          limitations: {type: array, minItems: 2, maxItems: 5, items: {type: string}}
        required: [comparison, comparison_origin, limitations]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 3000
      requires_approval: false
    service: suburb-analytics-backend
    method: POST
    path: /api/suburb-analytics/v1/tools/suburb.comparison.inspect.v1
  - definition:
      name: crime.saved-comparison-evidence.v1
      version: v1
      feature_key: student-3-suburb-analytics
      description: Resolve one saved comparison against published crime evidence with explicit period, measure, release, coverage, missing-value and rate-denominator checks; never rank suburb safety.
      input_schema:
        type: object
        properties:
          suburb_comparison_id: {type: string, minLength: 1, maxLength: 100, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"}
        required: [suburb_comparison_id]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          comparison_id: {type: string}
          series:
            type: array
            minItems: 2
            maxItems: 5
            items:
              type: object
              properties:
                locality: {type: string}
                items: {type: array, maxItems: 120, items: {type: object}}
              required: [locality, items]
              additionalProperties: false
          measure: {enum: [count, rate]}
          unit: {enum: [count, "per 100,000"]}
          offence: {const: all_recorded}
          from_month: {type: string, pattern: "^[0-9]{4}-[0-9]{2}$"}
          to_month: {type: string, pattern: "^[0-9]{4}-[0-9]{2}$"}
          source_releases: {type: array, maxItems: 10, uniqueItems: true, items: {type: string}}
          evidence_mode: {enum: [seeded_demonstration, published_release, unavailable]}
          coverage: {enum: [complete, partial, unavailable]}
          limitations: {type: array, minItems: 3, maxItems: 5, items: {type: string}}
          methodology:
            type: object
            properties:
              zero_missing_rule: {type: string}
              rate_method: {type: string}
              responsible_use: {type: string}
            required: [zero_missing_rule, rate_method, responsible_use]
            additionalProperties: false
          validation:
            type: object
            properties:
              period_consistent: {type: boolean}
              measure_consistent: {type: boolean}
              missing_values_preserved: {type: boolean}
              rate_denominator_valid: {type: boolean}
            required: [period_consistent, measure_consistent, missing_values_preserved, rate_denominator_valid]
            additionalProperties: false
        required: [comparison_id, series, measure, unit, offence, from_month, to_month, source_releases, evidence_mode, coverage, limitations, methodology, validation]
        additionalProperties: false
      side_effect: read_only
      timeout_ms: 10000
      requires_approval: false
    service: suburb-analytics-backend
    method: POST
    path: /api/suburb-analytics/v1/tools/crime.saved-comparison-evidence.v1
