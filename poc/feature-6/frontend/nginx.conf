map $http_x_request_id $correlation_request_id {
    "~^[A-Za-z0-9][A-Za-z0-9._:/-]{0,199}$" $http_x_request_id;
    default $request_id;
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $poc_backend http://poc-f6-backend:5601;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/integration-poc/ {
        proxy_pass $poc_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $correlation_request_id;
        proxy_read_timeout 300s;
    }

    location /api/data-import/ {
        proxy_pass $poc_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $correlation_request_id;
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Request-ID $correlation_request_id always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}
