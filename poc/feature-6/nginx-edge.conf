set $integration_poc_upstream http://poc-f6-backend:5601;
set $integration_poc_frontend_upstream http://poc-f6-frontend:8080;

location = /features/integration-poc {
    return 308 /features/integration-poc/;
}

location /features/integration-poc/ {
    rewrite ^/features/integration-poc/(.*)$ /$1 break;
    proxy_pass $integration_poc_frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $correlation_request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /features/integration-poc;
    proxy_read_timeout 10s;
}

location = /api/shared-health/integration-poc {
    proxy_pass $integration_poc_upstream/health/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $correlation_request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 6s;
}

location /api/integration-poc/ {
    proxy_pass $integration_poc_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $correlation_request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
}
