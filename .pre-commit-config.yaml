repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --locked python scripts/check.py typecheck
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: pytest
        name: canonical quality gate
        entry: uv run --locked python scripts/check.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
