repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: >-
          uv run --locked mypy
          shared/contracts/python/shared_contracts
          shared/testkit/python/shared_testkit
          ai-services/agent-core/src/agent_core
          ai-services/ai-mode/src/ai_mode
          examples/integration-test-feature/src/integration_test_feature
          scripts/check.py
          scripts/generate_contracts.py
          scripts/validate_architecture.py
          scripts/validate_model_registry.py
          scripts/validate_tool_catalogs.py
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
