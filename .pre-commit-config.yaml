# A plain `pre-commit install` installs the commit hooks (lint, types, security scans) and the
# pre-push quality gate; CONTRIBUTING.md's explicit `--hook-type` flags still work.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      # Commit-time only: on push the full gate below runs (or already ran) Ruff and mypy.
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
        stages: [pre-commit, manual]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        stages: [pre-commit, manual]
      - id: mypy
        name: mypy
        entry: uv run --locked python scripts/check.py typecheck
        language: system
        pass_filenames: false
        types_or: [python, pyi]
        stages: [pre-commit, manual]
      # Pre-commit security scans (R2-30). The report is `uv run scripts/dev.py security report`.
      - id: security-ruff
        name: "security: Ruff flake8-bandit rules (S)"
        entry: uv run --locked ruff check --select S --no-fix --force-exclude
        language: system
        stages: [pre-commit, manual]
        verbose: true
        require_serial: true
        types_or: [python, pyi]
      - id: security-detect-secrets
        name: "security: detect-secrets against .secrets.baseline"
        entry: uv run --locked python -m scripts.security detect-secrets
        language: system
        stages: [pre-commit, manual]
        verbose: true
        require_serial: true
        types: [text]
      - id: security-pip-audit
        name: "security: pip-audit of locked dependencies (uv.lock)"
        entry: uv run --locked python -m scripts.security pip-audit
        language: system
        stages: [pre-commit, manual]
        verbose: true
        require_serial: true
        pass_filenames: false
        files: ^(uv\.lock|(.+/)?pyproject\.toml|scripts/security/accepted-risks\.toml)$
      # Skips when the pushed commit's tree already passed `scripts/check.py` in this clone;
      # otherwise runs the full gate. Set PROPERTYSCOPE_CHECK_FORCE=1 to always run it.
      - id: pytest
        name: canonical quality gate
        entry: uv run --locked python scripts/check.py pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
