[project]
name = "integration-test-feature"
version = "0.1.0"
description = "Executable HTTP and SQLite feature fixture for shared-platform integration tests"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
    "httpx>=0.28,<1",
    "shared-contracts",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
shared-contracts = { workspace = true }
