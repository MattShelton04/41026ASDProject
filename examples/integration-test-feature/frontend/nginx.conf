map $http_x_request_id $correlation_request_id {
    default $http_x_request_id;
    "" $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location /api/feature/ {
        proxy_pass http://integration-test-feature-backend:5101/api/v1/tools/;
        proxy_set_header X-Request-ID $correlation_request_id;
        proxy_pass_request_headers on;
    }

    location /api/ai/ {
        proxy_pass http://ai-mode:5005/api/v1/;
        proxy_set_header X-Request-ID $correlation_request_id;
        proxy_pass_request_headers on;
    }

    location = /api/health/ai {
        proxy_pass http://ai-mode:5005/health/ready;
        proxy_set_header X-Request-ID $correlation_request_id;
    }

    location = /api/health/feature {
        proxy_pass http://integration-test-feature-backend:5101/health/ready;
        proxy_set_header X-Request-ID $correlation_request_id;
    }
}
