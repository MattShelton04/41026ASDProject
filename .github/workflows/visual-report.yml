name: Visual Report

on:
  workflow_run:
    workflows: [Visual Capture]
    types: [completed]

# This workflow always runs from the default branch. Never check out pull request code here,
# install its dependencies, restore its caches, or execute anything from its artifacts.
env:
  AI_MODE_MCP_ENABLED: "false"
  AI_MODE_RAG_ENABLED: "false"

permissions:
  actions: read
  contents: write
  pull-requests: write
  pages: write

# Publishers serialise per source branch; concurrent gh-pages pushes are rebased and retried.
# GitHub can replace an older pending run in this group when another completion arrives.
concurrency:
  group: visual-report-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: publisher
          persist-credentials: false

      - name: Check out Pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
          # The publisher counts commits to decide when to squash the branch's history.
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Install image dependencies only
        working-directory: publisher
        run: uv sync --locked --only-group visual

      - name: Publish sanitised gallery and comment
        working-directory: publisher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git -C ../site config user.name "github-actions[bot]"
          git -C ../site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --no-sync python -m scripts.visual.publish --site ../site --work ../visual-work

      - name: Retain standalone gallery
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-gallery-${{ github.event.workflow_run.id }}
          path: visual-work/report/
          if-no-files-found: ignore
          retention-days: 30
