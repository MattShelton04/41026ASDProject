name: Student 4 CI

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".python-version"
      - "**/pyproject.toml"
      - "student-4/**"
      - "shared/contracts/**"
      - "shared/tool-runtime/**"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "shared/frontend/**"
      - "deployment/**"
      - "docker-compose*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - ".github/workflows/student-4.yml"
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".python-version"
      - "**/pyproject.toml"
      - ".github/workflows/student-4.yml"
      - "student-4/**"
      - "shared/contracts/**"
      - "shared/tool-runtime/**"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "shared/frontend/**"
      - "deployment/**"
      - "docker-compose*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
  workflow_dispatch:

# Advanced services run only in the local demonstration, never in CI/CD.
env:
  AI_MODE_MCP_ENABLED: "false"
  AI_MODE_RAG_ENABLED: "false"

permissions:
  contents: read

concurrency:
  group: student-4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-4-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Validate R1 contracts and disabled runtime with deterministic doubles
        run: uv run --locked pytest scripts/tests/test_host_runtime.py scripts/tests/test_release1_validation.py shared/contracts/tests/test_retrieval.py shared/tool-runtime/tests ai-services/rag-server/tests/test_embeddings.py --no-cov -q
      - name: Lint and format Feature 4
        run: |
          uv run ruff format --check student-4
          uv run ruff check student-4
      - name: Validate architecture, deployment and tool catalog
        run: |
          uv run python scripts/generate_deployment.py --check
          uv run python scripts/validate_architecture.py
          uv run python scripts/validate_tool_catalogs.py
          uv run python scripts/validate_workspace_packaging.py
      - name: Type-check Feature 4 source
        run: uv run mypy student-4/backend/src/propertyscope_due_diligence student-4/database/src/propertyscope_due_diligence_store
      - name: Run Feature 4 tests
        run: uv run pytest --cov=propertyscope_due_diligence --cov=propertyscope_due_diligence_store --cov-report=term-missing --cov-fail-under=85 student-4/tests
      - name: Check browser JavaScript
        run: |
          node --check student-4/frontend/app.js
          node --import ./scripts/frontend-test-bootstrap.mjs --test student-4/tests/frontend/*.test.mjs shared/frontend/ai-chat/*.test.mjs
      - name: Accept Release 1 grounding and assistant behaviour without live AI
        run: uv run pytest student-4/tests/test_backend_api.py student-4/tests/test_rag_corpus.py -k "assistant or grounded or capabilities or corpus" --no-cov -q
      - name: Build Feature 4 containers
        run: docker compose --file docker-compose.yml --file deployment/enabled-features.compose.yml build f4-db-api f4-backend f4-frontend
      - name: Start Feature 4 fixture stack
        run: docker compose --file docker-compose.yml --file deployment/enabled-features.compose.yml --profile release-0 up --detach --wait --wait-timeout 180 f4-postgres f4-db-api f4-backend f4-frontend
      - name: Smoke CRUD, seed and frontend boundaries
        run: |
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5400/
          curl --fail --silent --show-error --max-time 5 --write-out '%{content_type}' --output /tmp/ai-chat-index.js http://127.0.0.1:5400/ai-chat/index.js | grep -q javascript
          grep -q createFeatureAssistant /tmp/ai-chat-index.js
          curl --fail --silent --show-error --max-time 5 --write-out '%{content_type}' --output /tmp/ai-chat-styles.css http://127.0.0.1:5400/ai-chat/styles.css | grep -q 'text/css'
          grep -q 'ps-ai-chat' /tmp/ai-chat-styles.css
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5400/api/due-diligence/v1/site-reviews --output /tmp/reviews.json
          python -c "import json; value=json.load(open('/tmp/reviews.json', encoding='utf-8')); assert len(value['items']) >= 10, value"
          docker compose --file docker-compose.yml --file deployment/enabled-features.compose.yml exec -T f4-postgres psql -U due_diligence -d due_diligence -t -A -c "SELECT bool_and(c >= 10) FROM (SELECT count(*) AS c FROM due_diligence.site_review UNION ALL SELECT count(*) FROM due_diligence.constraint_observation UNION ALL SELECT count(*) FROM due_diligence.building_observation) AS counts" | tr -d '[:space:]' | grep -qx t
      - name: Capture service logs
        if: failure()
        run: docker compose --file docker-compose.yml --file deployment/enabled-features.compose.yml --profile release-0 logs --no-color --tail 200 f4-postgres f4-db-api f4-backend f4-frontend
      - name: Stop containers and delete ephemeral CI data
        if: always()
        run: docker compose --file docker-compose.yml --file deployment/enabled-features.compose.yml --profile release-0 down --remove-orphans --volumes
