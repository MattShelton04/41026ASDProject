name: Student 1 CI

on:
  push:
    paths:
      - "student-1/**"
      - "shared/contracts/**"
      - "shared/frontend/**"
      - "scripts/**"
      - "docker-compose*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/student-1.yml"
  pull_request:
    paths:
      - "student-1/**"
      - "shared/contracts/**"
      - "shared/frontend/**"
      - "scripts/**"
      - "docker-compose*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/student-1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Check formatting
        run: uv run ruff format --check student-1 scripts
      - name: Lint Feature 1 and repository integration
        run: uv run ruff check student-1 scripts
      - name: Type-check Feature 1
        run: uv run mypy student-1/backend/src student-1/database/src student-1/tests
      - name: Validate architecture and shared contracts
        run: |
          uv run python scripts/validate_architecture.py
          uv run python scripts/generate_contracts.py --check
          uv run python scripts/validate_tool_catalogs.py
      - name: Run deterministic Feature 1 and integration tests
        env:
          PROPERTYSCOPE_NETWORK_ENABLED: "false"
        run: uv run pytest student-1/tests scripts/tests shared/contracts/tests
      - name: Run frontend behavior tests
        run: node --test student-1/tests/frontend/*.test.mjs shared/frontend/*.test.mjs shared/frontend/operations/ai-mode/*.test.mjs

  containers:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Validate default and full-data Compose plans
        run: |
          docker compose --file docker-compose.yml --file docker-compose.integration-test.yml --file docker-compose.dev.yml --profile release-0 --profile integration-test config --quiet
          docker compose --file docker-compose.yml --file docker-compose.integration-test.yml --file docker-compose.dev.yml --file docker-compose.full-data.yml --profile release-0 --profile integration-test --profile full-data config --quiet
      - name: Build Feature 1 targets
        run: |
          docker compose --profile release-0 build propertyscope-shared-frontend propertyscope-database-api propertyscope-database-loader propertyscope-backend propertyscope-runner propertyscope-frontend
      - name: Start bounded fixture stack
        run: |
          docker compose --profile release-0 up --detach --wait --wait-timeout 180 propertyscope-shared-frontend propertyscope-database-api propertyscope-database-loader propertyscope-backend propertyscope-runner propertyscope-frontend
      - name: Verify browser and service health
        run: |
          curl --fail --retry 10 --retry-all-errors http://127.0.0.1:5100/
          curl --fail --retry 10 --retry-all-errors http://127.0.0.1:5200/
          curl --fail --retry 10 --retry-all-errors 'http://127.0.0.1:5200/api/data-platform/v1/properties/search?q=Example&state=NSW&limit=10'
          docker compose exec -T propertyscope-database-api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5202/health/ready', timeout=2)"
          docker compose exec -T propertyscope-backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5201/health/ready', timeout=2)"
      - name: Verify every persistent showcase table has ten records
        run: |
          docker compose exec -T propertyscope-database-api python -c "import json,urllib.request; request=urllib.request.Request('http://127.0.0.1:5202/internal/data-platform/v1/schema/counts',headers={'X-PropertyScope-Internal-Token':'propertyscope-local-development-only'}); counts=json.load(urllib.request.urlopen(request))['tables']; assert counts and min(counts.values()) >= 10, counts"
      - name: Capture deterministic database schema fingerprint
        run: |
          docker compose exec -T propertyscope-database-api python -c "import json,urllib.request; request=urllib.request.Request('http://127.0.0.1:5202/internal/data-platform/v1/schema/fingerprint',headers={'X-PropertyScope-Internal-Token':'propertyscope-local-development-only'}); value=json.load(urllib.request.urlopen(request)); assert value['algorithm']=='sha256' and len(value['fingerprint'])==64, value"
      - name: Capture service logs
        if: failure()
        run: docker compose --profile release-0 logs --no-color --tail 300
      - name: Stop containers without deleting retained data
        if: always()
        run: docker compose --profile release-0 down --remove-orphans
