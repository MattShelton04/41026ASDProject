name: Student 1 CI

on:
  push:
    paths:
      - "student-1/**"
      - "shared/contracts/**"
      - "shared/frontend/**"
      - "scripts/**"
      - "docker-compose*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".pre-commit-config.yaml"
      - ".github/workflows/student-1.yml"
  pull_request:
    paths:
      - "student-1/**"
      - "shared/contracts/**"
      - "shared/frontend/**"
      - "scripts/**"
      - "docker-compose*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".pre-commit-config.yaml"
      - ".github/workflows/student-1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Check formatting
        run: uv run --locked ruff format --check student-1 scripts
      - name: Lint Feature 1 and repository integration
        run: uv run --locked ruff check student-1 scripts
      - name: Type-check Feature 1
        run: uv run --locked mypy student-1/backend/src student-1/database/src student-1/tests
      - name: Validate architecture and shared contracts
        run: |
          uv run --locked python scripts/validate_architecture.py
          uv run --locked python scripts/generate_contracts.py --check
          uv run --locked python scripts/validate_model_registry.py
          uv run --locked python scripts/validate_tool_catalogs.py
      - name: Run deterministic Feature 1 tests with coverage ratchet
        env:
          PROPERTYSCOPE_NETWORK_ENABLED: "false"
        run: |
          uv run --locked pytest \
            --cov=propertyscope_data_platform \
            --cov=propertyscope_data_store \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            student-1/tests
      - name: Run repository integration tests
        run: uv run --locked pytest scripts/tests shared/contracts/tests --no-cov
      - name: Run frontend behavior tests
        run: node --test student-1/tests/frontend/*.test.mjs shared/frontend/*.test.mjs shared/frontend/operations/ai-mode/*.test.mjs

  containers:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    env:
      OPENAI_API_KEY_FILE: /dev/null
      AI_MODE_REQUIRE_PROVIDER_READY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Validate default and full-data Compose plans
        run: |
          docker compose --file docker-compose.yml --file docker-compose.integration-test.yml --file docker-compose.dev.yml --profile release-0 --profile integration-test config --quiet
          docker compose --file docker-compose.yml --file docker-compose.integration-test.yml --file docker-compose.dev.yml --file docker-compose.full-data.yml --profile release-0 --profile integration-test --profile full-data config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build cached Feature 1 targets
        uses: docker/bake-action@82490499d2e5613fcead7e128237ef0b0ea210f7 # v7.0.0
        with:
          source: .
          files: docker-compose.yml
          targets: propertyscope-shared-frontend,ai-mode,propertyscope-database-api,propertyscope-database-loader,propertyscope-backend,propertyscope-runner,propertyscope-frontend
          load: true
          set: |
            propertyscope-shared-frontend.cache-from=type=gha,scope=student1-shared-frontend
            propertyscope-shared-frontend.cache-to=type=gha,mode=max,scope=student1-shared-frontend
            ai-mode.cache-from=type=gha,scope=student1-ai-mode
            ai-mode.cache-to=type=gha,mode=max,scope=student1-ai-mode
            propertyscope-database-api.cache-from=type=gha,scope=student1-database-api
            propertyscope-database-api.cache-to=type=gha,mode=max,scope=student1-database-api
            propertyscope-database-loader.cache-from=type=gha,scope=student1-database-loader
            propertyscope-database-loader.cache-to=type=gha,mode=max,scope=student1-database-loader
            propertyscope-backend.cache-from=type=gha,scope=student1-backend
            propertyscope-backend.cache-to=type=gha,mode=max,scope=student1-backend
            propertyscope-runner.cache-from=type=gha,scope=student1-runner
            propertyscope-runner.cache-to=type=gha,mode=max,scope=student1-runner
            propertyscope-frontend.cache-from=type=gha,scope=student1-frontend
            propertyscope-frontend.cache-to=type=gha,mode=max,scope=student1-frontend
      - name: Start bounded fixture stack
        run: |
          docker compose --profile release-0 up --detach --wait --wait-timeout 180 propertyscope-shared-frontend ai-mode propertyscope-database-api propertyscope-database-loader propertyscope-backend propertyscope-runner propertyscope-frontend
      - name: Verify browser and service health
        run: |
          curl --fail --retry 10 --retry-all-errors http://127.0.0.1:5100/
          curl --fail --retry 10 --retry-all-errors http://127.0.0.1:5100/config.js
          curl --fail --retry 10 --retry-all-errors http://127.0.0.1:5100/features/data-platform/
          curl --fail --retry 10 --retry-all-errors http://127.0.0.1:5100/features/data-platform/app.js
          curl --fail --retry 10 --retry-all-errors http://127.0.0.1:5100/features/data-platform/design-system/tokens.css
          curl --fail --retry 10 --retry-all-errors http://127.0.0.1:5100/operations/ai-mode/
          curl --fail --retry 10 --retry-all-errors http://127.0.0.1:5200/
          curl --fail --retry 10 --retry-all-errors 'http://127.0.0.1:5200/api/data-platform/v1/properties/search?q=Example&state=NSW&limit=10'
          curl --fail --retry 10 --retry-all-errors 'http://127.0.0.1:5100/api/data-platform/v1/properties/search?q=Example&state=NSW&limit=10'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5100/features/market-intelligence/)" = "307"
          curl --silent --head http://127.0.0.1:5100/features/market-intelligence/ | grep --fixed-strings 'Location: /#features'
          test "$(curl --silent --output /tmp/propertyscope-problem.json --write-out '%{http_code}' http://127.0.0.1:5100/api/does-not-exist)" = "404"
          python -c "import json; problem=json.load(open('/tmp/propertyscope-problem.json', encoding='utf-8')); assert problem['code']=='route_not_found' and problem['request_id'], problem"
          docker compose exec -T propertyscope-database-api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5202/health/ready', timeout=2)"
          docker compose exec -T propertyscope-backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5201/health/ready', timeout=2)"
      - name: Verify every persistent showcase table has ten records
        run: |
          docker compose exec -T propertyscope-database-api python -c "import json,urllib.request; request=urllib.request.Request('http://127.0.0.1:5202/internal/data-platform/v1/schema/counts',headers={'X-PropertyScope-Internal-Token':'propertyscope-local-development-only'}); counts=json.load(urllib.request.urlopen(request))['tables']; assert counts and min(counts.values()) >= 10, counts"
      - name: Run the code-driven fixture acquisition pipeline
        run: |
          uv sync --locked --all-packages --all-groups
          uv run --locked scripts/dev.py collect fixture-property --profile test --timeout 120
      - name: Capture deterministic database schema fingerprint
        run: |
          docker compose exec -T propertyscope-database-api python -c "import json,urllib.request; request=urllib.request.Request('http://127.0.0.1:5202/internal/data-platform/v1/schema/fingerprint',headers={'X-PropertyScope-Internal-Token':'propertyscope-local-development-only'}); value=json.load(urllib.request.urlopen(request)); assert value['algorithm']=='sha256' and len(value['fingerprint'])==64, value"
      - name: Capture service logs
        if: failure()
        run: docker compose --profile release-0 logs --no-color --tail 300
      - name: Stop containers and delete ephemeral CI data
        if: always()
        run: docker compose --profile release-0 down --remove-orphans --volumes
