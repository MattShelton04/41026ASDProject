name: Student 1 CI

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/student-1.yml"
      - ".python-version"
      - "**/pyproject.toml"
      - "ai-services/agent-core/**"
      - "ai-services/ai-mode/**"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "deployment/**"
      - "pyproject.toml"
      - "scripts/__init__.py"
      - "scripts/dev.py"
      - "scripts/devtools/**"
      - "shared/contracts/**"
      - "shared/testkit/**"
      - "shared/tool-runtime/**"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "shared/frontend/**"
      - "student-1/**"
      - "student-2/pyproject.toml"
      - "student-3/pyproject.toml"
      - "student-4/pyproject.toml"
      - "student-5/pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/student-1.yml"
      - ".python-version"
      - "**/pyproject.toml"
      - "ai-services/agent-core/**"
      - "ai-services/ai-mode/**"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "deployment/**"
      - "pyproject.toml"
      - "scripts/__init__.py"
      - "scripts/dev.py"
      - "scripts/devtools/**"
      - "shared/contracts/**"
      - "shared/testkit/**"
      - "shared/tool-runtime/**"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "shared/frontend/**"
      - "student-1/**"
      - "student-2/pyproject.toml"
      - "student-3/pyproject.toml"
      - "student-4/pyproject.toml"
      - "student-5/pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

# Advanced services run only in the local demonstration, never in CI/CD.
env:
  AI_MODE_MCP_ENABLED: "false"
  AI_MODE_RAG_ENABLED: "false"

permissions:
  contents: read

concurrency:
  group: student-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  form-browser:
    name: Feature 1 browser forms
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Validate R1 contracts and disabled runtime with deterministic doubles
        run: uv run --locked pytest scripts/tests/test_host_runtime.py scripts/tests/test_release1_validation.py shared/contracts/tests/test_retrieval.py shared/tool-runtime/tests ai-services/rag-server/tests/test_embeddings.py --no-cov -q
      - name: Install Chromium for required form checks
        run: uv run --locked playwright install --with-deps chromium
      - name: Run required Feature 1 form behavior checks
        run: uv run --locked pytest student-1/tests/e2e/test_form_behaviour_playwright.py --no-cov -q

  containers:
    name: Feature 1 integrated stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_MODE_REQUIRE_PROVIDER_READY: "false"
      # The fixture import has ten rows; keep its explicit CI budget bounded without
      # weakening the source-scale Compose defaults used by real PSI/BOCSAR runs.
      PROPERTYSCOPE_LOADER_TEMP_FILE_LIMIT_KIB: "65536"
      PROPERTYSCOPE_LOADER_DISK_RESERVE_BYTES: "1073741824"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Validate the official-source Compose plan
        run: docker compose --file docker-compose.yml --file deployment/enabled-features.compose.yml --file docker-compose.dev.yml --profile release-0 config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build cached Shared and Feature 1 targets
        uses: docker/bake-action@82490499d2e5613fcead7e128237ef0b0ea210f7 # v7.0.0
        with:
          source: .
          files: docker-compose.yml
          targets: shared-frontend,f1-db-api,f1-db-loader,f1-backend,f1-runner,f1-frontend
          load: true
          # Cache availability must not turn successfully built images into a failure.
          # Bound cache I/O independently of the required build and smoke checks.
          set: |
            shared-frontend.cache-from=type=gha,scope=student1-shared-frontend,timeout=2m
            shared-frontend.cache-to=type=gha,mode=max,scope=student1-shared-frontend,timeout=2m,ignore-error=true
            f1-db-api.cache-from=type=gha,scope=student1-database-api,timeout=2m
            f1-db-api.cache-to=type=gha,mode=max,scope=student1-database-api,timeout=2m,ignore-error=true
            f1-db-loader.cache-from=type=gha,scope=student1-database-loader,timeout=2m
            f1-db-loader.cache-to=type=gha,mode=max,scope=student1-database-loader,timeout=2m,ignore-error=true
            f1-backend.cache-from=type=gha,scope=student1-backend,timeout=2m
            f1-backend.cache-to=type=gha,mode=max,scope=student1-backend,timeout=2m,ignore-error=true
            f1-runner.cache-from=type=gha,scope=student1-runner,timeout=2m
            f1-runner.cache-to=type=gha,mode=max,scope=student1-runner,timeout=2m,ignore-error=true
            f1-frontend.cache-from=type=gha,scope=student1-frontend,timeout=2m
            f1-frontend.cache-to=type=gha,mode=max,scope=student1-frontend,timeout=2m,ignore-error=true
      - name: Start bounded fixture stack
        run: |
          docker compose --file docker-compose.yml --file deployment/enabled-features.compose.yml --profile release-0 up --detach --wait --wait-timeout 180 shared-frontend f1-db-api f1-db-loader f1-backend f1-runner f1-frontend
      - name: Run the code-driven fixture acquisition pipeline
        run: |
          uv sync --locked --all-packages --all-groups
          uv run --locked scripts/dev.py data collect fixture-property --timeout 120
      # Two endpoint functions (property search; source-definition CRUD) against the
      # running backend, first on the Feature 1 origin and then through the Shared edge.
      - name: Run Feature 1 endpoint tests on the feature origin
        env:
          PROPERTYSCOPE_ENDPOINT_BASE_URL: http://127.0.0.1:5200
          PROPERTYSCOPE_ENDPOINT_READY_PATH: /health/ready
        run: uv run --locked pytest student-1/tests/endpoints -m endpoint --no-cov -q -rA --junitxml=endpoint-results/student-1-feature-origin.xml
      - name: Run Feature 1 endpoint tests through the Shared edge
        env:
          PROPERTYSCOPE_ENDPOINT_BASE_URL: http://127.0.0.1:5100
          PROPERTYSCOPE_ENDPOINT_READY_PATH: /healthz
        run: uv run --locked pytest student-1/tests/endpoints -m endpoint --no-cov -q -rA --junitxml=endpoint-results/student-1-shared-edge.xml
      - name: Publish endpoint test summary
        if: ${{ !cancelled() && hashFiles('endpoint-results/*.xml') != '' }}
        run: |
          status=0
          for origin in feature-origin shared-edge; do
            report="endpoint-results/student-1-${origin}.xml"
            if [ -f "$report" ]; then
              uv run --locked python -m shared_testkit.junit_summary "$report" --title "Feature 1 endpoint tests (${origin})" --output "endpoint-results/student-1-${origin}.md" --require-success >> "$GITHUB_STEP_SUMMARY" || status=1
            else
              echo "::error::Missing $report" && status=1
            fi
          done
          exit "$status"
      - name: Upload endpoint test results
        if: ${{ !cancelled() && hashFiles('endpoint-results/*.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: student-1-endpoint-tests
          path: endpoint-results/
          if-no-files-found: error
          retention-days: 30
      - name: Smoke the Shared and Feature 1 boundary
        run: |
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5100/features/data-platform/
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5100/vendor/htmx-2.0.10.min.js --output /tmp/shared-htmx.js
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5200/vendor/htmx-2.0.10.min.js --output /tmp/feature-htmx.js
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5100/fragments/research-areas.html --output /tmp/research-areas.html
          curl --fail --silent --show-error --max-time 5 -H 'HX-Request: true' 'http://127.0.0.1:5200/fragments/data-platform/v1/sources?status=all' --output /tmp/source-fragment.html
          grep -q 'data-feature-id="property-records"' /tmp/research-areas.html
          grep -q 'id="source-crud-region"' /tmp/source-fragment.html
          docker compose --file docker-compose.yml --file deployment/enabled-features.compose.yml exec -T f1-db-api python -c "import json,os,urllib.request; request=urllib.request.Request('http://127.0.0.1:5202/internal/data-platform/v1/schema/fingerprint',headers={'X-PropertyScope-Internal-Token':os.environ['PROPERTYSCOPE_INTERNAL_TOKEN']}); value=json.load(urllib.request.urlopen(request,timeout=2)); assert value['algorithm']=='sha256' and len(value['fingerprint'])==64, value"
      - name: Capture service logs
        if: failure()
        run: docker compose --file docker-compose.yml --file deployment/enabled-features.compose.yml --profile release-0 logs --no-color --tail 300
      - name: Stop containers and delete ephemeral CI data
        if: always()
        run: docker compose --file docker-compose.yml --file deployment/enabled-features.compose.yml --profile release-0 down --remove-orphans --volumes
