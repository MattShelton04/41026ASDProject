name: Student 1 CI

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/student-1.yml"
      - ".python-version"
      - "ai-services/agent-core/**"
      - "ai-services/ai-mode/**"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "pyproject.toml"
      - "scripts/__init__.py"
      - "scripts/dev.py"
      - "scripts/devtools/**"
      - "shared/contracts/**"
      - "shared/frontend/**"
      - "student-1/**"
      - "student-2/pyproject.toml"
      - "student-3/pyproject.toml"
      - "student-4/pyproject.toml"
      - "student-5/pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/student-1.yml"
      - ".python-version"
      - "ai-services/agent-core/**"
      - "ai-services/ai-mode/**"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "pyproject.toml"
      - "scripts/__init__.py"
      - "scripts/dev.py"
      - "scripts/devtools/**"
      - "shared/contracts/**"
      - "shared/frontend/**"
      - "student-1/**"
      - "student-2/pyproject.toml"
      - "student-3/pyproject.toml"
      - "student-4/pyproject.toml"
      - "student-5/pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  form-browser:
    name: Feature 1 browser forms
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Install Chromium for required form checks
        run: uv run --locked playwright install --with-deps chromium
      - name: Run required Feature 1 form behavior checks
        run: uv run --locked pytest student-1/tests/e2e/test_form_behaviour_playwright.py --no-cov -q

  containers:
    name: Feature 1 integrated stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY_FILE: /dev/null
      AI_MODE_REQUIRE_PROVIDER_READY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Validate the official-source Compose plan
        run: docker compose --file docker-compose.yml --file docker-compose.dev.yml --profile release-0 config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build cached Shared and Feature 1 targets
        uses: docker/bake-action@82490499d2e5613fcead7e128237ef0b0ea210f7 # v7.0.0
        with:
          source: .
          files: docker-compose.yml
          targets: shared-frontend,shared-ai-mode,f1-db-api,f1-db-loader,f1-backend,f1-runner,f1-frontend
          load: true
          set: |
            shared-frontend.cache-from=type=gha,scope=student1-shared-frontend
            shared-frontend.cache-to=type=gha,mode=max,scope=student1-shared-frontend
            shared-ai-mode.cache-from=type=gha,scope=student1-ai-mode
            shared-ai-mode.cache-to=type=gha,mode=max,scope=student1-ai-mode
            f1-db-api.cache-from=type=gha,scope=student1-database-api
            f1-db-api.cache-to=type=gha,mode=max,scope=student1-database-api
            f1-db-loader.cache-from=type=gha,scope=student1-database-loader
            f1-db-loader.cache-to=type=gha,mode=max,scope=student1-database-loader
            f1-backend.cache-from=type=gha,scope=student1-backend
            f1-backend.cache-to=type=gha,mode=max,scope=student1-backend
            f1-runner.cache-from=type=gha,scope=student1-runner
            f1-runner.cache-to=type=gha,mode=max,scope=student1-runner
            f1-frontend.cache-from=type=gha,scope=student1-frontend
            f1-frontend.cache-to=type=gha,mode=max,scope=student1-frontend
      - name: Start bounded fixture stack
        run: |
          docker compose --profile release-0 up --detach --wait --wait-timeout 180 shared-frontend shared-ai-mode f1-db-api f1-db-loader f1-backend f1-runner f1-frontend
      - name: Run the code-driven fixture acquisition pipeline
        run: |
          uv sync --locked --all-packages --all-groups
          uv run --locked scripts/dev.py data collect fixture-property --timeout 120
      - name: Smoke the Shared and Feature 1 boundary
        run: |
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5100/features/data-platform/
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5100/vendor/htmx-2.0.10.min.js --output /tmp/shared-htmx.js
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5200/vendor/htmx-2.0.10.min.js --output /tmp/feature-htmx.js
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5100/fragments/research-areas.html --output /tmp/research-areas.html
          curl --fail --silent --show-error --max-time 5 -H 'HX-Request: true' 'http://127.0.0.1:5200/fragments/data-platform/v1/sources?status=all' --output /tmp/source-fragment.html
          grep -q 'data-feature-id="property-records"' /tmp/research-areas.html
          grep -q 'id="source-crud-region"' /tmp/source-fragment.html
          curl --fail --silent --show-error --max-time 5 'http://127.0.0.1:5100/api/data-platform/v1/properties/search?q=11%20Example%20Street&state=NSW&limit=10' --output /tmp/propertyscope-search.json
          curl --fail --silent --show-error --max-time 5 'http://127.0.0.1:5200/api/data-platform/v1/sources?status=all' --output /tmp/propertyscope-sources.json
          python -c "import json; value=json.load(open('/tmp/propertyscope-search.json', encoding='utf-8')); assert value.get('items'), value"
          python -c "import json; value=json.load(open('/tmp/propertyscope-sources.json', encoding='utf-8')); assert 'items' in value, value"
          docker compose exec -T f1-db-api python -c "import json,os,urllib.request; request=urllib.request.Request('http://127.0.0.1:5202/internal/data-platform/v1/schema/fingerprint',headers={'X-PropertyScope-Internal-Token':os.environ['PROPERTYSCOPE_INTERNAL_TOKEN']}); value=json.load(urllib.request.urlopen(request,timeout=2)); assert value['algorithm']=='sha256' and len(value['fingerprint'])==64, value"
      - name: Capture service logs
        if: failure()
        run: docker compose --profile release-0 logs --no-color --tail 300
      - name: Stop containers and delete ephemeral CI data
        if: always()
        run: docker compose --profile release-0 down --remove-orphans --volumes
