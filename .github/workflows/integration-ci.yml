name: Integration CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ollama_smoke:
        description: Pull the local model and run the real Ollama structured-output diagnostic
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: integration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Reproduce locked workspace
        run: uv sync --locked --all-packages --all-groups

      - name: Run quality gate
        run: uv run --locked python scripts/check.py

      - name: Run shared and Feature 1 frontend behavior tests
        run: node --test student-1/tests/frontend/*.test.mjs shared/frontend/*.test.mjs shared/frontend/operations/ai-mode/*.test.mjs

      - name: Validate integrated, GPU, and native-Ollama Compose models
        run: |
          docker compose --profile release-0 --profile ollama-container config --quiet
          docker compose --file docker-compose.yml --file docker-compose.gpu.yml --profile release-0 --profile ollama-container config --quiet
          docker compose --file docker-compose.yml --file docker-compose.native-ollama.yml --profile release-0 config --quiet
          docker compose --file docker-compose.yml --file docker-compose.integration-test.yml --profile release-0 --profile integration-test config --quiet

  container:
    name: Build shared Release 0 containers
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the locked non-root shared images
        run: docker compose --profile release-0 build ai-mode propertyscope-shared-frontend

  ollama-smoke:
    name: Optional real Ollama diagnostic
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ollama_smoke }}
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install Python and diagnostic dependencies
        run: |
          uv python install
          uv sync --locked --package ai-mode

      - name: Start pinned Ollama runtime
        run: |
          docker compose --profile ollama-container up --detach --wait --wait-timeout 120 ollama
          docker compose --profile ollama-container run --rm ollama-init

      - name: Run real structured-output diagnostic
        run: uv run --locked ai-mode-ollama-smoke

      - name: Capture runtime status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200 ollama ollama-init

      - name: Stop runtime
        if: always()
        run: docker compose down --remove-orphans
