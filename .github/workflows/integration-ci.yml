name: Integration CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Advanced services run only in the local demonstration, never in CI/CD.
env:
  AI_MODE_MCP_ENABLED: "false"
  AI_MODE_RAG_ENABLED: "false"

permissions:
  contents: read

concurrency:
  group: integration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Canonical quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/actionlint.tar.gz --directory /tmp actionlint
          /tmp/actionlint -ignore 'constant expression "false" in condition'

      - name: Install Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Reproduce locked workspace
        run: uv sync --locked --all-packages --all-groups

      - name: Run quality gate
        run: uv run --locked python scripts/check.py

      - name: Validate integrated Compose model
        run: |
          docker compose --file docker-compose.yml --file deployment/enabled-features.compose.yml --profile release-0 config --quiet
          docker compose --file docker-compose.yml --file deployment/enabled-features.compose.yml --file docker-compose.dev.yml --profile release-0 config --quiet

  # Offline checks of the Azure deployment (ADR-048): Bicep build/lint and parameter files, ShellCheck,
  # Caddy and nginx configuration in their pinned images, and the cloud-init schema. No Azure
  # sign-in or subscription is used. Workflows are linted by actionlint in the quality job.
  iac-lint:
    name: Azure IaC and edge lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Bicep CLI
        env:
          BICEP_VERSION: v0.48.1
        run: |
          az bicep install --version "${BICEP_VERSION}"
          echo "BICEP=${HOME}/.azure/bin/bicep" >> "${GITHUB_ENV}"

      - name: Install cloud-init for schema validation
        run: |
          # The runner's Microsoft apt feed intermittently returns 403 and breaks apt index updates;
          # nothing here installs from it.
          { grep -rlZ packages.microsoft.com /etc/apt/sources.list.d || true; } | xargs -0r sudo rm -f
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends cloud-init

      - name: Validate Bicep, shell scripts, Caddy, nginx and cloud-init
        run: bash deployment/azure/validate-iac.sh --strict

  # The same three pre-commit security scans (R2-30), enforced on every pull request and push.
  security:
    name: Pre-commit security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Reproduce locked tooling
        run: uv sync --locked

      - name: "Security: Ruff flake8-bandit rules (S)"
        run: uv run --locked pre-commit run security-ruff --all-files --show-diff-on-failure

      - name: "Security: detect-secrets against .secrets.baseline"
        run: uv run --locked pre-commit run security-detect-secrets --all-files --show-diff-on-failure

      - name: "Security: pip-audit of uv.lock"
        run: uv run --locked pre-commit run security-pip-audit --all-files

      - name: Write the security testing report
        if: always()
        run: uv run --locked python -m scripts.security report --check --output-dir "${RUNNER_TEMP}/security-report"

      - name: Retain the security testing report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: ${{ runner.temp }}/security-report/
          if-no-files-found: warn
          retention-days: 30
