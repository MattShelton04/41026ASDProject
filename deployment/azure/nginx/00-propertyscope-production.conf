# Production-only http-level settings for the shared nginx edge (R2-B5, ADR-048).
#
# Mounted only by docker-compose.azure.yml into /etc/nginx/conf.d/, next to the unchanged
# default.conf rendered from shared/frontend/nginx.conf. Local development never loads this file.
# Everything here applies at http level and is inherited by the edge's server block, because the
# server block itself defines no limit_req, so the shared edge template stays identical locally
# and in Azure.

server_tokens off;
client_max_body_size 10m;
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;

# Caddy terminates TLS on the same Docker network and replaces X-Forwarded-For with the real
# client address (it ignores client-supplied forwarding headers), so trust it from private ranges
# only. Rate limits below then key on the real client, not on the proxy.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Requests whose key is empty are not counted, so each zone applies only to its own routes.
map $uri $propertyscope_api_limit_key {
    ~^/api/                 $binary_remote_addr;
    ~^/fragments/           $binary_remote_addr;
    default                 "";
}

# AI-mode, operations, assistant/tool and multi-agent routes start model runs or change data:
# a much stricter budget than ordinary reads.
map $uri $propertyscope_sensitive_limit_key {
    ~^/operations/                                                     $binary_remote_addr;
    ~^/api/(?:ai-mode|v1)/                                              $binary_remote_addr;
    ~^/api/[a-z-]+/v1/(?:.+/)?(?:assistant/turns|agent-runs|case-summary-runs|multi-agent)  $binary_remote_addr;
    ~^/api/[a-z-]+/v1/tools/                                            $binary_remote_addr;
    ~^/api/data-platform/v1/(?:artifact-retention|jobs/[^/]+/(?:plans|runs)|ingestion-runs/[^/]+/|dataset-releases/[^/]+/(?:publish|reject|submit-review|retry-delivery))  $binary_remote_addr;
    ~^/api/suburb-analytics/v1/data-imports/                            $binary_remote_addr;
    default                                                             "";
}

limit_req_zone $propertyscope_api_limit_key zone=propertyscope_api:10m rate=20r/s;
limit_req_zone $propertyscope_sensitive_limit_key zone=propertyscope_sensitive:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=propertyscope_conn:10m;

limit_req zone=propertyscope_api burst=40 nodelay;
limit_req zone=propertyscope_sensitive burst=10 nodelay;
limit_conn propertyscope_conn 40;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
